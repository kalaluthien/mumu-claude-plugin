schema_version: "1.0"
name: handoff-lead
execution:
  prompt: "로그인이 가끔 타임아웃 나는 거 고쳐 줘"
  append_system_prompt: "You run as the mumu-team lead agent (`claude --agent mumu-team:lead`): the leader of the project whose checkout is your cwd, the one session that holds its goals."
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
runs: 3
graders:
  - name: no-handoff
    type: tool_used
    tool: Skill
    input_match: handoff
    min: 0
    max: 0
