<!-- page: the shell of every Artifact page, copied whole; fill each {{...}} or delete its element.
  main: the h1, a p.read of the one thing to read off the page, a nav linking each h2 by its id (4 or more h2s, or
  chapters; else delete it), the widgets and plain HTML in move order, and a footer citing the source at a sha.
  chapters: parts that each hold sections are each a <section data-chapter> opening with its <h2 id>, sections as h3s;
  the page shows the chapter holding the URL's #id (none: the first), adds a pager, and marks the nav link shown.
  reading aids, added by the script: the nav becomes a contents drawer (a 목차 button, a backdrop, Esc; modal while
  open, the page behind it inert; docked open from 75rem) listing the h3s of each chapter under its link and marking the heading in view; a 맨 위로 button once
  scrolled; after an in-page link, a 돌아가기 button back to the spot before it, and a flash on the link's target.
  choice: a div role="group" data-choice of buttons, one pressed at a time, the first at start; a click presses one and
  fires `change` on the group, which a widget's script reads by its [aria-pressed="true"] button.
  slide: a root with data-slide and data-labels="뒤로|다음" over an <ol class="steps">: one stage changes in place, Back,
  Next, the arrow keys and a count; the reader compares the same marks. Played, at step k each [data-step] up to k gets
  .on, the one at k .now, the root data-at k - 1 and a `step` event; under reduced motion, in print or without script,
  every caption stays listed, every chapter shown, and the widget stands at its last step.
  table: only for values the reader compares across rows, few columns, the first a row label, headers with scope;
  each one <div class="scroll" role="region" aria-labelledby="t-<id>" tabindex="0"> holding the <table> and its
  <caption id="t-<id>">, so a wide one scrolls in its box with its first column held; a number cell class="num".
  math: TeX in prose, \( … \) inline and \[ … \] display, never inside code; assemble.py then adds KaTeX, which sets
  it in its TeX fonts, and a display equation wider than the column scrolls in its own box. -->
<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style id="skin">
@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700&display=swap");
/* skin: the owner's design system.
   Look: a major textbook, ink on cream paper, always light: a page never
   follows a dark system or host theme. Prose is Nanum Myeongjo 400 at 10pt,
   leading 1.7, justified with a 1em first-line indent; headings, captions,
   controls, figure labels and metadata are Nanum Gothic: h2 at 800 numbered
   ❶, h3 at 700 numbered (1); the h1 a chapter block, Myeongjo 700 on a grey
   band under a double rule; a defined term (dfn) at 700, upright, since
   Hangul has no italic. Lists take dashes, the footer a dotted rule.
   Corners square, no shadows. The accent is Claude's orange, a step deeper
   (#d97757 is 2.8:1 on --fill, under a mark's 3:1): focus, hover and the
   current step; text in orange, the heading numbers and links, takes
   --accent-text, deeper again for 4.5:1.
   Borders on controls and figure boxes are ink; row dividers are --hairline.
   Tables are booktabs, captioned 표 n. above; figures 그림 n. below.
   Tokens in three tiers: a primitive (--p-*) holds a raw value two roles or
   more share; a semantic token names a role; each widget defines its own
   --<widget>-* tokens from semantic ones and reads nothing else.
   Layout: one column of --page-width, a --gutter each side, sections --rhythm
   apart; from 75rem the contents drawer docks beside it, --drawer-width wide;
   at 320 px nothing scrolls sideways but a .scroll box, which holds a
   table's first column in view; a long word, code or url wraps.
   Tables: smaller type than prose; a number cell right-aligned, unwrapped;
   a text cell at least 6em and broken between words, as Korean is set.
   Motion: --motion-fast for hover and focus, --motion for a reveal, easing
   --ease-out; only a change of state animates, none under reduced motion.
   Fonts: the one fetch a page makes; offline, installed faces. */
@counter-style circled { system: fixed; symbols: "❶" "❷" "❸" "❹" "❺" "❻" "❼" "❽" "❾" "❿"; suffix: " "; }
:root {
  color-scheme: light;
  /* primitives */
  --p-black: #1b1a18; --p-white: #fcfbf7; --p-grey-500: #67635c;
  --p-size-1: .25rem; --p-size-4: 1rem;

  /* semantic: colour roles, light only */
  --text: var(--p-black);
  --muted: var(--p-grey-500);
  --bg: var(--p-white);
  --fill: #f4f2ec;
  --border: #6f6b63;
  --hairline: #d9d5cb;
  --accent: #c96442;
  --accent-text: #a9502f;
  --link: var(--accent-text);
  --chapter: #5b5953;
  /* semantic: diagram palette; kinds (told apart under deuteranopia and
     protanopia) mark a node's kind by its edge and a chart's series; status
     colours mark success, warning and failure in text and edges */
  --kind-1: var(--p-black);
  --kind-2: var(--accent);
  --kind-3: #4f6d8a;
  --kind-4: #8c8274;
  --ok: #1f7a3a;
  --warn: #855600;
  --fail: #b8302a;
  /* semantic: type, space, line, radius, layout, motion */
  --serif: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  --sans: "Nanum Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: ui-monospace, monospace;
  /* type: body 10pt, each size a ratio of it; none under 12px, check.py's floor for Hangul */
  --fs-base: 10pt; --fs-s: max(12px, .8 * var(--fs-base)); --fs-m: max(12px, .9 * var(--fs-base));
  --fs-l: calc(1.1 * var(--fs-base)); --fs-h2: calc(1.3 * var(--fs-base)); --fs-h1: calc(1.8 * var(--fs-base));
  --fs-svg: max(12px, .875 * var(--fs-base)); --fs-svg-label: max(12px, .75 * var(--fs-base));
  --fs-table: var(--fs-m);
  --sp-1: var(--p-size-1); --sp-2: .5rem; --sp-3: .75rem;
  --sp-4: var(--p-size-4); --sp-5: 1.75rem;
  --line: 1px; --line-strong: 2px; --line-mark: 3px;
  --radius-s: 0;
  --page-width: 36rem; --gutter: var(--p-size-4); --rhythm: 2.5rem;
  --motion-fast: 100ms; --motion: 200ms;
  --ease-out: cubic-bezier(.2, .7, .3, 1);
  --scroll-step: 60vh;
  --drawer-width: 16rem;
  --mark: #efe9d2;
  --disabled: .5;
}

/* layout */
body { background: var(--bg); color: var(--text); margin: 0; font: 400 var(--fs-base)/1.7 var(--serif);
       padding: var(--rhythm) var(--gutter); overflow-wrap: break-word; word-break: keep-all; }
main { max-width: var(--page-width); margin: 0 auto; counter-reset: h2 h3 fig tab; }
main p:not(.read) { text-align: justify; }
main > p:not(.read), main > section > p { text-indent: 1em; }
h1, h2, h3, figcaption, caption, summary, button, nav, footer, th, .tip, .count, .muted { font-family: var(--sans); }
/* chapter block: the title on a grey band under a double rule */
h1 { font: 700 var(--fs-h1)/1.35 var(--serif); text-align: center; color: var(--bg); background: var(--chapter);
     padding: var(--rhythm) var(--sp-4); margin: 0 0 var(--rhythm); border-top: var(--line-mark) double var(--chapter);
     box-shadow: 0 calc(-1 * var(--sp-2)) 0 calc(-1 * var(--line)) var(--bg), 0 calc(-1 * var(--sp-2) - var(--line)) 0 0 var(--chapter); }
/* heading with its circled number, subheading (1) */
h2 { font-weight: 800; font-size: var(--fs-h2); letter-spacing: -.01em; line-height: 1.2;
     margin: calc(1.25 * var(--rhythm)) 0 var(--sp-3); counter-increment: h2; counter-reset: h3; }
main > h2::before, main > section > h2::before { content: counter(h2, circled) "\00a0"; color: var(--accent-text); }
h3 { font: 700 var(--fs-l)/1.4 var(--sans); margin: var(--sp-4) 0 var(--sp-2); counter-increment: h3; }
h3::before { content: "(" counter(h3) ") "; }
a { color: var(--link); }
:is(h1, h2) code { font-size: .8em; }
/* dash lists */
main ul { padding-inline-start: 1.5em; }
main ul > li { list-style: "– "; }
main ul > li::marker { font-family: var(--sans); }
.read { border-block: var(--line) solid var(--text); padding: var(--sp-3) var(--sp-2); }
nav { font-size: var(--fs-m); }
.muted { color: var(--muted); font-size: var(--fs-m); }
/* footnote rule */
footer { color: var(--muted); font-size: var(--fs-s); line-height: 1.6; margin-top: var(--rhythm); padding-top: var(--sp-3);
         border-top: var(--line) dotted var(--border); }
code, pre { font-family: var(--mono); font-size: var(--fs-m); }
pre { overflow-x: auto; border-inline-start: var(--line) solid var(--text); padding: 0 var(--sp-3); }
.scroll { overflow-x: auto; }
figure { margin: 0; }
figure.code figcaption { overflow-wrap: anywhere; }
pre mark { display: inline-block; min-width: 100%; background: var(--mark); color: inherit; }
/* tables: booktabs, the caption above as 표 n. */
table { border-collapse: collapse; min-width: 100%; font-size: var(--fs-table); border-block: var(--line-strong) solid var(--text); }
th, td { padding: var(--sp-2) var(--sp-3); text-align: start; vertical-align: top; word-break: keep-all; }
thead th { border-bottom: var(--line) solid var(--text); font-weight: 700; text-align: center; }
:is(th, td):not(.num) { min-width: 6em; }
tbody th { font-weight: normal; }
dfn { font-style: normal; font-weight: 700; }
caption { text-align: start; font-size: var(--fs-m); padding-bottom: var(--sp-2); counter-increment: tab; }
caption::before { content: "표 " counter(tab) ". "; font-weight: 700; }
.scroll :is(th, td):first-child { position: sticky; inset-inline-start: 0; background: var(--bg); }
.num { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .fail { color: var(--fail); }

/* states: default, hover, focus, open, disabled; [data-state] forces one for
   the test gallery */
:focus-visible, [data-state="focus"] :is(summary, button, textarea, [tabindex]) {
  outline: var(--line-strong) solid var(--accent); outline-offset: var(--line-strong); }
summary { cursor: pointer; font-size: var(--fs-m); color: var(--muted); transition: color var(--motion-fast) var(--ease-out); }
summary:hover, [data-state="hover"] summary { color: var(--accent-text); }
details[open] > :not(summary) { animation: reveal var(--motion) var(--ease-out); }
@keyframes reveal { from { opacity: 0; transform: translateY(calc(-1 * var(--sp-1))); } }
/* controls: thin ink frames like the manual's boxed labels */
button { font: 400 var(--fs-m) var(--sans); color: var(--text); background: var(--bg); cursor: pointer;
         border: var(--line) solid var(--text); border-radius: var(--radius-s); padding: var(--sp-1) var(--sp-3);
         transition: border-color var(--motion-fast) var(--ease-out); }
button:hover, [data-state="hover"] button { border-color: var(--accent); }
textarea, input, select { font: var(--fs-base) var(--sans); color: var(--text); background: var(--fill);
           border: var(--line) solid var(--border); border-radius: var(--radius-s); }
:disabled { opacity: var(--disabled); cursor: not-allowed; }

@media screen and (min-width: 75rem) {
  body:has(main nav.drawer) { padding-inline-start: calc(var(--drawer-width) + 2 * var(--gutter)); }
  :root main nav.drawer { transform: none; visibility: visible; }
  .dock .contents, .backdrop { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after { animation: none !important; transition: none !important; }
}
</style>
<style>
  [role="group"][data-choice] { display: flex; flex-wrap: wrap; }
  [role="group"][data-choice] > button + button { border-inline-start-width: 0; }
  [role="group"][data-choice] > [aria-pressed="true"] { font-weight: 700; text-decoration: underline; text-underline-offset: var(--sp-1); }
  .katex-display { overflow-x: auto; overflow-y: hidden; padding-block: var(--sp-1); }
  [data-chapter] .pager { display: flex; justify-content: space-between; gap: var(--sp-3); margin-top: var(--rhythm);
    padding-top: var(--sp-3); border-top: var(--line) solid var(--hairline); font-family: var(--sans); }
  [data-chapter] .pager [rel="next"] { margin-inline-start: auto; text-align: end; }
  main nav [aria-current] { color: var(--text); font-weight: 700; }
  @media print { [data-chapter][hidden] { display: block; } [data-chapter] .pager { display: none; } }
  [data-slide] .steps { margin: var(--sp-2) 0; }
  [data-slide] :is(.caption, .controls) { display: none; }
  [data-slide] .controls { gap: var(--sp-2); align-items: center; margin: var(--sp-2) 0; }
  [data-slide] .count { color: var(--muted); font-size: var(--fs-m); font-variant-numeric: tabular-nums; }
  @media screen and (prefers-reduced-motion: no-preference) {
    [data-slide].live .steps { display: none; }
    [data-slide].live .caption { display: block; }
    [data-slide].live .controls { display: flex; }
  }
  main nav.drawer { position: fixed; z-index: 3; inset-block: 0; inset-inline-start: 0; overflow-y: auto;
    width: min(var(--drawer-width), 85%); box-sizing: border-box; padding: var(--rhythm) var(--gutter);
    background: var(--bg); border-inline-end: var(--line) solid var(--hairline); transform: translateX(-100%);
    visibility: hidden; transition: transform var(--motion) var(--ease-out), visibility var(--motion); }
  main nav.drawer.open { transform: none; visibility: visible; transition-property: transform; }
  main nav.drawer ol { padding-inline-start: var(--sp-4); }
  main nav.drawer li:not(:has(> [aria-current])) > ol { display: none; }
  main nav.drawer a { display: block; padding-inline-start: var(--sp-2); border-inline-start: var(--line-mark) solid transparent; }
  main nav.drawer a.here { border-color: var(--accent); color: var(--text); }
  .backdrop { position: fixed; z-index: 2; inset: 0; background: var(--text); opacity: .3; }
  .dock { position: fixed; z-index: 1; inset-block-end: var(--sp-4); inset-inline-end: var(--gutter); display: flex;
    gap: var(--sp-2); max-width: calc(100% - 2 * var(--gutter)); }
  .dock .back { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body:has(.dock) { padding-bottom: calc(3 * var(--rhythm)); }
  .flash { animation: flash calc(8 * var(--motion)) var(--ease-out); }
  @keyframes flash { from { background: var(--mark); } }
  @media print { main nav.drawer { position: static; transform: none; visibility: visible; } .dock, .backdrop { display: none; } }
</style>
<main>
  <h1>{{title, a noun phrase}}</h1>
  <p class="read">{{the one thing to read off the page}}</p>
  <nav><ol><li><a href="#{{id}}">{{h2}}</a></li></ol></nav>
  {{widgets and plain HTML, in move order}}
  <section data-chapter>
    <h2 id="{{id}}">{{part, when parts hold sections}}</h2>
    <h3 id="{{id}}">{{section}}</h3>
    {{its widgets and plain HTML}}
  </section>
  <footer>{{source}} <code>{{sha}}</code></footer>
</main>
<script>
  // math, before the scripts that read headings: KaTeX, which assemble.py loads only for a body with TeX, sets it
  if (window.renderMathInElement) renderMathInElement(document.querySelector('main') || document.body, {
    delimiters: [{ left: '\\[', right: '\\]', display: true }, { left: '\\(', right: '\\)', display: false }],
    throwOnError: false });
</script>
<script>
  (() => {
    // choice: one pressed button per group, for the widgets that read it
    const press = (g, b) => g.querySelectorAll(':scope > button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    const start = () => document.querySelectorAll('[role="group"][data-choice]').forEach((g) => {
      press(g, g.querySelector(':scope > [aria-pressed="true"]') || g.querySelector(':scope > button'));
    });
    document.addEventListener('click', (e) => {
      const b = e.target.closest && e.target.closest('[role="group"][data-choice] > button');
      if (!b || b.getAttribute('aria-pressed') === 'true') return;
      press(b.parentElement, b);
      b.parentElement.dispatchEvent(new Event('change', { bubbles: true }));
    });
    if (document.readyState === 'loading') addEventListener('DOMContentLoaded', start); else start();
  })();
</script>
<script>
  (() => {
    const start = () => {
      const chapters = [...document.querySelectorAll('[data-chapter]')];
      if (chapters.length < 2) return;
      const head = (c) => c.querySelector('h2');
      chapters.forEach((c, i) => {
        const pager = document.createElement('div');
        pager.className = 'pager';
        [[chapters[i - 1], 'prev'], [chapters[i + 1], 'next']].forEach(([to, rel]) => {
          if (!to) return;
          const a = document.createElement('a');
          a.href = `#${head(to).id}`;
          a.rel = rel;
          const name = head(to).textContent.trim();
          a.textContent = rel === 'prev' ? `← ${name}` : `${name} →`;
          pager.append(a);
        });
        c.append(pager);
      });
      let shown = null;
      const show = () => {
        const id = decodeURIComponent(location.hash.slice(1));
        const target = id ? document.getElementById(id) : null;
        const at = !id ? chapters[0] : (target && target.closest('[data-chapter]')) || shown || chapters[0];
        chapters.forEach((c) => { c.hidden = c !== at; });
        document.querySelectorAll('main nav a[href^="#"]').forEach((a) => {
          const to = document.getElementById(decodeURIComponent(a.hash.slice(1)));
          if (to && at.contains(to)) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current');
        });
        shown = at;
        if (target && at.contains(target)) target.scrollIntoView();
      };
      addEventListener('hashchange', show);
      show();
    };
    if (document.readyState === 'loading') addEventListener('DOMContentLoaded', start); else start();
  })();
</script>
<script>
  (() => {
    const start = () => document.querySelectorAll('[data-slide]').forEach((root) => {
      const steps = [...root.querySelectorAll('.steps > li')];
      const n = steps.length;
      if (n < 2 || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const caption = document.createElement('p');
      caption.className = 'caption';
      caption.setAttribute('aria-live', 'polite');
      const controls = document.createElement('div');
      controls.className = 'controls';
      controls.innerHTML = '<button type="button"></button><button type="button"></button><span class="count"></span>';
      root.append(caption, controls);
      const [back, next] = controls.querySelectorAll('button');
      [back.textContent, next.textContent] = (root.dataset.labels || 'Back|Next').split('|');
      let at = 1;
      const show = (k) => {
        at = Math.min(Math.max(k, 1), n);
        root.querySelectorAll('[data-step]').forEach((el) => {
          el.classList.toggle('on', +el.dataset.step <= at);
          el.classList.toggle('now', +el.dataset.step === at);
        });
        root.dataset.at = at - 1;
        root.dispatchEvent(new CustomEvent('step'));
        caption.textContent = `${at}. ${steps[at - 1].textContent.trim()}`;
        controls.querySelector('.count').textContent = `${at} / ${n}`;
        back.disabled = at === 1;
        next.disabled = at === n;
      };
      back.addEventListener('click', () => show(at - 1));
      next.addEventListener('click', () => show(at + 1));
      root.addEventListener('keydown', (e) => {
        const d = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
        if (d && !e.target.closest('svg')) { e.preventDefault(); show(at + d); }
      });
      root.classList.add('live');
      show(1);
    });
    if (document.readyState === 'loading') addEventListener('DOMContentLoaded', start); else start();
  })();
</script>
<script>
  (() => {
    // reading aids: the contents drawer, the heading in view, back to the top, and back to the spot before a link
    const start = () => {
      const nav = document.querySelector('main nav');
      const dock = document.createElement('div');
      dock.className = 'dock';
      const button = (name, text, label) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = name;
        b.textContent = text;
        if (label) b.setAttribute('aria-label', label);
        b.hidden = true;
        dock.append(b);
        return b;
      };
      const back = button('back', '');
      const top = button('top', '↑', '맨 위로');
      document.body.append(dock);
      const target = (a) => document.getElementById(decodeURIComponent(a.hash.slice(1)));
      let links = [];
      if (nav) {
        nav.querySelectorAll('a[href^="#"]').forEach((a) => {
          const h = target(a);
          const chapter = h && h.matches('[data-chapter] > h2') && h.closest('[data-chapter]');
          const heads = chapter ? [...chapter.querySelectorAll('h3[id]')] : [];
          if (!heads.length || a.parentElement.querySelector('ol')) return;
          const ol = document.createElement('ol');
          heads.forEach((s) => {
            const li = document.createElement('li');
            const x = document.createElement('a');
            x.href = `#${s.id}`;
            x.textContent = s.textContent.trim();
            li.append(x);
            ol.append(li);
          });
          a.after(ol);
        });
        links = [...nav.querySelectorAll('a[href^="#"]')];
        nav.id = nav.id || 'contents';
        nav.classList.add('drawer');
        const toggle = button('contents', '목차');
        toggle.hidden = false;
        toggle.setAttribute('aria-controls', nav.id);
        const backdrop = document.createElement('div');
        backdrop.className = 'backdrop';
        document.body.append(backdrop);
        const docked = matchMedia('(min-width: 75rem)');
        // open over the page, the drawer is modal: all but it and its backdrop is inert, so Tab stays in it
        const set = (open) => {
          nav.classList.toggle('open', open);
          backdrop.hidden = !open;
          for (let el = nav; el !== document.body; el = el.parentElement) {
            [...el.parentElement.children].forEach((x) => { if (x !== el && x !== backdrop) x.inert = open && !docked.matches; });
          }
          toggle.setAttribute('aria-expanded', open);
          if (!open && nav.contains(document.activeElement)) toggle.focus();
        };
        toggle.addEventListener('click', () => {
          set(!nav.classList.contains('open'));
          if (nav.classList.contains('open')) (nav.querySelector('[aria-current] ~ ol .here, .here, a') || nav).focus();
        });
        backdrop.addEventListener('click', () => set(false));
        nav.addEventListener('click', (e) => { if (e.target.closest('a') && !docked.matches) set(false); });
        addEventListener('keydown', (e) => { if (e.key === 'Escape' && nav.classList.contains('open')) set(false); });
        docked.addEventListener('change', () => set(false));
        set(false);
      }
      // the last heading shown above a quarter of the window, marked in the contents
      const above = (h) => h.checkVisibility() && h.getBoundingClientRect().top <= innerHeight / 4;
      let queued = false;
      const spy = () => {
        queued = false;
        top.hidden = scrollY < innerHeight;
        let here = null;
        links.forEach((a) => {
          const h = target(a);
          if (h && above(h) && (!here || target(here).getBoundingClientRect().top <= h.getBoundingClientRect().top)) here = a;
        });
        links.forEach((a) => a.classList.toggle('here', a === here));
      };
      const soon = () => { if (!queued) { queued = true; requestAnimationFrame(spy); } };
      addEventListener('scroll', soon, { passive: true });
      addEventListener('resize', soon);
      top.addEventListener('click', () => scrollTo({ top: 0 }));
      // each entry an in-page link left keeps its scroll spot in history.state; the entry it opened keeps where from
      const where = () => {
        let at = '';
        document.querySelectorAll('main :is(h2, h3)').forEach((h) => { if (above(h)) at = h.textContent.trim(); });
        return at;
      };
      const label = () => {
        const s = history.state;
        back.hidden = !(s && 'from' in s);
        back.textContent = s && s.from ? `← 돌아가기 · ${s.from}` : '← 돌아가기';
      };
      document.addEventListener('click', (e) => {
        const a = e.target.closest && e.target.closest('a[href^="#"]');
        if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        const to = target(a);
        if (!to) return;
        if (a.hash !== location.hash) {
          const from = where();
          history.replaceState({ ...history.state, y: scrollY }, '');
          setTimeout(() => { history.replaceState({ from }, ''); label(); });
        }
        setTimeout(() => {
          to.classList.remove('flash');
          void to.offsetWidth;
          to.classList.add('flash');
        });
      });
      document.addEventListener('animationend', (e) => { if (e.animationName === 'flash') e.target.classList.remove('flash'); });
      back.addEventListener('click', () => { if (history.state && 'from' in history.state) history.back(); });
      // back to the spot once the entry's target is shown: after the chapter script's hashchange when the hash moved,
      // else at once; a chapter still hidden is waited for frame by frame
      let spot = null, hash = location.hash;
      const restore = (frames = 120) => {
        if (spot === null) return soon();
        const to = document.getElementById(decodeURIComponent(location.hash.slice(1))) || document.querySelector('main');
        if (to && !to.checkVisibility() && frames) return requestAnimationFrame(() => restore(frames - 1));
        scrollTo(0, spot);
        spot = null;
        soon();
      };
      addEventListener('popstate', (e) => {
        label();
        const moved = location.hash !== hash;
        hash = location.hash;
        if (e.state && typeof e.state.y === 'number') { spot = e.state.y; if (!moved) restore(); }
      });
      addEventListener('hashchange', () => { hash = location.hash; restore(); });
      label();
      spy();
    };
    if (document.readyState === 'loading') addEventListener('DOMContentLoaded', start); else start();
  })();
</script>
</html>
