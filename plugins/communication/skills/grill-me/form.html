<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{target}}: round {{n}}</title>
<!-- grill-me's round form. One fieldset per question of the round, its
     recommendation prefilled; the page writes nowhere and builds the block
     SKILL.md reads. The skin block is show-me's page.html's, verbatim. -->
<style>
  /* skin */
  :root {
    color-scheme: light dark;
    --bg: #fbfaf7; --fg: #1d1d1f; --muted: #5b5f66; --line: #cfccc4;
    --box: #ffffff; --accent: #2458c6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --fg: #ececec; --muted: #a3a7ae; --line: #45484d;
      --box: #222427; --accent: #8fb4ff;
    }
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17181a; --fg: #ececec; --muted: #a3a7ae; --line: #45484d;
    --box: #222427; --accent: #8fb4ff;
  }
  body { background: var(--bg); color: var(--fg); margin: 0;
         font: 16px/1.5 system-ui, sans-serif; padding-block: 24px; padding-inline: 16px; }
  main { max-width: 48rem; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  h2 { font-size: 1.15rem; margin: 1.75rem 0 .5rem; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg text { fill: var(--fg); font: 14px system-ui, sans-serif; }
  svg .label { fill: var(--muted); font-size: 12px; }
  /* skin end */
  h1 { margin: 0 0 1rem; }
  fieldset { border: 1px solid var(--line); margin: 0 0 1rem; padding: .75rem 1rem; }
  legend { font-weight: 600; padding: 0 .25rem; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; }
  #out { margin-top: 1rem; font-family: ui-monospace, monospace; }
</style>

<main>
  <h1>{{target}}: round {{n}}</h1>

  <form id="round" data-target="{{target}}" data-round="{{n}}">
    <fieldset>
      <legend>Q1: {{question title}}</legend>
      <p>{{question body}}</p>
      <p><strong>Recommended:</strong> {{recommended answer}}</p>
      <label for="Q1">Answer</label>
      <textarea id="Q1" name="Q1" rows="3">{{recommended answer}}</textarea>
    </fieldset>

    <button type="submit">Build the answer block</button> <span id="status" role="status"></span>
    <label for="out" hidden>Answer block</label>
    <textarea id="out" rows="8" readonly hidden></textarea>
  </form>
</main>

<script>
  const form = document.getElementById('round');
  const out = document.getElementById('out');
  const status = document.getElementById('status');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const answers = [...form.querySelectorAll('fieldset textarea')].map((t) => {
      const lines = t.value.trim() ? t.value.trim().split('\n') : [];
      return [`${t.name}:`, ...lines.map((l) => `  ${l}`)].join('\n');
    });
    out.value = [`grill-me: ${form.dataset.target}, round ${form.dataset.round}`, ...answers].join('\n');
    out.hidden = false;
    out.labels[0].hidden = false;
    out.select();
    try {
      await navigator.clipboard.writeText(out.value);
      status.textContent = 'Copied: paste it into the chat';
    } catch {
      status.textContent = 'Selected: copy it and paste it into the chat';
    }
  });
</script>
</html>
