schema_version: "1.0"
name: spec
context:
  scaffold_script: setup.sh
execution:
  prompt: "Add partial refunds to orders.py: refund(amount) may be called several times on a paid order, and the order counts as refunded once the refunds reach the price. An order must never end up both shipped and fully refunded."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
graders:
  - name: fires
    type: tool_used
    tool: Skill
    input_match: "verification:spec"
    min: 1
