name: check-repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Users run macOS, whose system Python is 3.9, so newer syntax must fail here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # list-unreleased.py compares HEAD with the release tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: oven-sh/setup-bun@v2  # the `.ts` fixture runners run under bun
      - run: python3 .github/check-repository.py
