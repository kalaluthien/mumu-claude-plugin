<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diagram</title>
<style>
body { font-family: -apple-system, sans-serif; margin: 20px 380px 20px 20px; }
svg rect { fill: #eef3fb; stroke: #345; }
svg line { stroke: #345; }
</style>
</head>
<body>
<h1>Diagram</h1>
<svg id="canvas"></svg>
<script type="application/json" id="diagram">
{
 "nodes": [
  {"id": "idea", "label": "Idea"},
  {"id": "plan", "label": "Plan"},
  {"id": "build", "label": "Build"}
 ],
 "edges": [["idea", "plan"], ["plan", "build"]]
}
</script>
<script>
(() => {
  const { nodes = [], edges = [] } = JSON.parse(document.getElementById("diagram").textContent);
  const svg = document.getElementById("canvas");
  const svgns = "http://www.w3.org/2000/svg";
  const depth = {};
  const incoming = new Set(edges.map((edge) => edge[1]));
  const queue = nodes.filter((node) => !incoming.has(node.id)).map((node) => node.id);
  queue.forEach((id) => { depth[id] = 0; });
  while (queue.length) {
    const id = queue.shift();
    for (const [from, to] of edges) if (from === id && depth[to] === undefined) { depth[to] = depth[id] + 1; queue.push(to); }
  }
  const rows = {}, place = {};
  for (const node of nodes) {
    const column = depth[node.id] ?? 0;
    rows[column] = (rows[column] || 0) + 1;
    place[node.id] = { x: 20 + column * 220, y: 20 + (rows[column] - 1) * 90 };
  }
  svg.setAttribute("width", 40 + (Math.max(0, ...Object.values(depth)) + 1) * 220);
  svg.setAttribute("height", 40 + Math.max(1, ...Object.values(rows)) * 90);
  svg.innerHTML = '<defs><marker id="diagram-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>';
  for (const [from, to] of edges) {
    if (!place[from] || !place[to]) continue;
    const line = document.createElementNS(svgns, "line");
    Object.entries({ x1: place[from].x + 160, y1: place[from].y + 25, x2: place[to].x, y2: place[to].y + 25 }).forEach(([k, v]) => line.setAttribute(k, v));
    line.setAttribute("marker-end", "url(#diagram-arrow)");
    line.dataset.edge = `${from}->${to}`;
    svg.appendChild(line);
  }
  for (const node of nodes) {
    const group = document.createElementNS(svgns, "g");
    group.dataset.threadAnchor = node.id;
    group.setAttribute("aria-label", node.label);
    group.setAttribute("transform", `translate(${place[node.id].x},${place[node.id].y})`);
    group.innerHTML = '<rect width="160" height="50" rx="8"/><text x="80" y="30" text-anchor="middle"></text>';
    group.querySelector("text").textContent = node.label;
    group.addEventListener("click", () => window.pageThreads && window.pageThreads.open(node.id));
    svg.appendChild(group);
  }
})();
</script>
<script type="application/json" id="page-threads">
{"threads": {"idea": [{"id": 0, "by": "owner", "text": "Seed comment kept across edits", "replies_to": null, "at": "2026-11-12T00:00:00"}, {"id": "0.1", "by": "sentinel", "text": "Seed reply", "replies_to": 0, "at": "2026-11-12T00:00:05"}]}}
</script>
</body>
</html>
