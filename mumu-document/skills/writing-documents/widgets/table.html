<!-- table: rows sharing columns - options against one set of criteria,
     findings, done-criteria. One row per item, criteria fixed before any
     row; bold only the cells a verdict turns on, and say so under the table.
     The box scrolls sideways on a phone, never the page. -->
<style>
  [data-widget="table"] table { border-collapse: collapse; min-width: 100%; background: var(--fill); }
  [data-widget="table"] th, [data-widget="table"] td { border-bottom: 1px solid var(--border); padding: .5rem .65rem; text-align: start; vertical-align: top; }
  [data-widget="table"] tbody th { font-weight: normal; }
</style>
<section aria-labelledby="{{id}}">
  <h2 id="{{id}}">{{what the rows show, as a sentence}}</h2>
  <div data-widget="table" class="scroll" tabindex="0" role="region" aria-labelledby="{{id}}">
    <table>
      <thead><tr><th scope="col">{{item}}</th><th scope="col">{{criterion}}</th></tr></thead>
      <tbody><tr><th scope="row">{{row}}</th><td><strong>{{value a verdict turns on}}</strong></td></tr></tbody>
    </table>
  </div>
  <p class="muted"><strong>Bold</strong>: {{what turns on it}}.</p>
</section>
