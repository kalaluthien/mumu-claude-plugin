<!-- file-tree: a system's structure, first on the page.
  anatomy: a bordered box of nested lists; each folder a <details> whose <summary> holds its .name and an optional .tag (new, changed, gone); under each node a .note (its role in one line) or a <blockquote> excerpt with its path:line; a gone node has class "gone".
  fill: open only the level the page is about; group as the reader thinks of the system, and order for reading, not alphabetically: the new or central part first; a folder no reader needs is one collapsed line.
  states: default; hover: the summary turns accent; focus: outline on the summary; open: its children reveal; disabled: none, nothing to disable.
  motion: children fade and drop in over --motion as a folder opens.
  keyboard: Tab to a summary; Enter or Space opens and closes it.
  screen reader: each summary is a disclosure announcing expanded or collapsed.
  use when: the structure of files, modules or components.
  not when: under four flat items (a list); a before and after (change). -->
<style>
  [data-widget="file-tree"] { --tree-indent: var(--sp-4); --tree-guide: var(--border);
    background: var(--fill); border: var(--line) solid var(--border); border-radius: var(--radius-s); padding: var(--sp-2) var(--sp-3); }
  [data-widget="file-tree"] ul { list-style: none; margin: 0; padding-inline-start: var(--tree-indent); border-inline-start: var(--line) dashed var(--tree-guide); }
  [data-widget="file-tree"] > ul { padding-inline-start: 0; border: 0; }
  [data-widget="file-tree"] li { margin: var(--sp-1) 0; }
  [data-widget="file-tree"] .name { font-family: var(--mono); font-size: var(--fs-m); overflow-wrap: anywhere; }
  [data-widget="file-tree"] .note { color: var(--muted); font-size: var(--fs-m); margin: var(--sp-1) 0 var(--sp-2) var(--tree-indent); }
  [data-widget="file-tree"] blockquote { margin: var(--sp-1) 0 var(--sp-2) var(--tree-indent); padding-inline-start: var(--sp-2); border-inline-start: var(--line-strong) solid var(--tree-guide); font-size: var(--fs-m); }
  [data-widget="file-tree"] .tag { font-size: var(--fs-s); border: var(--line) solid var(--border); border-radius: var(--radius-s); padding: 0 var(--sp-1); margin-inline-start: var(--sp-1); color: var(--muted); }
  [data-widget="file-tree"] .gone .name { text-decoration: line-through; color: var(--muted); }
</style>
<section aria-labelledby="{{id}}">
  <h2 id="{{id}}">{{what the structure shows, as a sentence}}</h2>
  <div data-widget="file-tree">
    <ul>
      <li><details open><summary><span class="name">{{folder}}/</span></summary>
        <p class="note">{{its role}}</p>
        <ul>
          <li><details><summary><span class="name">{{file}}</span><span class="tag">{{change}}</span></summary>
            <p class="note">{{its role}}</p>
            <blockquote><code>{{quoted line}}</code> <span class="muted">{{path:line}}</span></blockquote>
          </details></li>
          <li class="gone"><span class="name">{{removed file}}</span><span class="tag">{{gone}}</span></li>
        </ul></details></li>
    </ul>
  </div>
</section>
