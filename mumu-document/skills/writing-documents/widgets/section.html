<!-- section: one claim with its reason and evidence, or steps with their checks.
  anatomy: an h2 stating the claim as a sentence; paragraphs; an <ol> of steps, each with its check; evidence folded in <details> as path:line with the code, or a changed hunk as pre.diff whose del and ins lines CSS marks - and +.
  fill: each paragraph claim, reason, evidence, consequence; a reason the source omits is called absent, not guessed.
  states: default; hover: the evidence summary turns accent; focus: outline on the summary; open: the evidence reveals; disabled: none.
  motion: the evidence fades and drops in over --motion as it opens.
  keyboard: Tab to the evidence summary; Enter or Space opens it.
  screen reader: a section named by its h2; the summary is a disclosure.
  use when: a claim, an explanation, the steps of a guide.
  not when: rows sharing columns (table); structure or behaviour a figure shows better. -->
<style>
  [data-widget="section"] { --section-evidence: var(--muted); --section-add: var(--ok); --section-remove: var(--fail); }
  [data-widget="section"] details { margin: var(--sp-2) 0; }
  [data-widget="section"] summary { color: var(--section-evidence); }
  [data-widget="section"] .diff ins, [data-widget="section"] .diff del { display: block; text-decoration: none; }
  [data-widget="section"] .diff ins { color: var(--section-add); } [data-widget="section"] .diff ins::before { content: "+ "; }
  [data-widget="section"] .diff del { color: var(--section-remove); } [data-widget="section"] .diff del::before { content: "- "; }
</style>
<section data-widget="section" aria-labelledby="{{id}}">
  <h2 id="{{id}}">{{the claim, as a sentence}}</h2>
  <p>{{the reason, then the consequence}}</p>
  <ol><li>{{step}}: {{its check}}</li></ol>
  <details>
    <summary>{{Evidence}}: <code>{{path:line}}</code></summary>
    <pre tabindex="0" role="region" aria-label="{{path:line}}"><code>{{the code}}</code></pre>
  </details>
  <details>
    <summary>{{Evidence}}: <code>{{path:line}}</code></summary>
    <pre class="diff" tabindex="0" role="region" aria-label="{{path:line}}"><code>{{kept line}}<del>{{removed line}}</del><ins>{{added line}}</ins></code></pre>
  </details>
</section>
