<!-- flow: one use case, one copy of this widget; two use cases, two
     copies. Participants across the top, time downward: each call a numbered
     one-way arrow labelled with what it sends, one of them a real example
     value; dashed where inferred, not read. Only the participants and calls
     the use case needs. Add a row: +48 to y and to the svg height. A changed
     flow shows before and after. Prefix every id with {{id}}. -->
<section aria-labelledby="{{id}}">
  <h2 id="{{id}}">{{use case}}: {{what happens, as a sentence}}</h2>
  <figure data-widget="flow" class="scroll" tabindex="0" aria-labelledby="{{id}}-title">
    <svg width="520" height="208" viewBox="0 0 520 208" role="img" aria-labelledby="{{id}}-title" aria-describedby="{{id}}-desc">
      <title id="{{id}}-title">Flow: {{use case}}</title>
      <desc id="{{id}}-desc">{{the flow in one sentence}}</desc>
      <defs>
        <marker id="{{id}}-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path class="tip" d="M0,0 L10,5 L0,10 z"/>
        </marker>
      </defs>
      <rect class="box" x="8" y="8" width="128" height="40" rx="8"/>
      <text x="72" y="32" text-anchor="middle">{{participant A}}</text>
      <rect class="box" x="196" y="8" width="128" height="40" rx="8"/>
      <text x="260" y="32" text-anchor="middle">{{participant B}}</text>
      <rect class="box" x="384" y="8" width="128" height="40" rx="8"/>
      <text x="448" y="32" text-anchor="middle">{{participant C}}</text>
      <path class="edge inferred" d="M72,48 V200 M260,48 V200 M448,48 V200" style="stroke: var(--border); stroke-width: 1"/>
      <path class="edge" d="M72,88 H256" marker-end="url(#{{id}}-arrow)"/>
      <text class="label" x="80" y="80">1 {{call and its value}}</text>
      <path class="edge" d="M260,136 H444" marker-end="url(#{{id}}-arrow)"/>
      <text class="label" x="268" y="128">2 {{call}}</text>
      <path class="edge" d="M448,184 H76" marker-end="url(#{{id}}-arrow)"/>
      <text class="label" x="268" y="176">3 {{reply}}</text>
    </svg>
    <figcaption class="muted">{{what was left out of this use case}}</figcaption>
  </figure>
</section>
