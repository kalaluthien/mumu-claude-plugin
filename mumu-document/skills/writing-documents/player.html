<!-- player: the one stepper under a played flow and change; once per page when either is on it.
  anatomy: a widget root with data-player (buttons) or data-player="scroll", and data-labels naming Back|Play|Pause|Next|Step in the page's language; its .stage (the figure or tree); stage elements marked data-step="k"; an <ol class="steps"> with one caption per step, a caption's data-x and data-y placing a .token; the script adds a .caption line and .controls: Back, Play or Pause, Next, a scrubber and a step count.
  states: default: step 1; hover: a button's border turns accent; focus: outline; open: none; disabled: Back at the first step and Next at the last dim.
  scroll: with data-player="scroll" there are no controls: the .stage sticks to the top and each caption is a tall section under it; the caption crossing the middle of the viewport sets the step, so scrolling down advances and scrolling up reverses exactly.
  motion: at step k, stage elements with data-step up to k get .on and the one at k gets .now, which each widget styles; Play advances one step per dwell and stops at the last; never autoplays. Under prefers-reduced-motion: reduce, in print or without script, no controls show: every caption is listed, numbered, and the stage stands at its last step.
  keyboard: Tab to the controls; Enter or Space on a button; arrow keys on the scrubber.
  screen reader: the caption line is a polite live region; the scrubber is named by the last of data-labels and reads its value.
  use when: the reader follows a sequence one step at a time.
  not when: a figure that reads at a glance. -->
<style>
  [data-player] { --player-gap: var(--sp-2); }
  [data-player] .steps { margin: var(--player-gap) 0; }
  [data-player] .caption, [data-player] .controls { display: none; }
  [data-player] .controls { gap: var(--player-gap); align-items: center; flex-wrap: wrap; margin: var(--player-gap) 0; }
  [data-player] .controls input { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); }
  [data-player] .count { color: var(--muted); font-size: var(--fs-m); }
  @media screen and (prefers-reduced-motion: no-preference) {
    [data-player].live .steps { display: none; }
    [data-player].live .caption { display: block; }
    [data-player].live .controls { display: flex; }
    [data-player="scroll"].live .caption, [data-player="scroll"].live .controls { display: none; }
    [data-player="scroll"].live .steps { display: block; padding-inline-start: var(--sp-5); }
    [data-player="scroll"].live .stage { position: sticky; top: 0; z-index: 1; background: var(--bg); }
    [data-player="scroll"].live .steps > li { min-height: var(--scroll-step); color: var(--muted); transition: color var(--motion-fast) var(--ease-out); }
    [data-player="scroll"].live .steps > li.now { color: var(--text); }
  }
</style>
<script>
  document.querySelectorAll('[data-player]').forEach((root) => {
    const steps = [...root.querySelectorAll('.steps > li')];
    const n = steps.length;
    const dwell = 2400;
    const [backText, playText, pauseText, nextText, stepText] = (root.dataset.labels || 'Back|Play|Pause|Next|Step').split('|');
    const scroll = root.dataset.player === 'scroll';
    const caption = document.createElement('p');
    caption.className = 'caption';
    caption.setAttribute('aria-live', 'polite');
    const controls = document.createElement('div');
    controls.className = 'controls';
    controls.innerHTML = '<button type="button"></button><button type="button"></button><button type="button"></button>'
      + '<input type="range" min="1" step="1"><span class="count"></span>';
    root.append(caption, controls);
    const [back, play, next] = controls.querySelectorAll('button');
    const range = controls.querySelector('input');
    back.textContent = backText;
    play.textContent = playText;
    next.textContent = nextText;
    range.setAttribute('aria-label', stepText);
    const count = controls.querySelector('.count');
    range.max = n;
    root.dataset.steps = n;
    let at = 1;
    let timer = null;
    const stop = () => { clearInterval(timer); timer = null; play.textContent = playText; };
    const show = (k) => {
      at = Math.min(Math.max(k, 1), n);
      steps.forEach((li, i) => li.classList.toggle('now', i === at - 1));
      root.querySelectorAll('[data-step]').forEach((el) => {
        el.classList.toggle('on', +el.dataset.step <= at);
        el.classList.toggle('now', +el.dataset.step === at);
      });
      const li = steps[at - 1];
      if (li.dataset.x) {
        root.style.setProperty('--x', `${li.dataset.x}px`);
        root.style.setProperty('--y', `${li.dataset.y}px`);
      }
      caption.textContent = `${at}. ${li.textContent.trim()}`;
      range.value = at;
      count.textContent = `${at} / ${n}`;
      back.disabled = at === 1;
      next.disabled = at === n;
      if (at === n) stop();
    };
    back.addEventListener('click', () => { stop(); show(at - 1); });
    next.addEventListener('click', () => { stop(); show(at + 1); });
    range.addEventListener('input', () => { stop(); show(+range.value); });
    play.addEventListener('click', () => {
      if (timer) { stop(); return; }
      if (at === n) show(1);
      play.textContent = pauseText;
      timer = setInterval(() => show(at + 1), dwell);
    });
    if (scroll) {
      const seen = new IntersectionObserver((entries) => entries.forEach((e) => {
        if (e.isIntersecting) show(steps.indexOf(e.target) + 1);
      }), { root: document, rootMargin: '-50% 0px -50% 0px' });
      steps.forEach((li) => seen.observe(li));
    }
    root.classList.add('live');
    show(1);
  });
</script>
