<!-- page: the shell of every Artifact page, copied whole; fill each {{...}} or delete its element.
  main: the h1, a p.read of the one thing to read off the page, a nav linking each h2 by its id (4 or more h2s, or
  chapters; else delete it), the widgets and plain HTML in move order, and a footer citing the source at a sha.
  chapters: parts that each hold sections are each a <section data-chapter> opening with its <h2 id>, sections as h3s;
  the page shows the chapter holding the URL's #id (none: the first), adds a pager, and marks the nav link shown.
  slide: a root with data-slide and data-labels="뒤로|다음" over an <ol class="steps">: one stage changes in place, Back,
  Next, the arrow keys and a count; the reader compares the same marks.
  swipe: a root with data-swipe over a stage and an <ol class="steps">: a strip of cards, the card in view the step;
  each step a separate moment. Played, at step k each [data-step] up to k gets .on, the one at k .now, the root
  data-at k - 1 and a `step` event, and a card's data-x scrolls a stage wider than the column to it; under reduced motion, in print or without script, every caption stays listed,
  every chapter shown, and the widget stands at its last step.
  table: only for values the reader compares across rows, few columns, the first a row label, headers with scope;
  each one <div class="scroll" role="region" aria-labelledby="t-<id>" tabindex="0"> holding the <table> and its
  <caption id="t-<id>">, so a wide one scrolls in its box with its first column held; a number cell class="num". -->
<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style id="skin">
@import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap");
/* skin: the owner's design system.
   Look: a soft gothic page, black on white; dark mode inverts the duet. One
   face, Nanum Gothic, for every text role: h1 and h2 at weight 800, h3 at 700,
   prose, controls, captions, figure labels and metadata at 400; a defined
   term (dfn) at 700, upright, since Hangul has no italic.
   Corners square, no shadows. The
   accent is ink: focus, hover and the current step; links take --link.
   Borders on controls and figure boxes are body grey (3:1, so a hover to ink
   shows); row dividers are --hairline. Figures add kinds and status colours,
   which the magazine lacks.
   Tokens in three tiers: a primitive (--p-*) holds a raw value two roles or
   more share; a semantic token names a role; each widget defines its own
   --<widget>-* tokens from semantic ones and reads nothing else.
   Layout: one column of --page-width, a --gutter each side, sections --rhythm
   apart; at 320 px nothing scrolls sideways but a .scroll box, which holds a
   table's first column in view.
   Motion: --motion-fast for hover and focus, --motion for a reveal, easing
   --ease-out; only a change of state animates, none under reduced motion.
   Fonts: the one fetch a page makes; offline, installed faces. */
:root {
  color-scheme: light dark;
  /* primitives */
  --p-black: #000000; --p-white: #ffffff; --p-grey-500: #757575;
  --p-size-1: .25rem; --p-size-4: 1rem; --p-size-5: 1.75rem;

  /* semantic: colour roles, each light-dark(light, dark) */
  --text: light-dark(var(--p-black), var(--p-white));
  --muted: light-dark(var(--p-grey-500), #a3a3a3);
  --bg: light-dark(var(--p-white), #312e2d);
  --fill: light-dark(var(--p-white), #3a3635);
  --border: light-dark(var(--p-grey-500), #8a8a8a);
  --hairline: light-dark(#e0e0e0, #4a4543);
  --accent: light-dark(var(--p-black), var(--p-white));
  --link: light-dark(#057dbc, #5cb8ea);
  /* semantic: diagram palette; kinds (Okabe-Ito, told apart under
     deuteranopia and protanopia) mark a node's kind by its edge and a chart's
     series; status colours mark success, warning and failure in text and edges */
  --kind-1: light-dark(#0072b2, #56b4e9);
  --kind-2: light-dark(#d55e00, #e69f00);
  --kind-3: light-dark(#009e73, #009e73);
  --kind-4: light-dark(#cc79a7, #cc79a7);
  --ok: light-dark(#1f7a3a, #6fd68a);
  --warn: light-dark(#855600, #f2c14e);
  --fail: light-dark(#b8302a, #ff7b72);
  /* semantic: type, space, line, radius, layout, motion */
  --sans: "Nanum Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: ui-monospace, monospace;
  --fs-s: .8rem; --fs-m: .9rem; --fs-base: 1rem; --fs-l: 1.2rem;
  --fs-h2: 1.625rem; --fs-h1: 2rem;
  --fs-svg: 14px; --fs-svg-label: 12px;
  --sp-1: var(--p-size-1); --sp-2: .5rem; --sp-3: .75rem;
  --sp-4: var(--p-size-4); --sp-5: var(--p-size-5);
  --line: 1px; --line-strong: 2px; --line-mark: 3px;
  --radius-s: 0;
  --page-width: 48rem; --gutter: var(--p-size-4); --rhythm: var(--p-size-5);
  --motion-fast: 100ms; --motion: 200ms;
  --ease-out: cubic-bezier(.2, .7, .3, 1);
  --scroll-step: 60vh;
  --disabled: .5;
}
:root[data-theme="light"], .theme-light { color-scheme: light; }
:root[data-theme="dark"], .theme-dark { color-scheme: dark; }
.theme-light, .theme-dark { background: var(--bg); color: var(--text); }

/* layout */
body { background: var(--bg); color: var(--text); margin: 0;
       font: var(--fs-base)/1.5 var(--sans); padding: var(--rhythm) var(--gutter); }
main { max-width: var(--page-width); margin: 0 auto; }
h1, h2 { font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
h1 { font-size: var(--fs-h1); margin: 0 0 var(--sp-4); }
h2 { font-size: var(--fs-h2); margin: var(--rhythm) 0 var(--sp-2); }
h3 { font: 700 var(--fs-l)/1.2 var(--sans); margin: var(--sp-4) 0 var(--sp-2); }
a { color: var(--link); }
:is(h1, h2) code { font-size: .8em; }
.read { border-inline-start: var(--line-mark) solid var(--text); padding-inline-start: var(--sp-3); font-size: var(--fs-l); }
.muted, footer { color: var(--muted); font-size: var(--fs-m); }
footer { margin-top: var(--rhythm); padding-top: var(--sp-3); border-top: var(--line) solid var(--hairline); }
code, pre { font-family: var(--mono); font-size: var(--fs-m); }
pre { overflow-x: auto; background: var(--fill); border: var(--line) solid var(--border);
      border-radius: var(--radius-s); padding: var(--sp-3); }
.scroll { overflow-x: auto; }
figure { margin: 0; }
table { border-collapse: collapse; min-width: 100%; background: var(--fill); }
th, td { border-bottom: var(--line) solid var(--hairline); padding: var(--sp-2) var(--sp-3); text-align: start; vertical-align: top; }
tbody th { font-weight: normal; }
dfn { font-style: normal; font-weight: 700; }
caption { text-align: start; }
.scroll :is(th, td):first-child { position: sticky; inset-inline-start: 0; background: var(--fill); }
.num { text-align: end; font-variant-numeric: tabular-nums; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .fail { color: var(--fail); }

/* states: default, hover, focus, open, disabled; [data-state] forces one for
   the test gallery */
:focus-visible, [data-state="focus"] :is(summary, button, textarea, [tabindex]) {
  outline: var(--line-strong) solid var(--accent); outline-offset: var(--line-strong); }
summary { cursor: pointer; transition: color var(--motion-fast) var(--ease-out); }
summary:hover, [data-state="hover"] summary { color: var(--accent); }
details[open] > :not(summary) { animation: reveal var(--motion) var(--ease-out); }
@keyframes reveal { from { opacity: 0; transform: translateY(calc(-1 * var(--sp-1))); } }
button { font: 700 var(--fs-m) var(--sans); color: var(--text); background: var(--fill); cursor: pointer;
         border: var(--line) solid var(--border); border-radius: var(--radius-s); padding: var(--sp-1) var(--sp-3);
         transition: border-color var(--motion-fast) var(--ease-out); }
button:hover, [data-state="hover"] button { border-color: var(--accent); }
textarea, input, select { font: var(--fs-base) var(--sans); color: var(--text); background: var(--fill);
           border: var(--line) solid var(--border); border-radius: var(--radius-s); }
:disabled { opacity: var(--disabled); cursor: not-allowed; }

@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after { animation: none !important; transition: none !important; }
}
</style>
<style>
  [data-chapter] .pager { display: flex; justify-content: space-between; gap: var(--sp-3); margin-top: var(--rhythm);
    padding-top: var(--sp-3); border-top: var(--line) solid var(--hairline); font-family: var(--sans); }
  [data-chapter] .pager [rel="next"] { margin-inline-start: auto; text-align: end; }
  main nav [aria-current] { color: var(--text); font-weight: 700; }
  @media print { [data-chapter][hidden] { display: block; } [data-chapter] .pager { display: none; } }
  [data-slide] .steps { margin: var(--sp-2) 0; }
  [data-slide] :is(.caption, .controls) { display: none; }
  [data-slide] .controls { gap: var(--sp-2); align-items: center; margin: var(--sp-2) 0; }
  [data-slide] .count { color: var(--muted); font-size: var(--fs-m); }
  @media screen and (prefers-reduced-motion: no-preference) {
    [data-slide].live .steps { display: none; }
    [data-slide].live .caption { display: block; }
    [data-slide].live .controls { display: flex; }
  }
  @media screen and (prefers-reduced-motion: no-preference) {
    [data-swipe].live .steps { display: flex; gap: var(--sp-2); overflow-x: auto; scroll-snap-type: x mandatory;
      list-style: none; padding: 0; margin: var(--sp-2) 0; }
    [data-swipe].live .steps > li { flex: 0 0 85%; scroll-snap-align: center; padding: var(--sp-2) var(--sp-3);
      border: var(--line) solid var(--hairline); color: var(--muted); transition: color var(--motion-fast) var(--ease-out); }
    [data-swipe].live .steps > li.now { color: var(--text); border-color: var(--accent); }
    [data-swipe].live .steps:focus-visible { outline: var(--line-strong) solid var(--accent); }
  }
</style>
<main>
  <h1>{{title, a noun phrase}}</h1>
  <p class="read">{{the one thing to read off the page}}</p>
  <nav><ol><li><a href="#{{id}}">{{h2}}</a></li></ol></nav>
  {{widgets and plain HTML, in move order}}
  <footer>{{source}} <code>{{sha}}</code></footer>
</main>
<script>
  (() => {
    const start = () => {
      const chapters = [...document.querySelectorAll('[data-chapter]')];
      if (chapters.length < 2) return;
      const head = (c) => c.querySelector('h2');
      chapters.forEach((c, i) => {
        const pager = document.createElement('div');
        pager.className = 'pager';
        [[chapters[i - 1], 'prev'], [chapters[i + 1], 'next']].forEach(([to, rel]) => {
          if (!to) return;
          const a = document.createElement('a');
          a.href = `#${head(to).id}`;
          a.rel = rel;
          const name = head(to).textContent.trim();
          a.textContent = rel === 'prev' ? `← ${name}` : `${name} →`;
          pager.append(a);
        });
        c.append(pager);
      });
      let shown = null;
      const show = () => {
        const id = decodeURIComponent(location.hash.slice(1));
        const target = id ? document.getElementById(id) : null;
        const at = !id ? chapters[0] : (target && target.closest('[data-chapter]')) || shown || chapters[0];
        chapters.forEach((c) => { c.hidden = c !== at; });
        document.querySelectorAll('main nav a[href^="#"]').forEach((a) => {
          const to = document.getElementById(decodeURIComponent(a.hash.slice(1)));
          if (to && at.contains(to)) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current');
        });
        shown = at;
        if (target && at.contains(target)) target.scrollIntoView();
      };
      addEventListener('hashchange', show);
      show();
    };
    if (document.readyState === 'loading') addEventListener('DOMContentLoaded', start); else start();
  })();
</script>
<script>
  (() => {
    const start = () => document.querySelectorAll('[data-slide]').forEach((root) => {
      const steps = [...root.querySelectorAll('.steps > li')];
      const n = steps.length;
      if (n < 2 || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const caption = document.createElement('p');
      caption.className = 'caption';
      caption.setAttribute('aria-live', 'polite');
      const controls = document.createElement('div');
      controls.className = 'controls';
      controls.innerHTML = '<button type="button"></button><button type="button"></button><span class="count"></span>';
      root.append(caption, controls);
      const [back, next] = controls.querySelectorAll('button');
      [back.textContent, next.textContent] = (root.dataset.labels || 'Back|Next').split('|');
      let at = 1;
      const show = (k) => {
        at = Math.min(Math.max(k, 1), n);
        root.querySelectorAll('[data-step]').forEach((el) => {
          el.classList.toggle('on', +el.dataset.step <= at);
          el.classList.toggle('now', +el.dataset.step === at);
        });
        root.dataset.at = at - 1;
        root.dispatchEvent(new CustomEvent('step'));
        caption.textContent = `${at}. ${steps[at - 1].textContent.trim()}`;
        controls.querySelector('.count').textContent = `${at} / ${n}`;
        back.disabled = at === 1;
        next.disabled = at === n;
      };
      back.addEventListener('click', () => show(at - 1));
      next.addEventListener('click', () => show(at + 1));
      root.addEventListener('keydown', (e) => {
        const d = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
        if (d && !e.target.closest('svg')) { e.preventDefault(); show(at + d); }
      });
      root.classList.add('live');
      show(1);
    });
    if (document.readyState === 'loading') addEventListener('DOMContentLoaded', start); else start();
  })();
</script>
<script>
  (() => {
    const start = () => document.querySelectorAll('[data-swipe]').forEach((root) => {
      const strip = root.querySelector('.steps');
      const steps = [...strip.children];
      const n = steps.length;
      if (n < 2 || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      strip.tabIndex = 0;
      const show = (k) => {
        steps.forEach((li, i) => li.classList.toggle('now', i === k - 1));
        root.querySelectorAll('[data-step]').forEach((el) => {
          el.classList.toggle('on', +el.dataset.step <= k);
          el.classList.toggle('now', +el.dataset.step === k);
        });
        const li = steps[k - 1];
        if (li.dataset.x) {
          root.style.setProperty('--x', `${li.dataset.x}px`);
          root.style.setProperty('--y', `${li.dataset.y}px`);
          // a stage wider than the column scrolls to center the token
          const stage = root.querySelector('.stage');
          const svg = stage && stage.querySelector('svg');
          if (svg) {
            const s = svg.getBoundingClientRect();
            const x = s.left - stage.getBoundingClientRect().left + stage.scrollLeft + li.dataset.x * s.width / (svg.viewBox.baseVal.width || s.width);
            stage.scrollTo({ left: x - stage.clientWidth / 2, behavior: 'smooth' });
          }
        }
        root.dataset.at = k - 1;
        root.dispatchEvent(new CustomEvent('step'));
      };
      const seen = new IntersectionObserver((entries) => entries.forEach((e) => {
        if (e.isIntersecting) show(steps.indexOf(e.target) + 1);
      }), { root: strip, threshold: 0.6 });
      steps.forEach((li) => seen.observe(li));
      root.classList.add('live');
      show(1);
    });
    if (document.readyState === 'loading') addEventListener('DOMContentLoaded', start); else start();
  })();
</script>
</html>
