<!-- stepwise: a task the reader does in order, one step open at a time.
  anatomy: an <ol> of .step items; each a .head button holding a numbered .dot circle, the step's title and a .mark the script fills with the done word; a .desc line under it; a .body with the step's work and a .done button.
  fill: three to seven steps, each one thing the reader does and can see finished; the title an imperative, the desc one line of why; the body holds only what that step needs: a command, a field, a check.
  states: default: step 1 open, later steps closed; hover: the head's circle turns accent; focus: outline on the head or the done button; open: every body shown; disabled: the buttons dim and refuse input. Live: done fills the circle, closes the step and opens the next undone one; a done step's head reopens it.
  motion: an opened body fades and drops in over --motion, the circle's colour eases over --motion-fast; only on a step change, never on load.
  keyboard: Tab to a head, Enter or Space opens or closes it; Tab to done, Enter marks it and moves focus to the next head.
  screen reader: each head a disclosure announcing expanded or collapsed; the open step carries aria-current="step"; the done word is read with the title.
  use when: a guide the reader follows now, step by step: a setup, a migration, a checklist.
  not when: steps read, not done (section's <ol>); a request moving through a system (use-case). -->
<style>
  [data-widget="stepwise"] { --stepwise-dot: var(--sp-5); --stepwise-gap: var(--sp-3); --stepwise-rail: var(--border); --stepwise-done: var(--accent); }
  [data-widget="stepwise"] > ol { list-style: none; margin: 0; padding: 0; }
  [data-widget="stepwise"] .step { position: relative; padding-bottom: var(--stepwise-gap); }
  [data-widget="stepwise"] .desc, [data-widget="stepwise"] .body { margin-inline-start: calc(var(--stepwise-dot) + var(--stepwise-gap)); }
  [data-widget="stepwise"] .step:not(:last-child)::before { content: ""; position: absolute; inset-block: var(--stepwise-dot) 0; inset-inline-start: calc(var(--stepwise-dot) / 2); border-inline-start: var(--line) solid var(--stepwise-rail); }
  [data-widget="stepwise"] .head { display: flex; gap: var(--stepwise-gap); align-items: center; width: 100%; text-align: start; font-weight: 600;
    background: none; border: 0; padding: 0; overflow-wrap: anywhere; }
  [data-widget="stepwise"] .dot { flex: none; display: inline-grid; place-items: center; width: var(--stepwise-dot); height: var(--stepwise-dot);
    border: var(--line-strong) solid var(--border); border-radius: 50%; background: var(--fill); font-size: var(--fs-m);
    transition: border-color var(--motion-fast) var(--ease-out), background-color var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out); }
  [data-widget="stepwise"] .head:hover .dot, [data-state="hover"] [data-widget="stepwise"] .step:nth-child(2) .dot { border-color: var(--accent); }
  [data-widget="stepwise"] .mark { color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
  [data-widget="stepwise"] .desc { color: var(--muted); font-size: var(--fs-m); margin-block: 0; }
  [data-widget="stepwise"] .body { margin-block: var(--sp-2) 0; }
  [data-widget="stepwise"] .body > :first-child { margin-top: 0; }
  [data-widget="stepwise"] .step.now .dot { border-color: var(--accent); color: var(--accent); }
  [data-widget="stepwise"] .step.done .dot { border-color: var(--stepwise-done); background: var(--stepwise-done); color: var(--bg); }
  @media screen and (prefers-reduced-motion: no-preference) {
    [data-widget="stepwise"].live .step:not(.now) .body { display: none; }
    [data-state="open"] [data-widget="stepwise"].live .step .body { display: block; }
    [data-widget="stepwise"].live.moved .step.now .body { animation: reveal var(--motion) var(--ease-out); }
  }
</style>
<script>
  document.querySelectorAll('[data-widget="stepwise"]').forEach((root) => {
    const steps = [...root.querySelectorAll('.step')];
    const doneWord = root.dataset.doneWord || '';
    let now = 0;
    const show = (k) => {
      now = k;
      steps.forEach((li, i) => {
        li.classList.toggle('now', i === now);
        li.querySelector('.head').setAttribute('aria-expanded', i === now);
        li.querySelector('.mark').textContent = li.classList.contains('done') ? doneWord : '';
        if (i === now) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');
      });
    };
    steps.forEach((li, i) => {
      li.querySelector('.head').addEventListener('click', () => { root.classList.add('moved'); show(now === i ? -1 : i); });
      li.querySelector('.done').addEventListener('click', () => {
        root.classList.add('moved');
        li.classList.add('done');
        const next = steps.findIndex((s, j) => j > i && !s.classList.contains('done'));
        show(next);
        if (next >= 0) steps[next].querySelector('.head').focus();
      });
    });
    root.classList.add('live');
    show(0);
  });
</script>
<section aria-labelledby="{{id}}">
  <h2 id="{{id}}">{{the task, as a noun phrase}}</h2>
  <div data-widget="stepwise" data-done-word="{{done}}">
    <ol>
      <li class="step">
        <button type="button" class="head" aria-controls="{{id}}-s1"><span class="dot">1</span><span>{{step 1 title}}</span><span class="mark"></span></button>
        <p class="desc">{{why this step, in one line}}</p>
        <div class="body" id="{{id}}-s1">
          <p>{{what to do, and how to see it worked}}</p>
          <button type="button" class="done">{{Done, next step}}</button>
        </div>
      </li>
      <li class="step">
        <button type="button" class="head" aria-controls="{{id}}-s2"><span class="dot">2</span><span>{{step 2 title}}</span><span class="mark"></span></button>
        <p class="desc">{{why this step, in one line}}</p>
        <div class="body" id="{{id}}-s2">
          <p>{{what to do, and how to see it worked}}</p>
          <button type="button" class="done">{{Done, next step}}</button>
        </div>
      </li>
      <li class="step">
        <button type="button" class="head" aria-controls="{{id}}-s3"><span class="dot">3</span><span>{{step 3 title}}</span><span class="mark"></span></button>
        <p class="desc">{{why this step, in one line}}</p>
        <div class="body" id="{{id}}-s3">
          <p>{{what to do, and how to see it worked}}</p>
          <button type="button" class="done">{{Done, next step}}</button>
        </div>
      </li>
    </ol>
  </div>
</section>
