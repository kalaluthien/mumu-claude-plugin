<!-- matrix: two dimensions crossed, one mark per cell.
  anatomy: a heading, a .scroll region holding one table (a corner, column headers for one dimension, a row header per item of the other), one .mark per cell; a key under it naming each level by its symbol and word.
  fill: both dimensions fixed before any cell; every cell marked, none left blank; one scale per matrix, its levels ordered in the key; data-level 0-3 picks the symbol and colour (none, low, mid, high; or no, partial, yes with 0, 2, 3); the word for the level goes in the cell's hidden text, so the mark reads without colour and to a screen reader; when the levels are neutral, not good or bad, set every --matrix-* colour to --text.
  states: default; hover: the row takes the page background and the cell's mark turns accent; focus: outline on the scroll region; open: none, nothing folds; disabled: none.
  motion: a row's background eases over --motion-fast, only on hover; none under reduced motion.
  keyboard: Tab to the region; arrow keys scroll it.
  screen reader: a region named by the heading; th scope gives each cell its row and column; each cell reads its level's word, the symbol hidden.
  use when: which of these touches which of those: features by platform, roles by permission, options by risk, modules by team.
  not when: rows sharing columns of different kinds of value (table); one dimension (a list). -->
<style>
  [data-widget="matrix"] { --matrix-pad: var(--sp-2) var(--sp-3); --matrix-hover: var(--bg);
    --matrix-0: var(--muted); --matrix-1: var(--fail); --matrix-2: var(--warn); --matrix-3: var(--ok); }
  [data-widget="matrix"] table { border-collapse: collapse; min-width: 100%; background: var(--fill); }
  [data-widget="matrix"] th, [data-widget="matrix"] td { border-bottom: var(--line) solid var(--hairline); padding: var(--matrix-pad); }
  [data-widget="matrix"] thead th { text-align: center; vertical-align: bottom; }
  [data-widget="matrix"] thead th:first-child, [data-widget="matrix"] tbody th { text-align: start; }
  [data-widget="matrix"] tbody th { font-weight: normal; }
  [data-widget="matrix"] td { text-align: center; }
  [data-widget="matrix"] .mark { font-size: var(--fs-l); line-height: 1; }
  [data-widget="matrix"] [data-level="0"] .mark { color: var(--matrix-0); }
  [data-widget="matrix"] [data-level="1"] .mark { color: var(--matrix-1); }
  [data-widget="matrix"] [data-level="2"] .mark { color: var(--matrix-2); }
  [data-widget="matrix"] [data-level="3"] .mark { color: var(--matrix-3); }
  [data-widget="matrix"] td:hover .mark, [data-state="hover"] [data-widget="matrix"] tbody tr:first-child td:nth-of-type(1) .mark { color: var(--accent); }
  [data-widget="matrix"] .hidden { position: absolute; width: var(--line); height: var(--line); overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  [data-widget="matrix"] tbody tr:hover, [data-state="hover"] [data-widget="matrix"] tbody tr:first-child { background: var(--matrix-hover); }
  [data-state="focus"] [data-widget="matrix"] .region { outline: var(--line-strong) solid var(--accent); }
  [data-widget="matrix"] .key { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); list-style: none; padding: 0; }
  @media screen and (prefers-reduced-motion: no-preference) {
    [data-widget="matrix"] tbody tr { transition: background-color var(--motion-fast) var(--ease-out); }
  }
</style>
<section aria-labelledby="{{id}}">
  <h2 id="{{id}}">{{what crosses what, as a noun phrase}}</h2>
  <div data-widget="matrix">
    <div class="scroll region" tabindex="0" role="region" aria-labelledby="{{id}}">
      <table>
        <thead><tr><th scope="col">{{rows \ columns}}</th><th scope="col">{{column 1}}</th><th scope="col">{{column 2}}</th><th scope="col">{{column 3}}</th></tr></thead>
        <tbody>
          <tr><th scope="row">{{row 1}}</th>
            <td data-level="3"><span class="mark" aria-hidden="true">●</span><span class="hidden">{{high}}</span></td>
            <td data-level="2"><span class="mark" aria-hidden="true">◐</span><span class="hidden">{{mid}}</span></td>
            <td data-level="0"><span class="mark" aria-hidden="true">–</span><span class="hidden">{{none}}</span></td></tr>
          <tr><th scope="row">{{row 2}}</th>
            <td data-level="1"><span class="mark" aria-hidden="true">○</span><span class="hidden">{{low}}</span></td>
            <td data-level="3"><span class="mark" aria-hidden="true">●</span><span class="hidden">{{high}}</span></td>
            <td data-level="2"><span class="mark" aria-hidden="true">◐</span><span class="hidden">{{mid}}</span></td></tr>
        </tbody>
      </table>
    </div>
    <p class="muted" id="{{id}}-key">{{Key}}</p>
    <ul class="key muted" aria-labelledby="{{id}}-key">
      <li data-level="3"><span class="mark" aria-hidden="true">●</span> {{high}}</li>
      <li data-level="2"><span class="mark" aria-hidden="true">◐</span> {{mid}}</li>
      <li data-level="1"><span class="mark" aria-hidden="true">○</span> {{low}}</li>
      <li data-level="0"><span class="mark" aria-hidden="true">–</span> {{none}}</li>
    </ul>
  </div>
</section>
