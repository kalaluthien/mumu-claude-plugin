<!-- chart: numbers drawn as a chart from the table they sit in; data-chart picks the kind.
  anatomy: a heading; a figure[data-chart] holding a figcaption (one sentence: the one thing to read off the chart), an empty .plot the script draws an SVG into, and a <details> with the data <table>: a row header per row, one numeric <td> per value column, units allowed in a cell; the table is the chart's only data and its text alternative.
  fill: numbers exactly as the source gives them; at most 4 value columns, one colour each, else data-facet; a <tr data-note="{{a few words}}"> writes that note beside the row's mark, once or twice a chart; the summary names the finding, not the chart.
  kinds: one spec each below: the table's columns, the marks, when to use it and when not.
  bar: category | one value. Horizontal bars from zero, the value at each bar's end. Use when: values compared across categories, where zero means none. Not when: zero is not a meaningful baseline (dot); values over time (line).
  dot: category | one or two values. A dot per value on an axis from the data, two values joined by a line and named above the first row. Use when: zero is not a meaningful baseline, or before and after per category. Not when: parts of a total (stacked).
  line: time | up to 4 series. A line per series, a focusable point per value, each line named at its end. Use when: change over time. Not when: fewer than 4 points (bar); unordered categories (bar).
  spark: time | one value. A word-sized line with its last value, no axes; beside a number in a table cell or list item, never in a sentence. Use when: the trend behind a number. Not when: the reader must read values off it (line).
  scatter: item | measure x | measure y. A dot per item, both axes named. Use when: does one measure rise with another. Not when: one measure (bar, histogram).
  histogram: bin | from | to | count. Adjacent bars over the bins, counts from zero. Use when: how one measure spreads, from counts already binned. Not when: the same spread across groups (box).
  box: group | min | lower quartile | median | upper quartile | max. A whisker from min to max, a box between the quartiles, a line at the median. Use when: one measure's spread compared across groups. Not when: one group (histogram); the reader does not know quartiles (dot of the medians).
  stacked: category | up to 4 parts. A bar per category split into its parts from zero, the total at its end, each part named above the first bar. Use when: parts of a whole, per category. Not when: comparing one part across categories (bar of that part); one category (bar of its parts).
  heatmap: row | a column per level. A cell per value, 5 steps of --seq-1 to --seq-5 from the lowest to the highest, a key of the steps with its lowest and highest value. Use when: one measure over two categories crossed. Not when: a mark for yes, partial or no (matrix).
  data-facet: on any kind, the table's first column names a group; one small chart per group, sharing its scales. Use when: more series than one chart holds, or one chart repeated per group. Not when: 2 or 3 series (one chart).
  states: default: the chart; hover: the mark turns accent and a tip shows its value; focus: the same with the mark's accent stroke, on the mark keyboard reached; open: the data table shows; disabled: none, played: Back at the first step, Next at the last.
  motion: played, marks move to the next table's values over --motion, only on a step change.
  player: optional, never autoplays: data-player (buttons) or data-player="scroll" with data-labels naming Back|Play|Pause|Next|Step, an <ol class="steps"> with one caption per step and one <table> per step in the <details>, in step order; the axes span every step. With data-player="scroll" the plot sticks and the caption crossing mid-viewport sets the step. Under prefers-reduced-motion: reduce, in print or without script, every caption is listed and the chart stands at its last table.
  keyboard: Tab reaches the chart's first mark; arrow keys move mark to mark, Home and End to the first and last; the details summary opens the table; played, the player's controls.
  screen reader: each mark is an image named by its row, column and cell text; the figcaption names the figure; the table follows.
  use when: numbers the reader should see as a pattern: a comparison, a trend, a spread, a relation, a share.
  not when: fewer than 3 numbers (a sentence); the exact values are the point (table). -->
<style>
  [data-widget="chart"] { --chart-grid: var(--hairline); --chart-axis: var(--border); --chart-gap: var(--sp-2); --chart-panel: calc(var(--page-width) / 3);
    position: relative; }
  [data-widget="chart"] figcaption { margin-bottom: var(--chart-gap); }
  [data-widget="chart"] .panel { overflow-x: auto; }
  [data-widget="chart"] .name { margin: 0; font: 700 var(--fs-m) var(--sans); }
  [data-widget="chart"][data-facet] .plot { display: grid; gap: var(--chart-gap); grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--chart-panel)), 1fr)); }
  [data-widget="chart"] svg { display: block; width: 100%; font: var(--fs-svg-label) var(--sans); }
  [data-widget="chart"] svg text { fill: var(--text); }
  [data-widget="chart"] svg .tick, [data-widget="chart"] svg .note { fill: var(--muted); }
  [data-widget="chart"] svg .grid { stroke: var(--chart-grid); stroke-width: var(--line); }
  [data-widget="chart"] svg .axis, [data-widget="chart"] svg .span { stroke: var(--chart-axis); stroke-width: var(--line); }
  [data-widget="chart"] svg .k1 { fill: var(--kind-1); stroke: var(--kind-1); } [data-widget="chart"] svg .k2 { fill: var(--kind-2); stroke: var(--kind-2); }
  [data-widget="chart"] svg .k3 { fill: var(--kind-3); stroke: var(--kind-3); } [data-widget="chart"] svg .k4 { fill: var(--kind-4); stroke: var(--kind-4); }
  [data-widget="chart"] svg .s1 { fill: var(--seq-1); } [data-widget="chart"] svg .s2 { fill: var(--seq-2); } [data-widget="chart"] svg .s3 { fill: var(--seq-3); }
  [data-widget="chart"] svg .s4 { fill: var(--seq-4); } [data-widget="chart"] svg .s5 { fill: var(--seq-5); }
  [data-widget="chart"] svg path.line { fill: none; stroke-width: var(--line-strong); }
  [data-widget="chart"] svg .bin, [data-chart="heatmap"] svg .mark { stroke: var(--bg); stroke-width: var(--line); }
  [data-widget="chart"] svg .box-plot { fill: var(--fill); stroke-width: var(--line-strong); }
  [data-widget="chart"] svg .box-plot .median { stroke: var(--text); }
  [data-widget="chart"] svg .mark { outline: none; cursor: default; }
  [data-widget="chart"] svg .mark:hover, [data-state="hover"] [data-widget="chart"] svg .mark[tabindex="0"] { stroke: var(--accent); stroke-width: var(--line-strong); }
  [data-widget="chart"] svg .mark:focus-visible, [data-state="focus"] [data-widget="chart"] svg .mark[tabindex="0"] { stroke: var(--accent); stroke-width: var(--line-mark); }
  [data-widget="chart"] .tip { position: absolute; z-index: 2; pointer-events: none; white-space: nowrap; font: var(--fs-m) var(--sans);
    background: var(--fill); border: var(--line) solid var(--border); padding: var(--sp-1) var(--sp-2); }
  [data-widget="chart"] .tip[hidden] { display: none; }
  [data-widget="chart"][data-player] .caption, [data-widget="chart"][data-player] .controls { display: none; }
  [data-widget="chart"][data-player] .controls { gap: var(--chart-gap); align-items: center; flex-wrap: wrap; margin: var(--chart-gap) 0; }
  [data-widget="chart"][data-player] .controls input { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); }
  [data-widget="chart"][data-player] .count { color: var(--muted); font-size: var(--fs-m); }
  @media screen and (prefers-reduced-motion: no-preference) {
    [data-widget="chart"].live svg :is(.mark, .mark *, .line) { transition: x var(--motion) var(--ease-out), y var(--motion) var(--ease-out),
      width var(--motion) var(--ease-out), height var(--motion) var(--ease-out), cx var(--motion) var(--ease-out), cy var(--motion) var(--ease-out),
      d var(--motion) var(--ease-out), fill var(--motion) var(--ease-out); }
    [data-widget="chart"][data-player].live .steps { display: none; }
    [data-widget="chart"][data-player].live .caption { display: block; }
    [data-widget="chart"][data-player].live .controls { display: flex; }
    [data-widget="chart"][data-player="scroll"].live :is(.caption, .controls) { display: none; }
    [data-widget="chart"][data-player="scroll"].live .steps { display: block; padding-inline-start: var(--sp-5); }
    [data-widget="chart"][data-player="scroll"].live .plot { position: sticky; top: 0; z-index: 1; background: var(--bg); }
    [data-widget="chart"][data-player="scroll"].live .steps > li { min-height: var(--scroll-step); color: var(--muted); transition: color var(--motion-fast) var(--ease-out); }
    [data-widget="chart"][data-player="scroll"].live .steps > li.now { color: var(--text); }
  }
</style>
<script>
  (() => {
    const NS = 'http://www.w3.org/2000/svg';
    const r2 = (v) => Math.round(v * 100) / 100;
    const num = (s) => parseFloat(s.replace(/[−–]/g, '-').replace(/[^\d.eE+-]/g, ''));
    const fmt = (v) => v.toLocaleString(document.documentElement.lang || undefined);
    const ext = (vs) => [Math.min(...vs), Math.max(...vs)];
    const sum = (vs) => vs.reduce((a, b) => a + b, 0);
    const el = (parent, tag, attrs = {}, text) => {
      const e = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
      if (text !== undefined) e.textContent = text;
      parent.append(e);
      return e;
    };
    const measure = (svg, text) => {
      const t = el(svg, 'text', {}, text);
      const w = t.getComputedTextLength();
      t.remove();
      return w;
    };
    // the scale-and-axis helper: nice ticks over a range, a linear scale, ticks that fit their labels
    const nice = ([lo, hi], n) => {
      if (lo === hi) { lo -= 1; hi += 1; }
      const raw = (hi - lo) / Math.max(n, 1);
      const p = 10 ** Math.floor(Math.log10(raw));
      const step = [1, 2, 5, 10].map((m) => m * p).find((s) => s >= raw * (1 - 1e-9));
      const a = Math.floor(lo / step + 1e-9) * step;
      const ticks = [];
      for (let t = a; t < hi + step - 1e-9 * step; t += step) ticks.push(+t.toPrecision(12));
      return { lo: ticks[0], hi: ticks[ticks.length - 1], ticks };
    };
    const scale = (d, r0, r1) => Object.assign((v) => r2(r0 + ((v - d.lo) / (d.hi - d.lo)) * (r1 - r0)), { d, r0, r1 });
    const fit = (svg, range, span, u) => {
      for (let n = Math.max(2, Math.floor(span / (u * 4))); ; n -= 1) {
        const d = nice(range, n);
        const w = d.ticks.map((t) => measure(svg, fmt(t)));
        if (n <= 1 || span / (d.ticks.length - 1) >= Math.max(...w) + u) return { ...d, first: w[0], last: w[w.length - 1] };
      }
    };
    const expose = (svg, axis, s) => { svg.dataset[axis] = `${s.d.lo} ${s.d.hi} ${s.r0} ${s.r1}`; };
    const size = (svg, w, h) => {
      svg.setAttribute('viewBox', `0 0 ${r2(w)} ${r2(h)}`);
      svg.setAttribute('height', r2(h));
      svg.style.width = w > svg.parentElement.clientWidth + 1 ? `${r2(w)}px` : '';
    };
    // layers: axes behind, marks kept between draws so a step change moves them, labels on top
    const layers = (svg) => {
      const [axes, marks, labels] = ['axes', 'marks', 'labels'].map((c) => svg.querySelector(`.${c}`) || el(svg, 'g', { class: c }));
      axes.replaceChildren();
      labels.replaceChildren();
      const old = new Map([...marks.children].map((m) => [m.dataset.key, m]));
      const seen = new Set();
      const mark = (key, tag, attrs, label) => {
        const m = old.get(key) || el(marks, tag, { 'data-key': key });
        old.set(key, m);
        Object.entries(attrs).forEach(([k, v]) => m.setAttribute(k, v));
        if (label) {
          if (!m.hasAttribute('tabindex')) m.setAttribute('tabindex', '-1');
          m.setAttribute('role', 'img');
          m.setAttribute('aria-label', label);
        }
        seen.add(key);
        return m;
      };
      const part = (g, name, tag, attrs) => Object.entries(attrs)
        .reduce((p, [k, v]) => { p.setAttribute(k, v); return p; }, g.querySelector(`.${name}`) || el(g, tag, { class: name }));
      const done = () => old.forEach((m, k) => { if (!seen.has(k)) m.remove(); });
      return { axes, labels, mark, part, done };
    };
    const name = (head, r, j, one) => (one ? `${r.label}: ${r.text[j]}` : `${r.label}, ${head[j + 1]}: ${r.text[j]}`);
    // bar, dot, stacked, box: a row per category, its label above its mark, a value axis below
    const rows = (kind) => (svg, data, sets, head, W, u) => {
      const L = layers(svg);
      const all = sets.flat();
      const cols = head.slice(1);
      const range = kind === 'bar' ? ext([0, ...all.flatMap((r) => r.v)])
        : kind === 'stacked' ? ext([0, ...all.map((r) => sum(r.v))]) : ext(all.flatMap((r) => r.v));
      const end = (r) => (kind === 'bar' ? r.text[0] : kind === 'stacked' ? fmt(sum(r.v)) : '');
      const endW = Math.max(0, ...data.map((r) => measure(svg, end(r))));
      const d = fit(svg, range, W - endW - u * 3, u);
      const X = scale(d, r2(d.first / 2 + 1), r2(W - Math.max(d.last / 2 + 1, endW ? endW + u / 2 : 0)));
      let y = 0;
      if ((kind === 'dot' || kind === 'stacked') && cols.length > 1 && data.length) {
        const lines = [];
        cols.forEach((c, j) => {
          const w = measure(svg, c) + u * 0.75;
          const x = Math.min(kind === 'dot' ? X(data[0].v[j]) : X(sum(data[0].v.slice(0, j))), W - w);
          let k = lines.findIndex((spans) => spans.every(([a, b]) => x + w + u / 2 <= a || x >= b + u / 2));
          if (k < 0) k = lines.push([]) - 1;
          lines[k].push([x, x + w]);
          el(L.labels, 'rect', { class: `k${j + 1}`, x, y: k * u * 1.4 + u * 0.15, width: u / 4, height: u });
          el(L.labels, 'text', { x: x + u * 0.5, y: k * u * 1.4 + u }, c);
        });
        y = lines.length * u * 1.4 + u * 0.2;
      }
      const top = y;
      data.forEach((r) => {
        el(L.labels, 'text', { x: X.r0, y: y + u }, r.label);
        const by = y + u * 1.5;
        const mid = by + u / 2;
        const key = `r${r.i}`;
        if (kind === 'bar') {
          L.mark(`${key}c0`, 'rect', { class: 'mark k1', x: Math.min(X(0), X(r.v[0])), y: by, width: r2(Math.abs(X(r.v[0]) - X(0))), height: u }, name(head, r, 0, true));
        } else if (kind === 'stacked') {
          r.v.forEach((v, j) => {
            const x = X(sum(r.v.slice(0, j)));
            L.mark(`${key}c${j}`, 'rect', { class: `mark k${j + 1}`, x, y: by, width: r2(X(sum(r.v.slice(0, j + 1))) - x), height: u }, name(head, r, j));
          });
        } else if (kind === 'dot') {
          if (r.v.length > 1) el(L.axes, 'line', { class: 'span', x1: X(Math.min(...r.v)), x2: X(Math.max(...r.v)), y1: mid, y2: mid });
          r.v.forEach((v, j) => L.mark(`${key}c${j}`, 'circle', { class: `mark k${j + 1}`, cx: X(v), cy: mid, r: u * 0.4 }, name(head, r, j, r.v.length === 1)));
        } else {
          const g = L.mark(key, 'g', { class: 'mark box-plot k1' }, `${r.label}: ${cols.map((c, j) => `${c} ${r.text[j]}`).join(', ')}`);
          const [min, q1, med, q3, max] = r.v;
          L.part(g, 'whisker', 'line', { x1: X(min), x2: X(max), y1: mid, y2: mid });
          L.part(g, 'box', 'rect', { x: X(q1), width: r2(X(q3) - X(q1)), y: by, height: u });
          L.part(g, 'median', 'line', { x1: X(med), x2: X(med), y1: by, y2: by + u });
        }
        if (end(r)) el(L.labels, 'text', { x: r2(Math.max(X(0), X(kind === 'bar' ? r.v[0] : sum(r.v))) + u / 3), y: by + u * 0.85 }, end(r));
        y = by + u * 1.9;
        if (r.note) {
          el(L.labels, 'text', { class: 'note', x: X.r0, y: y + u * 0.2 }, r.note);
          y += u * 1.4;
        }
      });
      d.ticks.forEach((t) => {
        el(L.axes, 'line', { class: 'grid', x1: X(t), x2: X(t), y1: top, y2: y });
        el(L.labels, 'text', { class: 'tick', x: X(t), y: y + u * 1.1, 'text-anchor': 'middle' }, fmt(t));
      });
      if (kind === 'bar' || kind === 'stacked') el(L.axes, 'line', { class: 'axis', x1: X(0), x2: X(0), y1: top, y2: y });
      expose(svg, 'x', X);
      size(svg, W, y + u * 1.5);
      L.done();
    };
    // line, spark, scatter, histogram: x across, y up
    const plane = (kind) => (svg, data, sets, head, W, u) => {
      const L = layers(svg);
      const all = sets.flat();
      const spark = kind === 'spark';
      const numeric = all.every((r) => !Number.isNaN(num(r.label)));
      const xOf = (r, i) => (kind === 'scatter' ? r.v[0] : numeric ? num(r.label) : i);
      const series = kind === 'line' || spark ? head.slice(1) : [];
      const xr = kind === 'histogram' ? ext(all.flatMap((r) => r.v.slice(0, 2)))
        : kind === 'scatter' ? ext(all.map((r) => r.v[0])) : numeric ? ext(all.map((r) => num(r.label))) : [0, Math.max(...sets.map((t) => t.length)) - 1];
      const yr = kind === 'histogram' ? [0, Math.max(...all.map((r) => r.v[2]))] : kind === 'scatter' ? ext(all.map((r) => r.v[1])) : ext(all.flatMap((r) => r.v));
      const H = spark ? u * 2 : u * 16;
      const top = spark ? u * 0.4 : u * (kind === 'scatter' ? 2 : 1);
      const bottom = spark ? H - u * 0.4 : H - u * 2.2;
      const flat = yr[0] === yr[1];
      const dy = spark ? { lo: yr[0] - flat, hi: yr[1] + flat, ticks: [] } : nice(yr, Math.max(2, Math.floor((bottom - top) / (u * 3))));
      const Y = scale(dy, bottom, top);
      const left = spark ? u * 0.3 : Math.max(...dy.ticks.map((t) => measure(svg, fmt(t)))) + u / 2;
      const last = data[data.length - 1];
      const right = spark ? measure(svg, last ? last.text[0] : '') + u * 0.6
        : kind === 'line' ? Math.max(...series.map((s) => measure(svg, s))) + u : u;
      let X;
      let xText = fmt;
      if (kind === 'line' || spark) {
        const w = spark ? 0 : Math.max(...data.map((r) => measure(svg, r.label))) + u;
        const every = Math.max(1, Math.ceil((data.length * w) / (W - left - right)));
        const at = new Map(data.map((r, i) => [xOf(r, i), r.label]));
        X = scale({ lo: xr[0], hi: xr[1] === xr[0] ? xr[0] + 1 : xr[1], ticks: spark ? [] : [...at.keys()].filter((t, i) => i % every === 0) },
          r2(left + w / 2), r2(W - Math.max(right, w / 2)));
        xText = (t) => at.get(t);
      } else {
        const d = fit(svg, xr, W - left - right, u);
        X = scale(d, r2(Math.max(left, d.first / 2 + 1)), r2(W - Math.max(right, d.last / 2 + 1)));
      }
      dy.ticks.forEach((t) => {
        el(L.axes, 'line', { class: t === 0 ? 'axis' : 'grid', x1: X.r0, x2: X.r1, y1: Y(t), y2: Y(t) });
        el(L.labels, 'text', { class: 'tick', x: r2(X.r0 - u / 3), y: r2(Y(t) + u * 0.35), 'text-anchor': 'end' }, fmt(t));
      });
      X.d.ticks.forEach((t) => el(L.labels, 'text', { class: 'tick', x: X(t), y: bottom + u * 1.7, 'text-anchor': 'middle' }, xText(t)));
      if (kind === 'scatter') {
        el(L.labels, 'text', { class: 'tick', x: 0, y: u }, head[2]);
        el(L.labels, 'text', { class: 'tick', x: W, y: H + u * 1.2, 'text-anchor': 'end' }, head[1]);
      }
      const note = (r, x, yy) => el(L.labels, 'text', { class: 'note', x, y: r2(Math.max(u, yy - u * 0.7)), 'text-anchor': x < W / 2 ? 'start' : 'end' }, r.note);
      if (kind === 'histogram') {
        data.forEach((r) => L.mark(`r${r.i}`, 'rect', { class: 'mark bin k1', x: X(r.v[0]), width: r2(X(r.v[1]) - X(r.v[0])), y: Y(r.v[2]), height: r2(Y(0) - Y(r.v[2])) }, `${r.label}: ${r.text[2]}`));
      } else if (kind === 'scatter') {
        data.forEach((r) => {
          L.mark(`r${r.i}`, 'circle', { class: 'mark k1', cx: X(r.v[0]), cy: Y(r.v[1]), r: u * 0.35 }, `${r.label}: ${head[1]} ${r.text[0]}, ${head[2]} ${r.text[1]}`);
          if (r.note) note(r, X(r.v[0]), Y(r.v[1]));
        });
      } else {
        const ends = [];
        series.forEach((s, j) => {
          const pts = data.map((r, i) => [X(xOf(r, i)), Y(r.v[j])]);
          L.mark(`p${j}`, 'path', { class: `line k${j + 1}`, d: pts.map(([x, yy], i) => `${i ? 'L' : 'M'}${x} ${yy}`).join(' ') });
          data.forEach((r, i) => L.mark(`r${r.i}c${j}`, 'circle', { class: `mark k${j + 1}`, cx: pts[i][0], cy: pts[i][1], r: u * (spark ? 0.2 : 0.3) }, name(head, r, j, series.length === 1)));
          if (pts.length) ends.push({ text: spark ? last.text[j] : s, x: pts[pts.length - 1][0], y: pts[pts.length - 1][1] });
        });
        ends.sort((a, b) => a.y - b.y).forEach((e, i, a) => { if (i) e.y = Math.max(e.y, a[i - 1].y + u * 1.1); });
        const over = ends.length ? ends[ends.length - 1].y - (H - u * 0.4) : 0;
        ends.forEach((e) => el(L.labels, 'text', { x: r2(e.x + u / 2), y: r2(Math.min(H - u * 0.3, Math.max(u, e.y - Math.max(0, over) + u * 0.35))) }, e.text));
        data.forEach((r, i) => { if (r.note) note(r, X(xOf(r, i)), Y(r.v[0])); });
      }
      expose(svg, 'x', X);
      expose(svg, 'y', Y);
      size(svg, W, kind === 'scatter' ? H + u * 1.6 : H);
      L.done();
    };
    // heatmap: a cell per value, coloured in 5 steps from the lowest value to the highest
    const heatmap = (svg, data, sets, head, W, u) => {
      const L = layers(svg);
      const all = sets.flat();
      const cols = head.slice(1);
      const [lo, hi] = ext(all.flatMap((r) => r.v));
      const step = (v) => (hi === lo ? 3 : Math.min(5, Math.floor(((v - lo) / (hi - lo)) * 5) + 1));
      const left = Math.max(0, ...data.map((r) => measure(svg, r.label))) + u / 2;
      const cw = r2(Math.max(u * 2, ...cols.map((c) => measure(svg, c) + u / 2), (W - left) / cols.length));
      const ch = u * 2;
      const top = u * 1.5;
      cols.forEach((c, j) => el(L.labels, 'text', { x: r2(left + cw * (j + 0.5)), y: u, 'text-anchor': 'middle' }, c));
      data.forEach((r, i) => {
        el(L.labels, 'text', { x: 0, y: r2(top + ch * i + ch / 2 + u * 0.35) }, r.label);
        r.v.forEach((v, j) => L.mark(`r${r.i}c${j}`, 'rect', { class: `mark s${step(v)}`, x: r2(left + cw * j), y: top + ch * i, width: cw, height: ch }, name(head, r, j)));
      });
      const ky = top + ch * data.length + u * 0.8;
      const kx = measure(svg, fmt(lo)) + u / 2;
      el(L.labels, 'text', { class: 'tick', x: 0, y: ky + u * 0.85 }, fmt(lo));
      [1, 2, 3, 4, 5].forEach((k) => el(L.axes, 'rect', { class: `s${k}`, x: r2(kx + (k - 1) * u * 2), y: ky, width: u * 2, height: u }));
      el(L.labels, 'text', { class: 'tick', x: r2(kx + u * 10.5), y: ky + u * 0.85 }, fmt(hi));
      svg.dataset.v = `${lo} ${hi}`;
      size(svg, Math.max(W, left + cw * cols.length, kx + u * 11 + measure(svg, fmt(hi))), ky + u * 1.4);
      L.done();
    };
    const kinds = { bar: rows('bar'), dot: rows('dot'), stacked: rows('stacked'), box: rows('box'),
      line: plane('line'), spark: plane('spark'), scatter: plane('scatter'), histogram: plane('histogram'), heatmap };
    const read = (table, facet) => {
      const head = [...table.tHead.rows[0].cells].map((c) => c.textContent.trim());
      const data = [...table.tBodies[0].rows].map((tr, i) => {
        const cells = [...tr.cells].map((c) => c.textContent.trim());
        const [group, label, ...text] = facet ? cells : [null, ...cells];
        return { i, group, label, text, v: text.map(num), note: tr.dataset.note };
      });
      return { head: facet ? head.slice(1) : head, data };
    };
    const draw = (fig) => {
      const facet = fig.hasAttribute('data-facet');
      const tables = [...fig.querySelectorAll('table')].map((t) => read(t, facet));
      const { head, data } = tables[+fig.dataset.at];
      const groups = facet ? [...new Set(data.map((r) => r.group))] : [null];
      // every row list any step or panel draws: the axes span them all
      const sets = tables.flatMap((t) => [...new Set(t.data.map((r) => r.group))].map((g) => t.data.filter((r) => r.group === g)));
      const plot = fig.querySelector('.plot');
      [...plot.children].slice(groups.length).forEach((p) => p.remove());
      groups.forEach((g, i) => {
        let panel = plot.children[i];
        if (!panel) {
          panel = plot.appendChild(document.createElement('div'));
          panel.className = 'panel';
          if (facet) panel.append(Object.assign(document.createElement('p'), { className: 'name' }));
          panel.append(document.createElementNS(NS, 'svg'));
        }
        if (facet) panel.querySelector('.name').textContent = g;
        const svg = panel.querySelector('svg');
        svg.setAttribute('role', 'group');
        svg.setAttribute('aria-label', g ?? fig.querySelector('figcaption').textContent.trim());
        kinds[fig.dataset.chart](svg, data.filter((r) => r.group === g), sets, head, panel.clientWidth, parseFloat(getComputedStyle(svg).fontSize));
      });
      const marks = [...fig.querySelectorAll('.mark')];
      if (marks.length && !marks.some((m) => m.getAttribute('tabindex') === '0')) marks[0].setAttribute('tabindex', '0');
    };
    const player = (fig, n) => {
      const steps = [...fig.querySelectorAll('.steps > li')];
      const dwell = 2400;
      const [backText, playText, pauseText, nextText, stepText] = (fig.dataset.labels || 'Back|Play|Pause|Next|Step').split('|');
      const caption = document.createElement('p');
      caption.className = 'caption';
      caption.setAttribute('aria-live', 'polite');
      const controls = document.createElement('div');
      controls.className = 'controls';
      controls.innerHTML = '<button type="button"></button><button type="button"></button><button type="button"></button>'
        + '<input type="range" min="1" step="1"><span class="count"></span>';
      fig.append(caption, controls);
      const [back, play, next] = controls.querySelectorAll('button');
      const range = controls.querySelector('input');
      const count = controls.querySelector('.count');
      back.textContent = backText;
      play.textContent = playText;
      next.textContent = nextText;
      range.setAttribute('aria-label', stepText);
      range.max = n;
      let at = 1;
      let timer = null;
      const stop = () => { clearInterval(timer); timer = null; play.textContent = playText; };
      const show = (k) => {
        at = Math.min(Math.max(k, 1), n);
        steps.forEach((li, i) => li.classList.toggle('now', i === at - 1));
        fig.dataset.at = at - 1;
        draw(fig);
        caption.textContent = `${at}. ${steps[at - 1].textContent.trim()}`;
        range.value = at;
        count.textContent = `${at} / ${n}`;
        back.disabled = at === 1;
        next.disabled = at === n;
        if (at === n) stop();
      };
      back.addEventListener('click', () => { stop(); show(at - 1); });
      next.addEventListener('click', () => { stop(); show(at + 1); });
      range.addEventListener('input', () => { stop(); show(+range.value); });
      play.addEventListener('click', () => {
        if (timer) { stop(); return; }
        if (at === n) show(1);
        play.textContent = pauseText;
        timer = setInterval(() => show(at + 1), dwell);
      });
      if (fig.dataset.player === 'scroll') {
        const seen = new IntersectionObserver((entries) => entries.forEach((e) => {
          if (e.isIntersecting) show(steps.indexOf(e.target) + 1);
        }), { root: document, rootMargin: '-50% 0px -50% 0px' });
        steps.forEach((li) => seen.observe(li));
      }
      fig.classList.add('live');
      show(1);
    };
    document.querySelectorAll('[data-widget="chart"]').forEach((fig) => {
      const n = fig.querySelectorAll('table').length;
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      fig.dataset.at = n - 1;
      if (fig.hasAttribute('data-player') && n > 1 && !still) player(fig, n);
      else draw(fig);
      const tip = fig.appendChild(document.createElement('div'));
      tip.className = 'tip';
      tip.hidden = true;
      tip.setAttribute('aria-hidden', 'true');
      const show = (m) => {
        tip.textContent = m.getAttribute('aria-label');
        tip.hidden = false;
        const f = fig.getBoundingClientRect();
        const r = m.getBoundingClientRect();
        const y = r.top - f.top - tip.offsetHeight - 4;
        tip.style.left = `${Math.max(0, Math.min(r.left + r.width / 2 - f.left - tip.offsetWidth / 2, f.width - tip.offsetWidth))}px`;
        tip.style.top = `${y < 0 ? r.bottom - f.top + 4 : y}px`;
      };
      const hide = () => { tip.hidden = true; };
      fig.addEventListener('pointerover', (e) => { const m = e.target.closest('.mark'); if (m) show(m); else hide(); });
      fig.addEventListener('pointerleave', hide);
      fig.addEventListener('focusin', (e) => { if (e.target.closest('.mark')) show(e.target.closest('.mark')); });
      fig.addEventListener('focusout', hide);
      fig.addEventListener('keydown', (e) => {
        const marks = [...fig.querySelectorAll('.mark')];
        const i = marks.indexOf(e.target);
        const j = { ArrowRight: i + 1, ArrowDown: i + 1, ArrowLeft: i - 1, ArrowUp: i - 1, Home: 0, End: marks.length - 1 }[e.key];
        if (i < 0 || j === undefined) return;
        e.preventDefault();
        const m = marks[Math.max(0, Math.min(j, marks.length - 1))];
        marks.forEach((x) => x.setAttribute('tabindex', x === m ? '0' : '-1'));
        m.focus();
      });
      let width = fig.querySelector('.plot').clientWidth;
      new ResizeObserver(() => {
        const w = fig.querySelector('.plot').clientWidth;
        if (w !== width) { width = w; draw(fig); }
      }).observe(fig.querySelector('.plot'));
    });
  })();
</script>
<section aria-labelledby="{{id}}">
  <h2 id="{{id}}">{{what the chart shows, as a noun phrase}}</h2>
  <figure data-widget="chart" data-chart="bar">
    <figcaption>{{one sentence: the one thing to read off the chart}}</figcaption>
    <div class="plot"></div>
    <details>
      <summary>{{Data table}}</summary>
      <div class="scroll"><table>
        <thead><tr><th scope="col">{{category}}</th><th scope="col">{{measure, with its unit}}</th></tr></thead>
        <tbody>
          <tr><th scope="row">{{category 1}}</th><td>{{value 1}}</td></tr>
          <tr data-note="{{a few words}}"><th scope="row">{{category 2}}</th><td>{{value 2}}</td></tr>
          <tr><th scope="row">{{category 3}}</th><td>{{value 3}}</td></tr>
        </tbody>
      </table></div>
    </details>
  </figure>
</section>
