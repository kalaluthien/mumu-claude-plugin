<!-- table: rows sharing columns.
  anatomy: a heading, a .scroll region holding one table (column headers, a row header per item), a muted line saying what bold means.
  fill: one row per item; criteria fixed before any row; bold only the cells a verdict turns on.
  states: default; hover: the row takes the page background; focus: outline on the scroll region; open: none; disabled: none.
  motion: a row's background eases over --motion-fast.
  keyboard: Tab to the region; arrow keys scroll it.
  screen reader: a region named by the heading; th scope gives each cell its row and column.
  use when: options against criteria, findings, done-criteria.
  not when: one dimension (a list); prose with reasons (section). -->
<style>
  [data-widget="table"] { --table-pad: var(--sp-2) var(--sp-3); --table-hover: var(--bg); }
  [data-widget="table"] table { border-collapse: collapse; min-width: 100%; background: var(--fill); }
  [data-widget="table"] th, [data-widget="table"] td { border-bottom: var(--line) solid var(--border); padding: var(--table-pad); text-align: start; vertical-align: top; }
  [data-widget="table"] tbody th { font-weight: normal; }
  [data-widget="table"] tbody tr { transition: background-color var(--motion-fast) var(--ease-out); }
  [data-widget="table"] tbody tr:hover, [data-state="hover"] [data-widget="table"] tbody tr:first-child { background: var(--table-hover); }
  [data-state="focus"] [data-widget="table"] { outline: var(--line-strong) solid var(--accent); }
</style>
<section aria-labelledby="{{id}}">
  <h2 id="{{id}}">{{what the rows compare, as a noun phrase}}</h2>
  <div data-widget="table" class="scroll" tabindex="0" role="region" aria-labelledby="{{id}}">
    <table>
      <thead><tr><th scope="col">{{item}}</th><th scope="col">{{criterion}}</th></tr></thead>
      <tbody><tr><th scope="row">{{row}}</th><td><strong>{{value a verdict turns on}}</strong></td></tr></tbody>
    </table>
  </div>
  <p class="muted"><strong>{{Bold}}</strong>: {{what turns on it}}.</p>
</section>
