<!-- state-machine: the states one thing can be in and the events that move it.
  anatomy: an initial dot, each state a rounded .box, a final ring; each transition a .part: a one-way .edge with its label on a .mask; a self-loop over a box for an event that keeps the state; a key in the figcaption.
  fill: one thing per figure; every state it can be in, every transition labelled `event [guard] / action`, one with a real example value; the unlabelled edge out of the dot is the start, into the ring the end; .main on the state the text is about; dashed (.inferred) where inferred, not read; coordinates divisible by 4, arrows orthogonal with r=8 elbows, labels 8 px off their line; every id prefixed with {{id}}.
  states: default; hover: the transition turns accent; focus: the same, with an outline; open: none, nothing folds; disabled: none.
  motion: a transition's colour eases over --motion-fast, only on hover or focus; none under reduced motion.
  keyboard: Tab moves through the figure and each transition.
  screen reader: role="img" with <title> and <desc>; the desc lists the states and, per transition, from, event, to.
  use when: a lifecycle, a status field, a protocol: states and the events between them.
  not when: calls between participants in order (use-case); who reaches whom (system-context). -->
<style>
  [data-widget="state-machine"] { --state-machine-stroke: var(--line-strong); --state-machine-hover: var(--accent); }
  [data-widget="state-machine"] svg { display: block; }
  [data-widget="state-machine"] text { fill: var(--text); font: var(--fs-svg) var(--sans); }
  [data-widget="state-machine"] .label { fill: var(--muted); font-size: var(--fs-svg-label); }
  [data-widget="state-machine"] .box { fill: var(--fill); stroke: var(--border); }
  [data-widget="state-machine"] .box.main { stroke: var(--text); stroke-width: var(--state-machine-stroke); }
  [data-widget="state-machine"] .start, [data-widget="state-machine"] .end-dot, [data-widget="state-machine"] .tip { fill: var(--text); }
  [data-widget="state-machine"] .end { fill: none; stroke: var(--text); stroke-width: var(--state-machine-stroke); }
  [data-widget="state-machine"] .edge { stroke: var(--text); stroke-width: var(--state-machine-stroke); fill: none; }
  [data-widget="state-machine"] .edge.inferred { stroke-dasharray: 4 4; }
  [data-widget="state-machine"] .mask { fill: var(--bg); }
  [data-widget="state-machine"] .part { outline: none; }
  [data-widget="state-machine"] .part:hover .edge, [data-widget="state-machine"] .part:focus-visible .edge,
  [data-state="hover"] [data-widget="state-machine"] .part:first-of-type .edge,
  [data-state="focus"] [data-widget="state-machine"] .part:first-of-type .edge { stroke: var(--state-machine-hover); }
  [data-widget="state-machine"] .part:hover text, [data-widget="state-machine"] .part:focus-visible text,
  [data-state="hover"] [data-widget="state-machine"] .part:first-of-type text,
  [data-state="focus"] [data-widget="state-machine"] .part:first-of-type text { fill: var(--state-machine-hover); }
  [data-widget="state-machine"] .part:focus-visible, [data-state="focus"] [data-widget="state-machine"] .part:first-of-type { outline: var(--line-strong) solid var(--accent); }
  @media screen and (prefers-reduced-motion: no-preference) {
    [data-widget="state-machine"] .edge { transition: stroke var(--motion-fast) var(--ease-out); }
    [data-widget="state-machine"] .part text { transition: fill var(--motion-fast) var(--ease-out); }
  }
</style>
<section aria-labelledby="{{id}}">
  <h2 id="{{id}}">{{the thing and its states, as a noun phrase}}</h2>
  <figure data-widget="state-machine" class="scroll" tabindex="0" aria-labelledby="{{id}}-title">
    <svg width="520" height="168" viewBox="0 0 520 168" role="img" aria-labelledby="{{id}}-title" aria-describedby="{{id}}-desc">
      <title id="{{id}}-title">{{states: thing}}</title>
      <desc id="{{id}}-desc">{{the states, then each transition as from, event, to}}</desc>
      <defs>
        <marker id="{{id}}-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path class="tip" d="M0,0 L10,5 L0,10 z"/>
        </marker>
      </defs>
      <circle class="start" cx="24" cy="80" r="8"/>
      <path class="edge" d="M32,80 H60" marker-end="url(#{{id}}-arrow)"/>
      <rect class="box main" x="64" y="56" width="128" height="48" rx="8"/>
      <text x="128" y="84" text-anchor="middle">{{state A}}</text>
      <rect class="box" x="288" y="56" width="128" height="48" rx="8"/>
      <text x="352" y="84" text-anchor="middle">{{state B}}</text>
      <circle class="end" cx="488" cy="80" r="12"/>
      <circle class="end-dot" cx="488" cy="80" r="6"/>
      <g class="part" tabindex="0">
        <path class="edge" d="M192,80 H284" marker-end="url(#{{id}}-arrow)"/>
        <text class="label" x="240" y="72" text-anchor="middle">{{event, e.g. submit id=7}}</text>
      </g>
      <g class="part" tabindex="0">
        <path class="edge" d="M352,104 V124 Q352,132 344,132 H136 Q128,132 128,124 V108" marker-end="url(#{{id}}-arrow)"/>
        <text class="label" x="240" y="152" text-anchor="middle">{{event [guard] / action}}</text>
      </g>
      <g class="part" tabindex="0">
        <path class="edge inferred" d="M112,56 V40 Q112,32 120,32 H136 Q144,32 144,40 V52" marker-end="url(#{{id}}-arrow)"/>
        <text class="label" x="128" y="24" text-anchor="middle">{{event that keeps the state}}</text>
      </g>
      <g class="part" tabindex="0">
        <path class="edge" d="M416,80 H472" marker-end="url(#{{id}}-arrow)"/>
      </g>
    </svg>
    <figcaption class="muted">{{dot, box, ring, bold box, dashed: what each means; what was merged or dropped}}</figcaption>
  </figure>
</section>
