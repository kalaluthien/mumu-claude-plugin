<!-- question: the open questions only the reader can settle.
  anatomy: a form with an h2; one fieldset per question: legend Qn and title, the body, the recommendation, an answer textarea prefilled with it; a submit button; a status line; the answer block.
  fill: number Q1, Q2 in order; one round per page; the form writes nowhere: it builds the block the reader pastes back (references/interview.md).
  states: default; hover: the button's border turns accent; focus: outline on the field; open: the answer block reveals after submit; disabled: the button and fields dim and refuse input.
  motion: the answer block fades and drops in over --motion.
  keyboard: Tab through the answers and the button; Enter on the button builds the block.
  screen reader: each fieldset named by its legend; the status line is a live region.
  use when: a decision, a plan or a proposal with open choices.
  not when: four questions or fewer with AskUserQuestion at hand; facts the writer can find. -->
<style>
  [data-widget="question"] { --question-gap: var(--sp-4); }
  [data-widget="question"] fieldset { border: var(--line) solid var(--border); border-radius: var(--radius-s); margin: 0 0 var(--question-gap); padding: var(--sp-3) var(--sp-4); }
  [data-widget="question"] legend { font-weight: 600; padding: 0 var(--sp-1); }
  [data-widget="question"] textarea { width: 100%; box-sizing: border-box; }
  [data-widget="question"] .out { margin-top: var(--question-gap); font-family: var(--mono); animation: reveal var(--motion) var(--ease-out); }
</style>
<form data-widget="question" data-copied="{{Copied: paste it into the chat}}" data-selected="{{Selected: copy it and paste it into the chat}}" data-target="{{target}}" data-round="{{n}}" aria-labelledby="{{id}}">
  <h2 id="{{id}}">{{the decision, as a noun phrase}}</h2>
  <fieldset>
    <legend>Q1: {{question title}}</legend>
    <p>{{question body}}</p>
    <p><strong>{{Recommended}}:</strong> {{recommended answer}}</p>
    <label for="{{id}}-q1">{{Answer}}</label>
    <textarea id="{{id}}-q1" name="Q1" rows="3">{{recommended answer}}</textarea>
  </fieldset>
  <button type="submit">{{Build the answer block}}</button> <span class="status" role="status"></span>
  <label for="{{id}}-out" hidden>{{Answer block}}</label>
  <textarea id="{{id}}-out" class="out" rows="8" readonly hidden></textarea>
</form>
<script>
  document.querySelectorAll('form[data-widget="question"]').forEach((form) => {
    const out = form.querySelector('.out');
    const status = form.querySelector('.status');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const answers = [...form.querySelectorAll('fieldset textarea')].map((t) => {
        const lines = t.value.trim() ? t.value.trim().split('\n') : [];
        return [`${t.name}:`, ...lines.map((l) => `  ${l}`)].join('\n');
      });
      out.value = [`writing-documents: ${form.dataset.target}, round ${form.dataset.round}`, ...answers].join('\n');
      out.hidden = false;
      out.labels[0].hidden = false;
      out.select();
      try {
        await navigator.clipboard.writeText(out.value);
        status.textContent = form.dataset.copied;
      } catch {
        status.textContent = form.dataset.selected;
      }
    });
  });
</script>
