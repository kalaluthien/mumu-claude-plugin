<!-- preview: a result (a page, a screen, an email) shown small first; a button opens it at full size.
  anatomy: a section with an h2; a figure: a .frame holding the result scaled down, an <iframe sandbox srcdoc> of its HTML or an <img src alt>; a figcaption with the caption and the open button; a <dialog> with a bar (its title, the close button) and a .full box the script fills with a copy of the result.
  fill: one result per copy; srcdoc holds the whole result HTML with every " written &quot;, nothing fetched from the network; an image result replaces the iframe with <img src="data:..." alt="{{what it shows}}">; the caption says what the result is and where it appears.
  states: default: the small frame; hover: the button's border turns accent; focus: outline on the button; open: the full view over the page, or in place when forced; disabled: the button dims and refuses input.
  motion: the full view fades and drops in over --motion as it opens.
  keyboard: Tab to the open button; Enter or Space opens the full view, focus moves into it; the close button or Esc closes it and focus returns to the open button.
  screen reader: the figure is named by its caption; the iframe by its title; the full view is a modal dialog named by its bar's title.
  use when: what a reader will see: a page, a screen, an email, a rendered output.
  not when: the structure behind it (file-tree, system-context); a before and after (before-after). -->
<style>
  [data-widget="preview"] { --preview-scale: .5; --preview-ratio: 4 / 3; --preview-full: var(--scroll-step); margin: var(--sp-2) 0; }
  [data-widget="preview"] .frame { position: relative; overflow: hidden; aspect-ratio: var(--preview-ratio); background: var(--fill); border: var(--line) solid var(--border); border-radius: var(--radius-s); }
  [data-widget="preview"] .frame > iframe { position: absolute; inset: 0 auto auto 0; width: calc(100% / var(--preview-scale)); height: calc(100% / var(--preview-scale)); border: 0; transform: scale(var(--preview-scale)); transform-origin: 0 0; pointer-events: none; background: var(--fill); }
  [data-widget="preview"] .frame > img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  [data-widget="preview"] figcaption { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-2); margin-top: var(--sp-2); color: var(--muted); font-size: var(--fs-m); }
  [data-widget="preview"] dialog { box-sizing: border-box; width: 100%; height: 100%; max-width: 100%; max-height: 100%; margin: 0; padding: 0; border: 0; background: var(--bg); color: var(--text); }
  [data-widget="preview"] dialog[open] { display: flex; flex-direction: column; animation: reveal var(--motion) var(--ease-out); }
  [data-state="open"] [data-widget="preview"] dialog { display: flex; flex-direction: column; position: static; height: auto; margin-top: var(--sp-2); border: var(--line) solid var(--border); border-radius: var(--radius-s); animation: reveal var(--motion) var(--ease-out); }
  [data-widget="preview"] .bar { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); padding: var(--sp-2) var(--gutter); border-bottom: var(--line) solid var(--border); }
  [data-widget="preview"] .bar h3 { margin: 0; font-size: var(--fs-base); overflow-wrap: anywhere; }
  [data-widget="preview"] .full { flex: 1 1 auto; min-height: var(--preview-full); overflow: auto; }
  [data-widget="preview"] .full > iframe { display: block; width: 100%; height: 100%; min-height: var(--preview-full); border: 0; background: var(--fill); }
  [data-widget="preview"] .full > img { display: block; max-width: 100%; margin: 0 auto; }
</style>
<script>
  document.querySelectorAll('[data-widget="preview"]').forEach((fig) => {
    const dialog = fig.querySelector('dialog');
    const result = fig.querySelector('.frame > iframe, .frame > img');
    const copy = result.cloneNode(true);
    copy.removeAttribute('tabindex');
    copy.removeAttribute('aria-hidden');
    fig.querySelector('.full').append(copy);
    fig.querySelector('.open').addEventListener('click', () => { if (!dialog.open) dialog.showModal(); });
    fig.querySelector('.close').addEventListener('click', () => dialog.close());
  });
</script>
<section aria-labelledby="{{id}}">
  <h2 id="{{id}}">{{the result, as a noun phrase}}</h2>
  <figure data-widget="preview" aria-labelledby="{{id}}-cap">
    <div class="frame">
      <iframe sandbox srcdoc="{{the result's HTML}}" title="{{what the result is}}" tabindex="-1" aria-hidden="true"></iframe>
    </div>
    <figcaption><span id="{{id}}-cap">{{what the result is, and where it appears}}</span>
      <button type="button" class="open" aria-haspopup="dialog">{{Open at full size}}</button></figcaption>
    <dialog aria-labelledby="{{id}}-title" closedby="any">
      <div class="bar"><h3 id="{{id}}-title">{{what the result is}}</h3>
        <button type="button" class="close">{{Close}}</button></div>
      <div class="full"></div>
    </dialog>
  </figure>
</section>
