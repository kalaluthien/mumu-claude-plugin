<!-- use-case: what happens in one use case; two use cases, two copies. With data-player it plays: a token travels the flow one step at a time.
  anatomy: participants as .box across the top, a .lifeline under each, time downward; each call a .part marked data-step="k": a numbered one-way .edge with its label; a .token circle; an <ol class="steps">, one caption per call, its data-x and data-y the edge's arrow head; a figcaption.
  fill: only the participants and calls the use case needs; one label carries a real example value; dashed (.inferred) where inferred, not read; add a step with +48 to y and to the svg height; a changed flow shows before and after; every id prefixed with {{id}}. Played, when the reader follows it one step at a time: keep data-player; else delete data-player, data-labels and the token, and the captions stay as the numbered steps.
  states: default: still, every step shown; played, step 1 and later steps dimmed; hover: the step turns accent; focus: the same, with an outline, on a step or a control; open: none; disabled: none, played: Back at the first step, Next at the last.
  motion: an edge's colour eases over --motion-fast; played, the token moves and a step's dimming eases over --motion, only on a step change.
  player: built in, never autoplays: the root keeps data-player (buttons) or data-player="scroll", and data-labels naming Back|Play|Pause|Next|Step in the page's language; the script adds a caption line and Back, Play or Pause, Next, a scrubber and a step count; at step k, parts with data-step up to k get .on and the one at k .now. With data-player="scroll" the stage sticks and the caption crossing mid-viewport sets the step, reversing exactly on scroll up. Under prefers-reduced-motion: reduce, in print or without script, every caption is listed, numbered, and the stage stands at its last step.
  keyboard: Tab moves through the figure and each step; played, the player's controls.
  screen reader: role="img" with <title> and <desc>; the desc lists the steps; played, each caption is announced as it shows.
  use when: behaviour, one use case at a time; played, a request or data travelling the system, explained step by step.
  not when: who calls whom without order (system-context); a structure changing (before-after). -->
<style>
[data-widget="use-case"] svg { display: block; }
[data-widget="use-case"] svg text { fill: var(--text); font: var(--fs-svg) var(--sans); }
[data-widget="use-case"] svg .label { fill: var(--muted); font-size: var(--fs-svg-label); }
[data-widget="use-case"] svg .box { fill: var(--fill); stroke: var(--border); }
[data-widget="use-case"] svg .box.main { stroke: var(--text); stroke-width: var(--line-strong); }
[data-widget="use-case"] svg .box.k1 { stroke: var(--kind-1); } [data-widget="use-case"] svg .box.k2 { stroke: var(--kind-2); }
[data-widget="use-case"] svg .box.k3 { stroke: var(--kind-3); } [data-widget="use-case"] svg .box.k4 { stroke: var(--kind-4); }
[data-widget="use-case"] svg .edge { stroke: var(--text); stroke-width: var(--line-strong); fill: none;
            transition: stroke var(--motion-fast) var(--ease-out); }
[data-widget="use-case"] svg .edge.inferred { stroke-dasharray: 4 4; }
[data-widget="use-case"] svg .edge.ok { stroke: var(--ok); } [data-widget="use-case"] svg .edge.warn { stroke: var(--warn); } [data-widget="use-case"] svg .edge.fail { stroke: var(--fail); }
[data-widget="use-case"] svg .lifeline { stroke: var(--border); stroke-width: var(--line); stroke-dasharray: 4 4; }
[data-widget="use-case"] svg .tip { fill: var(--text); }
[data-widget="use-case"] svg .mask { fill: var(--bg); }
[data-widget="use-case"] svg .part { outline: none; }
[data-widget="use-case"] svg .part:hover .edge, [data-widget="use-case"] svg .part:focus-visible .edge, [data-state="hover"] [data-widget="use-case"] svg .part:first-of-type .edge { stroke: var(--accent); }
[data-widget="use-case"] svg .part:hover text, [data-widget="use-case"] svg .part:focus-visible text, [data-state="hover"] [data-widget="use-case"] svg .part:first-of-type text { fill: var(--accent); }
[data-state="focus"] [data-widget="use-case"] svg .part:first-of-type { outline: var(--line-strong) solid var(--accent); }
  [data-widget="use-case"] { --use-case-token: var(--accent); --use-case-pending: var(--disabled); --x: 0; --y: 0; }
  [data-widget="use-case"] .token { fill: var(--use-case-token); display: none; }
  @media screen and (prefers-reduced-motion: no-preference) {
    [data-widget="use-case"].live .token { display: inline; transform: translate(var(--x), var(--y)); transition: transform var(--motion) var(--ease-out); }
    [data-widget="use-case"].live [data-step] { transition: opacity var(--motion) var(--ease-out); }
    [data-widget="use-case"].live [data-step]:not(.on) { opacity: var(--use-case-pending); }
    [data-widget="use-case"].live .now .edge { stroke: var(--accent); }
    [data-widget="use-case"].live .now text { fill: var(--accent); }
  }
</style>
<style>
  [data-widget="use-case"][data-player] { --use-case-gap: var(--sp-2); }
  [data-widget="use-case"][data-player] .steps { margin: var(--use-case-gap) 0; }
  [data-widget="use-case"][data-player] .caption, [data-widget="use-case"][data-player] .controls { display: none; }
  [data-widget="use-case"][data-player] .controls { gap: var(--use-case-gap); align-items: center; flex-wrap: wrap; margin: var(--use-case-gap) 0; }
  [data-widget="use-case"][data-player] .controls input { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); }
  [data-widget="use-case"][data-player] .count { color: var(--muted); font-size: var(--fs-m); }
  @media screen and (prefers-reduced-motion: no-preference) {
    [data-widget="use-case"][data-player].live .steps { display: none; }
    [data-widget="use-case"][data-player].live .caption { display: block; }
    [data-widget="use-case"][data-player].live .controls { display: flex; }
    [data-widget="use-case"][data-player="scroll"].live .caption, [data-widget="use-case"][data-player="scroll"].live .controls { display: none; }
    [data-widget="use-case"][data-player="scroll"].live .steps { display: block; padding-inline-start: var(--sp-5); }
    [data-widget="use-case"][data-player="scroll"].live .stage { position: sticky; top: 0; z-index: 1; background: var(--bg); }
    [data-widget="use-case"][data-player="scroll"].live .steps > li { min-height: var(--scroll-step); color: var(--muted); transition: color var(--motion-fast) var(--ease-out); }
    [data-widget="use-case"][data-player="scroll"].live .steps > li.now { color: var(--text); }
  }
</style>
<script>
  document.querySelectorAll('[data-widget="use-case"][data-player]').forEach((root) => {
    const steps = [...root.querySelectorAll('.steps > li')];
    const n = steps.length;
    const dwell = 2400;
    const [backText, playText, pauseText, nextText, stepText] = (root.dataset.labels || 'Back|Play|Pause|Next|Step').split('|');
    const scroll = root.dataset.player === 'scroll';
    const caption = document.createElement('p');
    caption.className = 'caption';
    caption.setAttribute('aria-live', 'polite');
    const controls = document.createElement('div');
    controls.className = 'controls';
    controls.innerHTML = '<button type="button"></button><button type="button"></button><button type="button"></button>'
      + '<input type="range" min="1" step="1"><span class="count"></span>';
    root.append(caption, controls);
    const [back, play, next] = controls.querySelectorAll('button');
    const range = controls.querySelector('input');
    back.textContent = backText;
    play.textContent = playText;
    next.textContent = nextText;
    range.setAttribute('aria-label', stepText);
    const count = controls.querySelector('.count');
    range.max = n;
    root.dataset.steps = n;
    let at = 1;
    let timer = null;
    const stop = () => { clearInterval(timer); timer = null; play.textContent = playText; };
    const show = (k) => {
      at = Math.min(Math.max(k, 1), n);
      steps.forEach((li, i) => li.classList.toggle('now', i === at - 1));
      root.querySelectorAll('[data-step]').forEach((el) => {
        el.classList.toggle('on', +el.dataset.step <= at);
        el.classList.toggle('now', +el.dataset.step === at);
      });
      const li = steps[at - 1];
      if (li.dataset.x) {
        root.style.setProperty('--x', `${li.dataset.x}px`);
        root.style.setProperty('--y', `${li.dataset.y}px`);
      }
      caption.textContent = `${at}. ${li.textContent.trim()}`;
      range.value = at;
      count.textContent = `${at} / ${n}`;
      back.disabled = at === 1;
      next.disabled = at === n;
      if (at === n) stop();
    };
    back.addEventListener('click', () => { stop(); show(at - 1); });
    next.addEventListener('click', () => { stop(); show(at + 1); });
    range.addEventListener('input', () => { stop(); show(+range.value); });
    play.addEventListener('click', () => {
      if (timer) { stop(); return; }
      if (at === n) show(1);
      play.textContent = pauseText;
      timer = setInterval(() => show(at + 1), dwell);
    });
    if (scroll) {
      const seen = new IntersectionObserver((entries) => entries.forEach((e) => {
        if (e.isIntersecting) show(steps.indexOf(e.target) + 1);
      }), { root: document, rootMargin: '-50% 0px -50% 0px' });
      steps.forEach((li) => seen.observe(li));
    }
    root.classList.add('live');
    show(1);
  });
</script>
<section aria-labelledby="{{id}}">
  <h2 id="{{id}}">{{use case, as a noun phrase}}</h2>
  <div data-widget="use-case" data-player data-labels="{{Back|Play|Pause|Next|Step}}">
    <figure class="scroll stage" tabindex="0" aria-labelledby="{{id}}-title">
      <svg width="520" height="208" viewBox="0 0 520 208" role="img" aria-labelledby="{{id}}-title" aria-describedby="{{id}}-desc">
        <title id="{{id}}-title">{{flow: use case}}</title>
        <desc id="{{id}}-desc">{{the flow in one sentence}}</desc>
        <defs>
          <marker id="{{id}}-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
            <path class="tip" d="M0,0 L10,5 L0,10 z"/>
          </marker>
        </defs>
        <rect class="box" x="8" y="8" width="128" height="40" rx="8"/>
        <text x="72" y="32" text-anchor="middle">{{participant A}}</text>
        <rect class="box" x="196" y="8" width="128" height="40" rx="8"/>
        <text x="260" y="32" text-anchor="middle">{{participant B}}</text>
        <rect class="box" x="384" y="8" width="128" height="40" rx="8"/>
        <text x="448" y="32" text-anchor="middle">{{participant C}}</text>
        <path class="lifeline" d="M72,48 V200 M260,48 V200 M448,48 V200"/>
        <g class="part" tabindex="0" data-step="1"><path class="edge" d="M72,88 H256" marker-end="url(#{{id}}-arrow)"/>
          <text class="label" x="80" y="80">1 {{call and its value}}</text></g>
        <g class="part" tabindex="0" data-step="2"><path class="edge" d="M260,136 H444" marker-end="url(#{{id}}-arrow)"/>
          <text class="label" x="268" y="128">2 {{call}}</text></g>
        <g class="part" tabindex="0" data-step="3"><path class="edge" d="M448,184 H76" marker-end="url(#{{id}}-arrow)"/>
          <text class="label" x="268" y="176">3 {{reply}}</text></g>
        <circle class="token" cx="0" cy="0" r="6"/>
      </svg>
      <figcaption class="muted">{{what was left out of this use case}}</figcaption>
    </figure>
    <ol class="steps">
      <li data-x="256" data-y="88">{{step 1: what moves, and why}}</li>
      <li data-x="444" data-y="136">{{step 2: what moves, and why}}</li>
      <li data-x="76" data-y="184">{{step 3: what comes back, and why}}</li>
    </ol>
  </div>
</section>
