<!-- controls: a figure the reader changes by hand to see how a result follows its inputs; one figure per copy.
  anatomy: a figure[data-widget="controls"] holding a figcaption (one sentence: what to change and what to watch), a
  .stage the author draws (an SVG with role="img" and a title, or an output alone for a number), then a .panel of
  controls and readouts.
  slider: a label holding the name, an input type="range" name="<n>" with min, max, step and value, and an empty
  output data-unit="<unit>" the script fills with the value.
  toggle: a div role="group" data-name="<n>" aria-label="<name>" of buttons with data-value; the first is pressed.
  stage: the script sets each control on the .stage as data-<n>="<value>" and, when a number, --<n>; the author's
  style draws with var(--<n>, <start>) in calc(), as r, cx, width, opacity or transform, and picks a toggle's look by
  .stage[data-<n>="<v>"]; a `controls` event on the figure carries { values, stage } for a script of the author's own.
  readout: an output data-calc="<arithmetic over the names, Math.* allowed>" data-digits="<decimals>" data-unit="<unit>"
  shows the result, in the stage for a number alone or in the panel.
  use when: the reader learns how a result depends on one to four inputs by moving them.
  not when: the reader only needs the values (a table), or the steps come in an order (slide). -->
<style>
  [data-widget="controls"] {
    --controls-gap: var(--sp-3);
    & .stage svg { display: block; width: 100%; height: auto; font: var(--fs-svg-label) var(--sans); }
    & .stage > output { display: block; font-size: var(--fs-h2); font-weight: 800; font-variant-numeric: tabular-nums; }
    & .panel { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--controls-gap); }
    &:not(.live) .panel { display: none; }
    & .panel label { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 var(--sp-2); font-size: var(--fs-m); }
    & .panel label input { grid-column: 1 / -1; order: 1; width: 100%; margin: 0; accent-color: var(--accent); }
    & .panel output { font-variant-numeric: tabular-nums; }
    & [role="group"] { display: flex; flex-wrap: wrap; gap: var(--sp-1); }
    & [role="group"] button + button { margin-inline-start: calc(-1 * var(--sp-1) - var(--line)); }
    & [aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  }
</style>
<script>
  (() => {
    const start = () => document.querySelectorAll('[data-widget="controls"]').forEach((root) => {
      const stage = root.querySelector('.stage');
      const sliders = [...root.querySelectorAll('input[type="range"][name]')];
      const toggles = [...root.querySelectorAll('[role="group"][data-name]')];
      const read = () => {
        const v = {};
        sliders.forEach((s) => { v[s.name] = +s.value; });
        toggles.forEach((g) => { v[g.dataset.name] = (g.querySelector('[aria-pressed="true"]') || g).dataset.value || ''; });
        return v;
      };
      const calc = (out, v) => {
        let r;
        try { r = new Function(...Object.keys(v), `return (${out.dataset.calc});`)(...Object.values(v)); } catch (e) { r = NaN; }
        const d = out.dataset.digits;
        const text = typeof r === 'number' ? r.toLocaleString('ko', d ? { minimumFractionDigits: +d, maximumFractionDigits: +d } : {}) : String(r);
        out.textContent = text + (out.dataset.unit || '');
      };
      const paint = (scope, v) => {
        Object.entries(v).forEach(([k, x]) => {
          scope.setAttribute(`data-${k}`, x);
          if (typeof x === 'number' || (x !== '' && !isNaN(x))) scope.style.setProperty(`--${k}`, x);
        });
        scope.querySelectorAll('output[data-calc]').forEach((o) => calc(o, v));
        root.dispatchEvent(new CustomEvent('controls', { detail: { values: v, stage: scope } }));
      };
      const update = () => {
        const v = read();
        sliders.forEach((s) => {
          const o = s.parentElement.querySelector('output');
          if (o) o.textContent = (+s.value).toLocaleString('ko') + (o.dataset.unit || '');
        });
        if (stage) paint(stage, v);
        root.querySelectorAll('output[data-calc]').forEach((o) => { if (!o.closest('.stage')) calc(o, v); });
      };
      const press = (g, b) => g.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
      toggles.forEach((g) => {
        const buttons = [...g.querySelectorAll('button')];
        buttons.forEach((b, i) => {
          b.setAttribute('aria-pressed', i === 0);
          b.addEventListener('click', () => { press(g, b); update(); });
        });
      });
      sliders.forEach((s) => s.addEventListener('input', update));
      root.classList.add('live');
      update();
    });
    if (document.readyState === 'loading') addEventListener('DOMContentLoaded', start); else start();
  })();
</script>
<figure data-widget="controls">
  <figcaption>{{what to change and what to watch, one sentence}}</figcaption>
  <div class="stage">{{an SVG drawn with the controls, or an output with data-calc}}</div>
  <div class="panel">
    <label>{{name}} <input type="range" name="{{n}}" min="{{min}}" max="{{max}}" step="{{step}}" value="{{start}}"><output data-unit="{{unit}}"></output></label>
    <div role="group" data-name="{{n}}" aria-label="{{name}}">
      <button type="button" data-value="{{value}}">{{value name}}</button>
    </div>
    <output data-calc="{{arithmetic over the names}}" data-digits="{{decimals}}" data-unit="{{unit}}"></output>
  </div>
</figure>
