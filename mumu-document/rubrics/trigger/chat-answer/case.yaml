schema_version: "1.1"
name: chat-answer
execution:
  prompt: |
    In a sentence or two, what is the difference between a mutex and a semaphore? Just answer here in chat.
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Skill, Read]
graders:
  - name: not-loaded
    type: tool_used
    tool: Skill
    input_match: writing-documents
    min: 0
    max: 0
    arm: with-only
