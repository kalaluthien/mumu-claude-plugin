schema_version: "1.1"
name: pr-body
execution:
  prompt: |
    Write the PR body for this change: `tq work` is renamed `tq run`, and `tq run --once` runs one job and exits. Answer here in chat.
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill, Read]
graders:
  - name: loaded
    type: tool_used
    tool: Skill
    input_match: writing-documents
    arm: both
