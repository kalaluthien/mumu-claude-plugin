schema_version: "1.0"
name: test
context:
  scaffold_script: setup.sh
execution:
  prompt: "Users report that `python todo.py add \"\"` creates an empty item. Fix it so a blank title is rejected with an error."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
graders:
  - name: fires
    type: tool_used
    tool: Skill
    input_match: "mumu-verification:test"
    min: 1
