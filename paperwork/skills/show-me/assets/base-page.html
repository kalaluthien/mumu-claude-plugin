<!-- base-page: the CSS and script every page shares; assemble-page.py builds the page around them and adds each placed
  playbook's own CSS and script after them. -->
<style>
:root { color-scheme: light; --text: #1b1a18; --muted: #67635c; --bg: #fcfbf7; --fill: #f4f2ec; --line: #d9d5cb;
  --ink: #6f6b63; --accent: #c96442; --accent-text: #a9502f; --ok: #1f7a3a; --warn: #855600; --fail: #b8302a;
  --sans: "Apple SD Gothic Neo", "Nanum Gothic", system-ui, sans-serif; --mono: ui-monospace, monospace; }
* { box-sizing: border-box; }
body { margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--text); font: 16px/1.65 var(--sans);
  overflow-wrap: anywhere; word-break: keep-all; }
main { max-width: 48rem; margin: 0 auto; }
main.wide { max-width: 72rem; }
h1 { font-size: 1.6rem; line-height: 1.3; margin: 0 0 .5rem; }
h2 { font-size: 1.2rem; margin: 2.5rem 0 .75rem; }
h3 { font-size: 1rem; margin: 1.25rem 0 .5rem; }
a { color: var(--accent-text); }
.answer { font-size: 1.15rem; font-weight: 700; margin: 0 0 1.5rem; }
.muted, figcaption, caption { color: var(--muted); font-size: .875rem; }
code, pre { font: .875rem/1.5 var(--mono); }
pre { background: var(--fill); padding: .75rem; overflow-x: auto; white-space: pre-wrap; margin: 0; }
.scroll { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
td.num, th.num { text-align: right; white-space: nowrap; }
figure { margin: 1.25rem 0; }
svg { max-width: 100%; height: auto; display: block; }
.numbers { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .75rem; margin: 1rem 0; }
.numbers > div { background: var(--fill); padding: .75rem; }
.numbers b { display: block; font-size: 1.5rem; line-height: 1.2; }
.reply textarea { width: 100%; min-height: 6rem; font: .875rem/1.5 var(--mono); }
button { font: inherit; padding: .4rem .9rem; border: 1px solid var(--ink); background: var(--bg); cursor: pointer; }
dl { display: grid; grid-template-columns: auto 1fr; gap: .25rem .75rem; margin: 0; } dt { font-weight: 700; } dd { margin: 0; }
.next { border-top: 2px solid var(--text); padding-top: .75rem; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .fail { color: var(--fail); }
</style>
<script>
for (const b of document.querySelectorAll('.reply button'))
  b.addEventListener('click', () => navigator.clipboard.writeText(b.closest('.reply').querySelector('textarea').value));
</script>
