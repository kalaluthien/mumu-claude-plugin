<!-- base-page: the shell every page playbook copies whole. Fill each {{...}} and keep the CSS whole. A chart is <svg data-chart="bar|line" data-unit="…" data-values="label:number,…">;
  a button with data-reply="text" writes that text into the .reply box. -->
<!doctype html>
<html lang="{{ko|en}}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root { color-scheme: light; --text: #1b1a18; --muted: #67635c; --bg: #fcfbf7; --fill: #f4f2ec; --line: #d9d5cb;
  --ink: #6f6b63; --accent: #c96442; --accent-text: #a9502f; --ok: #1f7a3a; --warn: #855600; --fail: #b8302a;
  --sans: "Apple SD Gothic Neo", "Nanum Gothic", system-ui, sans-serif; --mono: ui-monospace, monospace; }
* { box-sizing: border-box; }
body { margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--text); font: 16px/1.65 var(--sans);
  overflow-wrap: anywhere; word-break: keep-all; }
main { max-width: 48rem; margin: 0 auto; }
main.wide { max-width: 72rem; }
h1 { font-size: 1.6rem; line-height: 1.3; margin: 0 0 .5rem; }
h2 { font-size: 1.2rem; margin: 2.5rem 0 .75rem; }
h3 { font-size: 1rem; margin: 1.25rem 0 .5rem; }
a { color: var(--accent-text); }
.answer { font-size: 1.15rem; font-weight: 700; margin: 0 0 1.5rem; }
.muted, figcaption, caption { color: var(--muted); font-size: .875rem; }
code, pre { font: .875rem/1.5 var(--mono); }
pre { background: var(--fill); padding: .75rem; overflow-x: auto; white-space: pre-wrap; margin: 0; }
.scroll { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: break-word; }
td.num, th.num { text-align: right; white-space: nowrap; }
figure { margin: 1.25rem 0; }
svg { max-width: 100%; height: auto; display: block; }
.numbers { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .75rem; margin: 1rem 0; }
.numbers > div { background: var(--fill); padding: .75rem; }
.numbers b { display: block; font-size: 1.5rem; line-height: 1.2; }
.reply textarea { width: 100%; min-height: 6rem; font: .875rem/1.5 var(--mono); }
button { font: inherit; padding: .4rem .9rem; border: 1px solid var(--ink); background: var(--bg); cursor: pointer; }
dl { display: grid; grid-template-columns: auto 1fr; gap: .25rem .75rem; margin: 0; } dt { font-weight: 700; } dd { margin: 0; }
.next { border-top: 2px solid var(--text); padding-top: .75rem; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .fail { color: var(--fail); }
</style>
<main>
  <h1>{{title}}</h1>
  <p class="answer">{{the one sentence or number that answers the ask}}</p>
  <div class="numbers"><div><b>{{number and unit}}</b>{{what it counts; at most 3, none the rest shows}}</div></div>  <!-- deleted unless the Form names .numbers -->
  {{the playbook's main form}}
  <!-- deleted unless the Form names .reply --><section class="reply"><h2>{{reply, in the page's language}}</h2><textarea readonly>{{the text the reader pastes back}}</textarea><button>{{copy}}</button></section>
  <section class="next"><h2>{{next step, in the page's language}}</h2><p>{{the reader's next action or choice}}</p></section>
</main>
<script>
// Charts are drawn here from their data so their numbers stay the ones written on the page.
for (const svg of document.querySelectorAll('svg[data-chart]')) {
  const pts = svg.dataset.values.split(',').map(s => { const i = s.lastIndexOf(':'); return [s.slice(0, i).trim(), +s.slice(i + 1)]; });
  const W = Math.max(320, svg.parentElement.clientWidth), H = Math.min(280, Math.round(W * .6)), L = 48, B = 40, T = 16, max = Math.max(...pts.map(p => p[1])) || 1, unit = svg.dataset.unit || '';
  const x = i => L + (i + .5) * (W - L - 8) / pts.length, y = v => T + (1 - v / max) * (H - T - B);
  let out = `<line x1="${L}" y1="${H - B}" x2="${W}" y2="${H - B}" stroke="#6f6b63"/>`
    + `<text x="4" y="${T + 4}" font-size="13" fill="#67635c">${max}${unit}</text>`;
  const top = pts.findIndex(p => p[1] === max);
  pts.forEach(([k, v], i) => {
    if (svg.dataset.chart === 'bar') {
      const w = (W - L - 8) / pts.length * .7;
      out += `<rect x="${x(i) - w / 2}" y="${y(v)}" width="${w}" height="${H - B - y(v)}" fill="#c96442"/>`;
    }
    out += `<text x="${x(i)}" y="${y(v) - 6}" font-size="12" text-anchor="middle">${v}</text>`;
    out += `<text class="x" data-i="${i}" x="${x(i)}" y="${H - B + 18}" font-size="12" text-anchor="middle" fill="#67635c">${k}</text>`;
  });
  if (svg.dataset.chart === 'line')
    out += `<polyline fill="none" stroke="#c96442" stroke-width="3" points="${pts.map(([, v], i) => `${x(i)},${y(v)}`).join(' ')}"/>`
      + pts.map(([, v], i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#c96442"/>`).join('');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('role', 'img');
  svg.innerHTML = out;
  // axis labels: kept inside the drawing, then thinned so none overlaps another, the peak's kept first
  const xs = [...svg.querySelectorAll('text.x')], kept = [];
  for (const t of [xs[top], ...xs.filter((_, i) => i !== top)]) {
    const b = t.getBBox(), shift = Math.min(0, W - 2 - (b.x + b.width)) + Math.max(0, 2 - b.x);
    if (shift) t.setAttribute('x', +t.getAttribute('x') + shift);
    const l = b.x + shift, r = l + b.width;
    if (kept.some(([kl, kr]) => l < kr + 6 && r > kl - 6)) t.remove(); else kept.push([l, r]);
  }
}
for (const b of document.querySelectorAll('[data-reply]'))
  b.addEventListener('click', () => { document.querySelector('.reply textarea').value = b.dataset.reply; });
for (const b of document.querySelectorAll('.reply button'))
  b.addEventListener('click', () => navigator.clipboard.writeText(b.closest('.reply').querySelector('textarea').value));
</script>
