<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{doc_title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{font_css}}">
<script>document.documentElement.classList.add('js')</script>
<style>
:root{
  --bg:oklch(0.99 0.004 85);--panel:oklch(0.965 0.006 85);--ink:oklch(0.24 0.01 260);--muted:oklch(0.48 0.01 260);
  --line:oklch(0.88 0.008 260);--grid:oklch(0.80 0.006 260);--accent:oklch(0.50 0.13 255);
  --q:oklch(0.95 0.03 255);--ok:oklch(0.52 0.13 150);--okbg:oklch(0.95 0.04 150);--no:oklch(0.55 0.17 25);--nobg:oklch(0.95 0.035 25);
  --warn:oklch(0.95 0.035 75);--co:oklch(0.93 0.04 255);--okt:oklch(0.40 0.11 150);--not:oklch(0.45 0.17 25);
  --sans:{{font_sans}},system-ui,-apple-system,"Segoe UI",sans-serif;--serif:{{font_serif}},Georgia,serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:oklch(0.19 0.01 260);--panel:oklch(0.235 0.012 260);--ink:oklch(0.92 0.006 85);--muted:oklch(0.70 0.01 260);
  --line:oklch(0.34 0.01 260);--grid:oklch(0.42 0.01 260);--accent:oklch(0.74 0.11 255);
  --q:oklch(0.27 0.03 255);--ok:oklch(0.76 0.12 150);--okbg:oklch(0.28 0.04 150);--no:oklch(0.74 0.13 25);--nobg:oklch(0.29 0.04 25);
  --warn:oklch(0.28 0.035 75);--co:oklch(0.30 0.045 255);--okt:oklch(0.83 0.13 150);--not:oklch(0.81 0.12 25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:oklch(0.19 0.01 260);--panel:oklch(0.235 0.012 260);--ink:oklch(0.92 0.006 85);--muted:oklch(0.70 0.01 260);
  --line:oklch(0.34 0.01 260);--grid:oklch(0.42 0.01 260);--accent:oklch(0.74 0.11 255);
  --q:oklch(0.27 0.03 255);--ok:oklch(0.76 0.12 150);--okbg:oklch(0.28 0.04 150);--no:oklch(0.74 0.13 25);--nobg:oklch(0.29 0.04 25);
  --warn:oklch(0.28 0.035 75);--co:oklch(0.30 0.045 255);--okt:oklch(0.83 0.13 150);--not:oklch(0.81 0.12 25);color-scheme:dark}
</style>
<style data-d="tokens">{{tokens}}</style>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:56px}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.78 var(--sans);-webkit-text-size-adjust:100%;overflow-wrap:break-word}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
button{font:500 14px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:44px;min-width:44px;padding:0 14px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;background:color-mix(in oklch,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar b{font:600 15px/1.2 var(--serif);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .cur{font:400 13px var(--sans);color:var(--muted);margin-left:8px}.bar .cur:empty{display:none}.bar .theme{font-size:13px;white-space:nowrap}@media (max-width:520px){.bar .bt{display:none}.bar .cur{margin-left:0;font-size:13.5px;color:var(--ink)}}
.bar button{min-height:44px;min-width:44px;padding:0 10px}
.wrap{display:flex;justify-content:center;gap:40px;padding:0 16px}
main{width:100%;max-width:720px;min-width:0;padding-bottom:110px}
nav[data-d="nav"]{position:fixed;inset:48px auto 0 0;width:min(300px,86vw);overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:16px 12px 40px;transform:translateX(-102%);transition:transform .2s;z-index:15}
body.toc-open nav[data-d="nav"]{transform:none}
@media (min-width:1080px){nav[data-d="nav"]{position:sticky;top:48px;align-self:flex-start;height:calc(100vh - 48px);transform:none;flex:0 0 260px;background:none;border:0}.bar .toc{display:none}}
nav[data-d="nav"] ol{list-style:none;margin:0;padding:0}
nav[data-d="nav"] li>a,nav[data-d="nav"] li>span{display:grid;grid-template-columns:2.2em 1fr;align-content:center;gap:4px;min-height:44px;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.45}
nav[data-d="nav"] li>span{color:var(--muted)}
nav[data-d="nav"] li a.on{background:var(--q)}
nav[data-d="nav"] .n{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;padding-right:4px}
nav[data-d="nav"] .tp{margin:14px 8px 4px;font:600 12.5px var(--sans)}
nav[data-d="nav"] hr{border:0;border-top:1px solid var(--line);margin:12px 8px}
/* fisheye contents: the current unit opens its sections under its entry */
nav[data-d="nav"] .sub{display:none;margin:0 0 6px 2.2em;border-left:1px solid var(--line)}nav[data-d="nav"] li.cur>.sub{display:block}
nav[data-d="nav"] .sub a{display:flex;align-items:center;min-height:44px;padding:4px 10px;font-size:13.5px;line-height:1.35;color:var(--ink);text-decoration:none;border-radius:0 6px 6px 0}
nav[data-d="nav"] .sub a.on{background:var(--q)}nav[data-d="nav"] .sub a.lock{color:var(--muted)}nav[data-d="nav"] .sub a.lock::after{content:"🔒";margin-left:6px;font-size:11px}
/* search: terms, their aliases and avoided forms, unit titles and section headings */
.find{margin:0 0 12px}.find input{width:100%;min-height:44px;font:500 16px var(--sans);padding:0 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.find .hits{margin:6px 0 0}.find .hits:empty{display:none}.find .hits a{display:block;min-height:44px;padding:10px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.4}
.find .hits a:hover,.find .hits a:focus-visible{background:var(--q)}.find .hits small{display:block;color:var(--muted);font-size:12.5px}.find .none{padding:8px;color:var(--muted);font-size:14px}
header[data-d="hero"]{padding:44px 0 28px;border-bottom:1px solid var(--line)}
header[data-d="hero"] .kicker{color:var(--muted);font-size:14px;margin:0 0 6px}
header[data-d="hero"] h1{font:700 clamp(28px,7vw,40px)/1.2 var(--serif);margin:0 0 14px}
header[data-d="hero"] .lead{font-size:17.5px;margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{display:inline-flex;align-items:center;min-height:44px;border:1px solid var(--line);border-radius:999px;padding:0 14px;font-size:14px;text-decoration:none;color:var(--ink);background:var(--panel)}
section[data-u]{padding:40px 0 8px;border-bottom:1px solid var(--line)}
header[data-d="head"] .kicker{margin:0;font:600 13.5px var(--sans);color:var(--loc,var(--accent))}
header[data-d="head"] h2{font:700 clamp(23px,5.5vw,30px)/1.3 var(--serif);margin:2px 0 12px}
section h3{font:700 19px/1.4 var(--serif);margin:28px 0 8px}


[data-c]{margin:18px 0}
[data-c="gist"]{background:var(--panel);border-left:3px solid var(--loc,var(--accent));padding:10px 16px;border-radius:0 8px 8px 0}
[data-c="gist"] p{margin:4px 0;font-weight:500}
[data-c="defn"]{border:1px solid var(--line);border-radius:10px;padding:12px 16px}
[data-c="cond"]{border-bottom:1.5px dashed currentColor}
details{border-top:1px dashed var(--line);margin-top:10px;padding-top:6px}
details>summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:44px;padding:10px 0;line-height:24px}
figure{margin:22px 0}
figure svg{display:block;width:100%;height:auto;max-height:70vh;font:12px var(--sans)}
figure .pan{overflow-x:auto;cursor:grab;overscroll-behavior-x:contain}figure .pan.grab{cursor:grabbing;user-select:none}figure .pan svg{max-height:none}.panhint{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
[data-node]{cursor:pointer;outline:none}figure.sel [data-node]:not(.on):not(.near),figure.sel [data-edge]:not(.on){opacity:.25}[data-node].on>:not(text),[data-node]:focus-visible>:not(text){stroke:var(--ink);stroke-width:2}[data-edge].on .line{stroke-width:3.5}
.nodenote{margin:8px 0 0;padding:8px 12px;border-left:3px solid var(--accent);background:var(--panel);font-size:14.5px;border-radius:0}
figcaption{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.6}
[data-c="frames"] ol{list-style:none;counter-reset:fr;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:0;margin:0}
[data-c="frames"] li{counter-increment:fr;position:relative;border:1px solid var(--line);border-radius:8px;padding:22px 8px 8px}
[data-c="frames"] li::before{content:counter(fr);position:absolute;top:4px;left:8px;font:600 12px var(--sans);color:var(--muted)}
[data-c="read"]{font-size:15px;margin:10px 0 0}
[data-c="drv"]{padding-left:22px}
[data-c="so"]{font-weight:600;border-left:3px solid var(--accent);padding-left:12px}
[data-c="ex"]{border:1px solid var(--line);border-radius:10px;padding:10px 16px 12px}
[data-c="ex"] ol{padding-left:20px;margin:6px 0}
[data-c="why"]{display:block;color:var(--muted);font-size:14.5px}
[data-c="res"]{font-weight:600;margin:8px 0 0}
[data-c="eqp"]{background:var(--panel);border-radius:10px;padding:6px 14px}
[data-c="step"]{border-left:3px solid var(--loc,var(--accent));padding:4px 14px;font-size:15.5px}
[data-c="warn"]{background:var(--warn);border-radius:10px;padding:10px 16px}
[data-c="note"]{font-size:15px;border-top:1px solid var(--line);padding-top:8px}[data-c="note"] .np{font:600 12.5px var(--sans);color:var(--muted);letter-spacing:.02em;margin-right:6px}
[data-c="badge"]{display:inline-block;font:600 11.5px var(--sans);border:1px solid currentColor;border-radius:999px;padding:0 7px;margin:0 4px;color:var(--muted);vertical-align:2px}
/* cards: probe, ask, task; every card gates the rest of its unit until solved */
.js .gated{display:none!important}
[data-c="probe"],[data-c="ask"],[data-c="task"]{background:var(--q);border-radius:12px;padding:12px 16px}
.qn{font-variant-numeric:tabular-nums;margin-right:2px}
[data-p="q"]{margin:0 0 8px;font-weight:500}
[data-p="opts"],[data-p="items"]{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px}
[data-p="opts"]>li,[data-p="items"]>li{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px}
.js [data-p="opts"]>li{cursor:pointer}
.js .solved [data-p="opts"]>li,.js [data-p="opts"]>li.no{cursor:default}
[data-p="opts"]>li.no{border-color:var(--no);background:var(--nobg)}
[data-p="opts"]>li.yes{border-color:var(--ok);background:var(--okbg)}
[data-p="why"]{font-size:14.5px;margin:8px 0 0;padding-top:6px;border-top:1px dashed var(--line)}
.js [data-p="why"],.js [data-p="lo"],.js [data-p="hi"]{display:none}
.js li.no>[data-p="why"],.js .solved [data-p="opts"]>li>[data-p="why"],.js .solved>[data-p="why"],.js [data-p].show{display:block}
[data-p="opts"]>li>[data-p="why"]{color:var(--not)}[data-p="opts"]>li[data-ok]>[data-p="why"]{color:var(--okt)}
.solved [data-p="opts"]>li:not([data-ok])>.ot{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}
.qhint{font-size:13.5px;color:var(--muted);margin:6px 0 0}.qhint.no{color:var(--no)}.qhint.ok{color:var(--ok);font-weight:600}
[data-p="items"]>li{display:flex;align-items:center;gap:8px}
[data-p="items"]>li>.t{flex:1;min-width:0}
[data-p="items"] button{min-height:44px;min-width:44px;padding:0 8px}
.js [data-c="task"][data-kind="select"] [data-p="items"]>li{cursor:pointer}
[data-kind="select"] [data-p="items"]>li.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
[data-p="items"]>li.no{border-color:var(--no);background:var(--nobg)}
.solved [data-p="items"]>li{border-color:var(--ok)}
[data-p="input"]{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
[data-p="input"] input{font:500 16px var(--sans);width:9em;min-height:44px;padding:0 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.qbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
[data-c="ex"] [data-c="ask"]{background:var(--panel)}
.blab{margin:0 0 4px;font:600 12.5px var(--sans);color:var(--muted);letter-spacing:.02em}
[data-c="worked"]{border-left:3px solid var(--line);padding-left:12px}
.lockbar{margin:14px 0 60vh;padding:10px 14px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14.5px;text-align:center}
[data-kind="select"] [data-p="items"]>li::before{content:"";flex:none;width:18px;height:18px;border:1.5px solid var(--line);border-radius:4px}
[data-kind="select"] [data-p="items"]>li.on::before{background:var(--accent);border-color:var(--accent)}
[data-kind="order"] [data-p="items"]{counter-reset:rk}[data-kind="order"] [data-p="items"]>li{counter-increment:rk}
[data-kind="order"] [data-p="items"]>li::before{content:counter(rk);flex:none;min-width:1.4em;font:600 13px var(--sans);color:var(--muted)}
/* drag: a grip is the signifier; the item follows the finger, neighbours make room; arrow keys and tap are the fallbacks */
.grip{flex:none;display:grid;place-items:center;width:44px;min-height:44px;margin:-8px 0 -8px -8px;border-radius:6px;color:var(--muted);cursor:grab;touch-action:none;user-select:none;font:700 15px/1 var(--sans);letter-spacing:-2px}
.grip:hover,.grip:focus-visible{background:var(--q);color:var(--ink);outline:none}
.drag{position:relative;z-index:5;box-shadow:0 8px 22px oklch(0 0 0/.18);cursor:grabbing;transition:none!important}
.drag .grip{cursor:grabbing}
.settle{transition:transform .18s cubic-bezier(.2,0,0,1)}
[data-kind="order"] [data-p="items"]>li,[data-kind="sort"] [data-p="items"]>li{user-select:none;-webkit-user-select:none}
[data-kind="sort"] [data-p="items"]>li{cursor:pointer;background:var(--bg)}
[data-kind="sort"] [data-p="items"]>li.picked{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;margin:10px 0 4px}
.bin{border:1.5px dashed var(--line);border-radius:10px;padding:6px;min-height:84px;background:color-mix(in oklch,var(--bg) 55%,transparent);transition:border-color .12s,background .12s}
.bin>b{display:block;font:600 13px var(--sans);padding:2px 4px 6px;color:var(--ink)}
.bin [data-p="items"]{margin:0;min-height:40px}
.bin.over,.bin.ready{border-color:var(--accent);background:var(--q)}
.bin.ready{cursor:pointer}
.pool-l{font-size:13px;color:var(--muted);margin:6px 0 0}
/* terms box: a model's named parts, each with its exact definition */
[data-c="terms"]{border:1px solid var(--line);border-radius:10px;padding:10px 14px 12px;background:var(--panel)}
[data-c="terms"]>[data-p="t"]{font:600 13px var(--sans);color:var(--muted);margin:0 0 8px;letter-spacing:.02em}
[data-c="terms"] dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;margin:0;align-items:baseline}
[data-c="terms"] dt{font:700 14px var(--mono);min-width:2.4em;padding:2px 8px;border-radius:6px;background:var(--q);color:var(--accent);text-align:center;white-space:nowrap}
[data-c="terms"] dd{margin:0;font-size:15px;line-height:1.65}
[data-c="terms"] dd>b:first-child{margin-right:4px}
/* exhibit: a static picture of a card's case (a screen, chart, record); it is looked at, never operated, so taps pass through to the option */
[data-c="exhibit"]{margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);pointer-events:none;user-select:none;overflow:hidden;font-size:13.5px;line-height:1.45}
[data-c="exhibit"] svg{display:block;width:100%;height:auto}
.ot [data-c="exhibit"]{display:inline-block;width:100%;vertical-align:top}
.solved [data-p="opts"]>li:not([data-ok])>.ot [data-c="exhibit"]{opacity:.55}
.bin [data-p="items"]>li{padding:6px 8px;font-size:14px;line-height:1.5;gap:4px}.bin .grip{margin:-4px 0 -4px -6px}
@media (max-width:480px){.bins{grid-template-columns:1fr}}
figure svg{max-width:min(100%,var(--fw,720px))}
main{padding-bottom:140px}
[data-c="close"]{border:2px solid var(--loc,var(--accent));border-radius:12px;padding:12px 16px}
[data-c="close"]>p{margin:6px 0}
[data-d="review"]{border-top:1px dashed var(--line);margin-top:12px;padding-top:4px;display:grid;gap:12px}
[data-d="review"] [data-c]{background:var(--panel)}
[data-c="key"]{font-weight:700;font-size:1.04em;margin:18px 0 6px}
details[data-c="aside"],details[data-c="note"]{border:1px solid var(--line);border-radius:10px;padding:4px 14px;margin:16px 0}
details[data-c="aside"]>summary,details[data-c="note"]>summary{color:var(--ink);font-size:15px;font-weight:500;padding:10px 0}
details[data-c="aside"][open]>summary,details[data-c="note"][open]>summary{border-bottom:1px dashed var(--line);margin-bottom:6px}
details[data-c="note"]{font-size:15px}
.tag{display:inline-block;font:600 12px var(--sans);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:1px}
.tag::before{content:"["}.tag::after{content:"]"}
/* frames: one object redrawn step by step; plays as a loop with controls */
/* all frames share one grid cell, so the player keeps the tallest frame's height and the page below never jumps */
.js [data-c="frames"].play ol{display:grid;grid-template-columns:minmax(0,1fr)}
.js [data-c="frames"].play li{grid-area:1/1;visibility:hidden;border:0;padding:0}
.js [data-c="frames"].play li.cur{visibility:visible}
.js [data-c="frames"].play li::before{display:none}
[data-c="frames"] li>p{margin:6px 0 0;font-size:14.5px}
.player{display:flex;gap:8px;align-items:center;margin-top:8px}
.player .cnt{font:500 13px var(--sans);color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.5em}
/* all frames: the steps side by side for comparison (a grid from 720px, one column below) */
.player .allb{margin-left:auto}.player .allb[aria-pressed="true"]{background:var(--q);border-color:var(--accent)}[data-c="frames"].all .player>:not(.allb){display:none}
[data-c="frames"].all ol{grid-template-columns:minmax(0,1fr)}@media (min-width:720px){[data-c="frames"].all ol{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
[data-d="legend"] ul{list-style:none;padding:0;display:grid;gap:6px}
[data-d="legend"] li{display:flex;gap:10px;align-items:center;font-size:15px}
[data-d="legend"] svg{width:34px;height:18px;flex:none}
table{border-collapse:collapse;width:100%;font-size:15px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
[data-d="glossary"] dt{font-weight:700;margin-top:10px}
[data-d="glossary"] dd{margin:0 0 4px}[data-d="glossary"] dt:target,[data-d="glossary"] dt:target+dd{background:var(--q)}[data-d="glossary"] .see{color:var(--muted)}[data-d="glossary"] .gu{display:block;font-size:14px;color:var(--muted)}
[data-d="pn"]{display:flex;justify-content:space-between;gap:12px;margin:28px 0 12px;font-size:14px}[data-d="pn"] a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px}
[data-m="display"]{overflow-x:auto;overflow-y:hidden;padding:2px 0}
.katex{font-size:1.06em}.katex math{font-family:"Latin Modern Math","STIX Two Math","Cambria Math",math,serif}.katex-display{display:block;margin:0;text-align:center}.katex-error{color:var(--no)}
svg text{fill:var(--ink)}.muted{fill:var(--muted)}.grid{stroke:var(--grid);fill:none}
.fill{fill:var(--c,var(--ink));stroke:none}.line{stroke:var(--c,var(--ink));stroke-width:2;fill:none}.dash{stroke-dasharray:5 4}
span[class*="lx-"],b[class*="lx-"]{color:var(--c);font-weight:600}
.float{position:fixed;bottom:14px;z-index:25;display:flex;gap:8px}
.float.l{left:12px}.float.r{right:12px}
