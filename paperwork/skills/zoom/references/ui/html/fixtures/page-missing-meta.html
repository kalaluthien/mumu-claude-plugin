<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Poor+Story&display=swap">
<style>
:root{color-scheme:light}
body{margin:0;background:#f3f4f6;padding:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}:root:not([data-theme="light"]) body{background:#0f1115}}
:root[data-theme="dark"]{color-scheme:dark}:root[data-theme="dark"] body{background:#0f1115}
.zd{

  container-type:inline-size; container-name:zd; position:relative;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .zd{--zd-fail:#f97066;--zd-paper:#1a1d23;--zd-board:#131519;--zd-sunk:#20242b;--zd-hi:#eef1f5;--zd-mid:#aab2be;--zd-lo:#868f9c;--zd-line:#3a414c;--zd-faint:#272b33;color-scheme:dark}}
:root[data-theme="dark"] .zd{--zd-fail:#f97066;--zd-paper:#1a1d23;--zd-board:#131519;--zd-sunk:#20242b;--zd-hi:#eef1f5;--zd-mid:#aab2be;--zd-lo:#868f9c;--zd-line:#3a414c;--zd-faint:#272b33;color-scheme:dark}
.zd *{box-sizing:border-box}

.zd :focus-visible:not(.node):not(.edge){outline:1px solid var(--zd-mid);outline-offset:3px;border-radius:6px}
.zd code{font-family:var(--zd-mono);background:none;padding:0;border-radius:0;font-size:inherit}
.zd svg text{font-family:var(--zd-hand)}
.zd .n-fill{fill:var(--zd-paper);stroke:none}

.zd .dim{opacity:.2}
.zd .node.done .n-ink{stroke-width:2.4}

.zd .n-step.reached rect{fill:var(--zd-hi)}.zd .n-step.reached text{fill:var(--zd-paper)}
.zd .node.lit .n-step rect{stroke:var(--zd-paper)}
.zd .n-qty rect{fill:var(--zd-paper);stroke:var(--zd-mid);stroke-width:1;stroke-dasharray:2 2}
.zd .n-qty text,.zd .e-qty{font-family:var(--zd-mono);font-size:13px;fill:var(--zd-mid)}
.zd svg.phone .n-qty text,.zd svg.phone .e-qty{font-size:15px}
.zd svg.phone .e-qty{font-family:inherit}
.zd .e-line{fill:none;stroke:var(--zd-hi);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.zd .e-head{fill:none;stroke:var(--zd-hi);stroke-width:1.4;stroke-linecap:round}
.zd .e-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.zd .edge:hover .e-line,.zd .edge.done .e-line{stroke-width:2.2}
.zd .edge.hl .e-line,.zd .edge.hl .e-head{stroke-width:3.2}
.zd .node.hl .n-ink{stroke-width:3.2}

.zd .edge.lit .e-line,.zd .edge.lit .e-head{stroke-width:2.6}
.zd .edge.lit .e-plate{fill:var(--zd-hi)}.zd .edge.lit .e-lab{fill:var(--zd-paper)}
.zd .e-plate{fill:var(--zd-board)}
.zd .e-lab{fill:var(--zd-hi);font-size:15px}
.zd .init{fill:var(--zd-hi)}
.zd-mock{background:var(--zd-sunk);border:1px solid var(--zd-faint);border-radius:8px;overflow:hidden;font-family:var(--zd-sans)}
.zd-mock .bar{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--zd-faint);background:var(--zd-paper);font-size:11.5px;color:var(--zd-mid)}
.zd-mock .dots{display:inline-flex;gap:4px}.zd-mock .dots i{width:7px;height:7px;border-radius:50%;background:var(--zd-faint)}
.zd-mock .bar span:last-child{margin-left:auto;font-family:var(--zd-mono);color:var(--zd-lo)}
.zd-mock .fg{display:grid;grid-template-columns:72px minmax(0,1fr)}
.zd-mock .layers{list-style:none;margin:0;padding:6px 0;background:var(--zd-paper);border-right:1px solid var(--zd-faint);font-size:10.5px;color:var(--zd-mid)}

.zd-mock .layers li.on{background:var(--zd-hi);color:var(--zd-paper)}.zd-mock .layers li.on i{border-color:var(--zd-paper)}
.zd-mock .board{position:relative;max-height:250px;overflow:auto;padding:12px 8px 26px;display:flex;justify-content:center;background-image:radial-gradient(var(--zd-faint) 1px,transparent 1.2px);background-size:10px 10px;min-width:0}

.zd-mock .m{position:relative;border-bottom:1px solid var(--zd-faint);padding:6px 3px}
.zd-mock .m:last-child{border-bottom:0}
.zd-mock .mn{font-size:10.5px;font-weight:600;color:var(--zd-hi)}
.zd-mock .mp{font-size:9px;color:var(--zd-mid);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.zd-mock .mr{display:flex;justify-content:flex-start;font-size:9.5px;color:var(--zd-mid);padding:1px 0}
.zd-mock .tiny{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;background-image:radial-gradient(var(--zd-faint) 1px,transparent 1.2px);background-size:8px 8px;padding:4px 0}
.zd-mock .tiny span{font-size:9px;text-align:center;border:1px solid var(--zd-mid);border-radius:4px;padding:2px 0;background:var(--zd-paper);color:var(--zd-hi);white-space:nowrap;overflow:hidden}
.zd-mock .tiny span.k{background:var(--zd-hi);border-color:var(--zd-hi);color:var(--zd-paper)}
.zd-mock .sel{outline:1.5px solid var(--zd-hi);outline-offset:1px;z-index:1}
.zd-mock .h{position:absolute;width:6px;height:6px;background:var(--zd-paper);border:1.5px solid var(--zd-hi)}
.zd-mock .tag{position:absolute;left:50%;transform:translateX(-50%);bottom:-17px;background:var(--zd-hi);color:var(--zd-paper);font-family:var(--zd-mono);font-size:9px;padding:1px 5px;border-radius:3px;white-space:nowrap;z-index:2}
@media (prefers-reduced-motion:reduce){.zd *{transition:none!important;animation:none!important}}
.zd .node,.zd .edge{-webkit-tap-highlight-color:transparent;outline:none}
.zd .node:focus,.zd .edge:focus,.zd .node:focus-visible,.zd .edge:focus-visible{outline:none}
.zd .node:focus-visible:not(.lit) .n-ink{stroke-width:2.4}
.zd .edge:focus-visible .e-line{stroke:var(--zd-hi)}
.zd-mock .mtabs{display:flex;gap:8px;font-size:9px;color:var(--zd-lo);border-bottom:1px solid var(--zd-faint);padding-bottom:3px;white-space:nowrap;overflow:hidden}
.zd-mock .mtabs .on{color:var(--zd-hi);font-weight:600;box-shadow:0 4px 0 -2.5px var(--zd-hi)}
.zd-mock .mbtn{display:inline-block;margin-top:4px;font-size:9.5px;font-weight:600;background:var(--zd-hi);color:var(--zd-paper);border-radius:5px;padding:3px 8px}
.zd-mock .rad{display:inline-block;width:7px;height:7px;border:1px solid var(--zd-mid);border-radius:50%;margin-right:5px;vertical-align:-1px}
.zd-mock .rad.on{background:var(--zd-hi);border-color:var(--zd-hi)}
.zd-mock .mcode{font-family:var(--zd-mono);font-size:9px;line-height:1.5;color:var(--zd-mid)}
.zd-mock .mcode .add{background:var(--zd-sunk);color:var(--zd-hi)}
.zd-mock .mcode .del{color:var(--zd-lo);text-decoration:line-through}
.zd{--zd-ink-r:14px 20px 15px 18px / 18px 14px 20px 15px}
.zd .zd-type,.zd .zd-grp h5,.zd-sect,.zd-media h5 b{font-family:var(--zd-sans);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--zd-lo)}
.zd-main{display:grid;grid-template-columns:minmax(0,1fr)}
.zd-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 0 16px}
.zd-crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;min-width:0}
.zd .zd-up,.zd .zd-lv{font-family:var(--zd-hand);font-size:19px;line-height:1.2;padding:2px;text-align:left;min-width:0}
.zd .zd-up{color:var(--zd-mid)}
.zd .zd-lv{display:inline-flex;align-items:center;gap:6px;color:var(--zd-hi)}
.zd .zd-lv i{font-style:normal;font-size:11px;color:var(--zd-mid)}
.zd .zd-up:hover,.zd .zd-lv:hover,.zd .zd-is:hover{text-decoration:underline wavy var(--zd-line);text-underline-offset:5px}
.zd-sep{font-family:var(--zd-hand);font-size:18px;color:var(--zd-line)}
.zd .zd-fs,.zd .zd-x{flex:none;width:30px;height:30px;border-radius:999px;color:var(--zd-mid);font-size:14px;line-height:30px;text-align:center}
.zd .zd-fs:hover,.zd .zd-x:hover{background:var(--zd-sunk);color:var(--zd-hi)}
.zd .zd-x{display:none}
.zd.narrow .zd-x{display:block;float:right;margin:-6px -8px 0 8px}
.zd:focus{outline:none}
.zd-board{background:var(--zd-board);min-width:0;display:flex;flex-direction:column}
.zd-why{margin:0;padding:2px 18px 0;font-size:12.5px;color:var(--zd-mid);line-height:1.6;max-width:72ch}
.zd-legend{display:flex;flex-wrap:wrap;gap:2px 14px;margin:0;padding:4px 18px 0}
.zd-legend:empty{display:none}
.zd-mk{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--zd-lo);white-space:nowrap}
.zd .lg{fill:none;stroke:var(--zd-hi);stroke-width:1.4;stroke-linecap:round}
.zd .lg-happy{stroke-width:2.6}.zd .lg-optional{stroke-dasharray:4 3}.zd .lg-failure{stroke:var(--zd-fail);stroke-dasharray:6 2 1.5 2}
.zd .lg-q{font-family:var(--zd-hand);font-size:11px;fill:var(--zd-hi)}
.zd-stage{display:block;padding:4px 12px;min-width:0;flex:1}
.zd-stage.side{display:grid;grid-template-columns:var(--cw,minmax(0,1fr)) 320px;justify-content:center;gap:18px;align-items:start}

.zd-stage.side .zd-note.is-sel .zd-body{max-height:calc(100vh - 80px);overflow:auto;overscroll-behavior:contain;margin-right:-8px;padding-right:8px}
.zd-canvas{overflow-x:auto;min-width:0;padding:6px 0 10px;touch-action:pan-x pan-y;border-radius:10px}
.zd-canvas svg{display:block;width:100%;height:auto;margin:0 auto;overflow:visible}
.zd-canvas.more-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}
.zd-canvas.more-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 44px);mask-image:linear-gradient(90deg,transparent,#000 44px)}
.zd-canvas.more-l.more-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent)}
.zd.nav-open .zd-nav,.zd-note.is-sel{background:var(--zd-paper);border:1.5px solid var(--zd-hi);border-radius:var(--zd-ink-r);box-shadow:4px 5px 0 var(--zd-faint)}
.zd .zd-nav{display:none;min-width:0}
.zd.nav-open .zd-nav{display:block;padding:14px 16px 16px}
.zd.narrow.nav-open .zd-nav{position:fixed;left:50%;transform:translateX(-50%);width:min(560px,100%);bottom:0;max-height:75vh;overflow:auto;z-index:61;padding:18px 16px 22px}
.zd.nav-open:not(.narrow) .zd-nav{margin:8px 12px 14px}
.zd.nav-open:not(.narrow) .zd-why,.zd.nav-open:not(.narrow) .zd-legend,.zd.nav-open:not(.narrow) .zd-time,.zd.nav-open:not(.narrow) .zd-stage{display:none}
.zd.narrow .zd-note.is-sel,.zd.narrow.nav-open .zd-nav{border-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;box-shadow:0 -10px 30px rgba(10,12,16,.22)}
.zd-scrim{position:fixed;inset:0;background:rgba(10,12,16,.38);z-index:60}
.zd-sect{margin:6px 6px}
.zd-levels,.zd-scen{list-style:none;margin:0;padding:0}
.zd-navgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 18px;align-items:start}
.zd.narrow .zd-navgrid{grid-template-columns:minmax(0,1fr)}
.zd-ns{min-width:0;border-left:1px dashed var(--zd-line);padding-left:16px}
.zd.narrow .zd-ns{border-left:0;padding-left:0;border-top:1px dashed var(--zd-line);margin-top:8px;padding-top:6px}
.zd .zd-sect span{margin-left:8px;font-family:var(--zd-mono);letter-spacing:0}
.zd-scen{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;padding:2px 2px 8px}
.zd-scen li{flex:0 0 min(230px,82%);scroll-snap-align:start;display:flex}
.zd-scen button{display:flex;flex-direction:column;justify-content:flex-start;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--zd-line);border-radius:var(--zd-ink-r)}
.zd-scen button[aria-pressed="true"]{background:var(--zd-board);border-color:var(--zd-hi)}
.zd-scen span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;color:var(--zd-lo);line-height:1.45;margin-top:3px}
.zd .zd-levels button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:4px 6px 4px calc(6px + var(--d,0) * 16px);font-family:var(--zd-hand);font-size:18px;line-height:1.25;color:var(--zd-mid)}
.zd .zd-levels button[aria-current="true"]{color:var(--zd-hi);text-decoration:underline wavy var(--zd-line);text-underline-offset:5px}
.zd-scen button:hover{background:var(--zd-board)}
.zd-scen code{display:block;font-size:12px;color:var(--zd-hi);font-weight:600}
.zd-note{position:relative;min-width:0;font-size:13px;color:var(--zd-mid);margin:8px 0 6px}
.zd-note[hidden]{display:none}
.zd-note.is-sel{padding:14px 16px 12px}

.zd.narrow .zd-note.is-sel{position:fixed;left:0;right:0;bottom:0;margin:0;max-height:62vh;overflow:auto;z-index:55;padding:16px 18px 22px}

.zd-nh{margin:0 0 8px}

.zd-pc{display:inline-block;font-family:var(--zd-hand);font-size:15px;line-height:1.2;color:var(--zd-mid);border:1.3px dotted var(--zd-mid);border-radius:var(--zd-ink-r);padding:0 7px;margin:0 2px;vertical-align:1px}

.zd .zd-is{font-family:var(--zd-hand);font-size:16px;line-height:1.2;color:var(--zd-hi);text-decoration:underline wavy var(--zd-line);text-underline-offset:4px}
.zd-note .what{margin:0 0 8px;color:var(--zd-mid);font-size:13.5px;line-height:1.6}

.zd-calls{margin:4px 0 0;font-size:12px;color:var(--zd-mid)}

.zd-time[hidden]{display:none}
.zd-time code{font-size:12px;font-weight:600;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zd .zd-time button{flex:none;width:28px;height:28px;border-radius:999px;font-size:16px;line-height:28px;text-align:center;color:var(--zd-mid)}
.zd .zd-time button:hover{background:var(--zd-sunk);color:var(--zd-hi)}
.zd-time output{font-family:var(--zd-mono);font-size:12px;color:var(--zd-mid);min-width:44px;text-align:right}

.zd-rail input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}

.zd-rail:focus-within{outline:1px solid var(--zd-mid);outline-offset:2px;border-radius:6px}
.zd-grp{margin-top:14px}

</style></head><body>
<div id="zd" style="max-width:1180px;margin:0 auto"></div>
<p id="zd-next" style="max-width:1180px;margin:16px auto 0;font:600 16px/1.5 'IBM Plex Sans KR',system-ui,sans-serif">The reader&#x27;s next action or choice, in one sentence.</p>
<script>
function mountZoomDiagram(root, M, LIMITS) {   // LIMITS: assets/phone-limits.json, which the checks read too
  const NS = "http://www.w3.org/2000/svg";
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const KIND = {
    topology: { name: "topology", node: "component", edge: "relation", r: 4 },
    workflow: { name: "workflow", node: "activity", edge: "artifact", r: 11 },
    state: { name: "state machine", node: "state", edge: "event", r: 22 }
  };
  const levels = Object.fromEntries(M.levels.map(L => [L.id, L]));
  const nodeLevel = {}, nodes = {};
  M.levels.forEach(L => L.nodes.forEach(n => { nodes[n.id] = n; nodeLevel[n.id] = L.id; }));
  const childOf = Object.fromEntries(M.levels.filter(L => L.parent).map(L => [L.parent, L.id]));
  const ops = Object.fromEntries(M.operations.map(o => [o.slug, o]));
  const rules = Object.fromEntries(M.rules.map(i => [i.slug, i]));
  const show = Object.assign({ formulas: true, replay: true, media: true }, (M.plan || {}).show);   // what the plan lets the page show
  const edgeKey = (lid, e) => lid + ":" + e.from + ">" + e.to + (levels[lid].edges.filter(x => x.from === e.from && x.to === e.to).length > 1 ? "#" + e.label : "");  // two edges one way: tell them apart
  const trigKey = (lid, t) => lid + ":@>" + t.to + "#" + t.label;   // a trigger comes from outside the level
  const qtyText = q => ({ count: `n=${q.value}`, capacity: `≤ ${q.value}`, delay: `within ${q.value}` }[q.kind] || String(q.value)) + (q.unit ? ` ${q.unit}` : "");
  const levelOf = x => nodeLevel[x] || String(x).split(":")[0];   // a node id, or an edge or trigger key

  /* A run is { key, kind, name, uses, length, items, calls }. Each item is a node or an edge key with the moments it
     lasts, { x, from, to, step }: a node lasts the moment of its step; an edge from the moment after its source to
     the moment it arrives, so a branch that skips ahead stays in flight until its join; `step` is the Scenario step
     it belongs to ({ at, does, expects }). A new kind of run needs only its own builder in RUNS. */
  // a Scenario's run is its walk, resolved once by the build: items { x, from, to, step } and the step sentences
  function scenarioRun(s) {
    const w = s.run || { items: [], steps: [], uses: [] };
    const items = w.items.map(it => Object.assign({}, it, { step: w.steps[it.step] }));
    return { kind: "scenario", name: s.slug, uses: new Set(w.uses), length: Math.max(0, ...items.map(it => it.to)) + 1, items };
  }
  // where each call of a run is drawn: an operation where it sits, an event, artifact or trigger by its label
  const drawnAt = {};
  const put = (c, x) => (drawnAt[c] = drawnAt[c] || []).push(x);
  M.levels.forEach(L => {
    L.nodes.forEach(n => (n.ops || []).forEach(o => put(o, n.id)));
    L.edges.forEach(e => (e.ops || []).concat(L.kind !== "topology" && e.label ? [e.label] : []).forEach(o => put(o, edgeKey(L.id, e))));
    (L.triggers || []).forEach(t => (t.ops || []).concat([t.label]).forEach(o => put(o, trigKey(L.id, t))));
  });
  function ruleRun(i) {
    const calls = i.breaks || [];
    const items = calls.flatMap((cs, k) => [...new Set(cs.flatMap(c => drawnAt[c] || []))].map(x => ({ x, from: k, to: k })));
    return { kind: "rule", name: i.slug, uses: new Set([i.slug].concat(calls.flat())), length: calls.length, items, calls };
  }
  const RUNS = { scenario: slug => scenarioRun(M.scenarios.find(s => s.slug === slug)), rule: slug => ruleRun(rules[slug]) }, runCache = {};
  const runOf = key => runCache[key] || (runCache[key] = Object.assign(RUNS[key.split(":")[0]](key.slice(key.indexOf(":") + 1)), { key }));
  const active = (r, k) => r.items.filter(it => it.from <= k && k <= it.to);
  // where a moment is drawn: the levels of the nodes reached in it, else of anything active in it
  const momentLevels = (r, k) => { const act = active(r, k), ns = act.filter(it => nodes[it.x] && it.from === k);
    return [...new Set((ns.length ? ns : act).map(it => levelOf(it.x)))]; };
  // what is picked by default: the first node reached in the moment, else the first thing active
  const firstPick = (r, k) => { const act = active(r, k); return ((act.find(it => nodes[it.x] && it.from === k) || act[0]) || {}).x || null; };
  // side by side at a moment: the steps that reach a node of a workflow or state level in it, and the edges still in flight
  const branches = (r, k) => new Set(r.items.filter(it => nodes[it.x] ? it.from === k && levels[nodeLevel[it.x]].kind !== "topology" : it.from <= k && k < it.to).map(it => nodes[it.x] ? it.step || it.x : it.x)).size;
  // what the drawing shows: the pick (selected), the rest of the moment (highlighted), what came before, what is to come
  function runView() {
    const r = st.sel && st.sel.run && runOf(st.sel.run); if (!r) return null;
    const at = st.sel.at, v = { state: {}, steps: {} }, rank = { later: 0, done: 1, now: 2 };
    r.items.forEach(it => {
      const s = it.from <= at && at <= it.to ? "now" : it.to < at ? "done" : "later";
      if (!v.state[it.x] || rank[s] > rank[v.state[it.x]]) v.state[it.x] = s;
      if (nodes[it.x] && !(v.steps[it.x] || []).includes(it.from)) (v.steps[it.x] = v.steps[it.x] || []).push(it.from);
    });
    return v;
  }

  const st = { level: M.root, sel: null, full: false, sheet: false };   // sel: { node }, { edge, e } or { run, at, pick }
  root.classList.add("zd");
  root.innerHTML = `
  <div class="zd-main">
    <div class="zd-board">
      <div class="zd-top"><nav class="zd-crumbs" aria-label="Level path"></nav><button type="button" class="zd-fs" aria-label="Full screen"></button></div>
      <nav class="zd-nav" aria-label="Levels and scenarios"></nav>
      <p class="zd-why"></p><p class="zd-legend"></p>
      <div class="zd-time" hidden><code></code><button type="button" data-d="-1" aria-label="Earlier">‹</button><div class="zd-rail"><div class="zd-ticks" aria-hidden="true"></div><input type="range" min="1" step="1" aria-label="Step"></div><button type="button" data-d="1" aria-label="Later">›</button><output></output><button type="button" class="zd-end" aria-label="Close">✕</button></div>
      <div class="zd-stage"><div class="zd-canvas"></div><aside class="zd-note" aria-live="polite"></aside></div>
    </div>
  </div><div class="zd-scrim" hidden></div>`;
  const $ = s => root.querySelector(s);
  const narrow = () => root.clientWidth < 900;
  const el = (p, tag, a = {}, t) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (t != null) e.textContent = t; p.appendChild(e); return e; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const GX = 92, GY = 82, NW = 124, NH = 46, PAD = 30;
  const HAND = '"Poor Story", "IBM Plex Sans KR", "IBM Plex Sans", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif';
  const FONT_N = "17px " + HAND, FONT_E = "15px " + HAND;
  const meas = (() => { const c = document.createElement("canvas").getContext("2d"); return (t, f) => { c.font = f; return c.measureText(t).width; }; })();
  const MARKS = { happy: "main path", failure: "failure path", optional: "optional", unsure: "unconfirmed" };
  const GLYPH = { happy: '<path d="M1 4H23" class="lg lg-happy"/>', failure: '<path d="M1 4H23" class="lg lg-failure"/>', optional: '<path d="M1 4H23" class="lg lg-optional"/>', unsure: '<text x="12" y="8" text-anchor="middle" class="lg-q">?</text>' };
  const mk = m => `<span class="zd-mk"><svg viewBox="0 0 24 9" width="24" height="9" aria-hidden="true">${GLYPH[m]}</svg>${MARKS[m]}</span>`;
  const pname = (L, id) => ((L.partitions || []).find(p => p.id === id) || { label: id }).label;
  const marks = x => (x.mark || []).filter(m => MARKS[m]);
  // metadata, each entry as `<name>: <display>` the way ui/formats.md shows it, so a value reads the same as in chat
  const DIFF = { added: "+", removed: "−", changed: "~" };
  const ptr = p => /^https?:/.test(p) ? `<a href="${esc(p)}" target="_blank" rel="noopener">${esc(p)}</a>` : `<code>${esc(p)}</code>`;
  const RESERVED = { note: v => `<em>${esc(v)}</em>`, diff: v => `${DIFF[v] || "?"} ${esc(v)}`,
    evidence: v => v.map(ptr).join(", "), constraint: v => v.map(p => `<code>${esc(p)}</code>`).join(", ") };
  const FORMAT = { text: (n, v) => esc(v), number: (n, v) => esc(String(v)), url: (n, v) => `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(n)}</a>`,
    ms: (n, v) => `${esc(String(v))} ms`, percent: (n, v) => `${esc(String(v))}%`, date: (n, v) => esc(v), bool: (n, v) => v ? "yes" : "no" };
  const metaRows = m => Object.entries(m || {}).map(([k, v]) => {
    const i = k.lastIndexOf("-"), name = RESERVED[k] || i < 0 ? k : k.slice(0, i), f = FORMAT[k.slice(i + 1)];
    return `<li class="mt" data-k="${esc(k)}"><b>${esc(name)}</b>: ${RESERVED[k] ? RESERVED[k](v) : f ? f(name, v) : esc(JSON.stringify(v))}</li>`; });
  const metaGrp = (m, h = "Metadata") => grp(h, metaRows(m));
  const tint = (g, x) => { const d = (x.meta || {}).diff; if (DIFF[d]) g.classList.add("d-" + d); };
  const shown = x => (x.label || "") + (marks(x).includes("unsure") ? " ?" : "");
  // syncs (Meng and Jackson) read on the events themselves: "push (→ receive)" and "receive (← push)"
  const syncsOf = (L, e) => (L.syncs || []).filter(y => e.label && (y.when === e.label || y.then === e.label));
  const syncTag = (L, e) => syncsOf(L, e).map(y => y.when === e.label ? "→ " + y.then : "← " + y.when).join(", ");
  const tagged = (L, e) => { const t = syncTag(L, e); return shown(e) + (t ? ` (${t})` : "") + (e.qty ? ` ${qtyText(e.qty)}` : ""); };
  const pairKey = e => [e.from, e.to].sort().join("|");
  // nodes without x and y are placed by the engine, one at a time beside a placed neighbour (one of its own
  // partition first), in the free cell where its edges, drawn by route() itself, cross the fewest other nodes
  function arrange(L, cap) {
    const todo = L.nodes.filter(n => cap || n.x == null || n.y == null);
    if (!todo.length) return;
    const box = (c, r) => ({ x: c * 200, y: r * 130, w: NW, h: NH, c, r, gx: GX });
    const at = {}, taken = new Set();
    const put = (n, c, r) => { n.x = c; n.y = r; at[n.id] = box(c, r); taken.add(c + "," + r); };
    L.nodes.filter(n => !todo.includes(n)).forEach(n => put(n, n.x, n.y));
    const near = n => L.edges.filter(e => e.from !== e.to && (e.from === n.id || e.to === n.id)).map(e => e.from === n.id ? e.to : e.from);
    while (todo.length) {
      const n = todo.find(n => near(n).some(id => at[id])) || todo[0];
      todo.splice(todo.indexOf(n), 1);
      const placed = near(n).filter(id => at[id]), mates = L.nodes.filter(o => at[o.id] && o.partition && o.partition === n.partition);
      const around = ids => ids.flatMap(id => [[1, 0], [0, 1], [-1, 0], [0, -1]].map(([dc, dr]) => [at[id].c + dc, at[id].r + dr]));
      const ok = ([c, r]) => !taken.has(c + "," + r) && (!cap || Math.max(c, ...Object.values(at).map(b => b.c)) - Math.min(c, ...Object.values(at).map(b => b.c)) < cap);
      let cells = around(placed.length ? placed : mates.map(o => o.id)).filter(ok);
      if (!cells.length && cap) cells = around(Object.keys(at)).filter(ok);
      if (!cells.length) { const cmax = Math.max(-1, ...Object.values(at).map(b => b.c)); cells = [[cmax + 1, 0]]; }
      // what the drawing check would object to, counted on every edge placed so far: edges through nodes, and
      // stretches two edges from different sources share
      const cost = ([c, r]) => {
        const all = Object.assign({}, at, { [n.id]: box(c, r) });
        const routes = L.edges.filter(e => e.from !== e.to && all[e.from] && all[e.to]).map(e => [e, route(all, e, 0)]);
        const through = routes.reduce((k, [e, pts]) => k + Object.entries(all).filter(([id, b]) => id !== e.from && id !== e.to && pts.slice(1).some((p, i) => segHits(pts[i], p, b))).length, 0);
        const segs = pts => pts.slice(1).map((p, i) => [pts[i], p]);
        const along = ([a, b], [p, q]) => (a.x === b.x && p.x === q.x && Math.abs(a.x - p.x) < 4 && Math.min(Math.max(a.y, b.y), Math.max(p.y, q.y)) - Math.max(Math.min(a.y, b.y), Math.min(p.y, q.y)) > 12)
