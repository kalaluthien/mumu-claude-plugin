<style>
/* the chart's lines are darker than a card's edge, so they read at a glance */
:root { --chart-line: var(--krds-color-border-gray-dark); --state-bg: var(--krds-color-surface-primary-subtler); --state-line: var(--krds-color-border-primary); }
/* A level not shown keeps its place in the frame's list of sections, so only the one shown counts as the current one. */
.view.away { position: fixed; top: 200vh; left: 0; width: 100%; visibility: hidden; }
.crumbs { margin: 8px 0 0; font-size: var(--text-meta); color: var(--muted); overflow-wrap: anywhere; }
.lede { margin: 0 0 14px; max-width: 46em; color: var(--body); }

/* one drawing per level; its text is the page's own font, measured before the shapes are sized */
.chart { min-height: 120px; }
.chart svg { display: block; max-width: 100%; overflow: visible; }
.chart text { font: 600 var(--text-body)/1 var(--font-sans); fill: var(--ink); }
.band rect { fill: var(--panel); stroke: none; }
.band text { font-size: var(--text-meta); fill: var(--muted); }
.line { fill: none; stroke: var(--chart-line); stroke-width: 1.5; stroke-linecap: round; }
.edge[data-kind="call"] .line { stroke-dasharray: 6 5; }
.hit { fill: none; stroke: transparent; stroke-width: 16; }
.edge { cursor: pointer; }
.edge-pill { fill: var(--surface); stroke: var(--card-line); }
.edge .edge-label { font-size: var(--text-meta); font-weight: 500; fill: var(--body); }
.node { cursor: pointer; }
.node .shape { fill: var(--surface); stroke: var(--chart-line); stroke-width: 1.25; filter: drop-shadow(0 1px 2px rgb(0 0 0 / .1)); }
.node[data-shape="state"] .shape { fill: var(--state-bg); stroke: var(--state-line); }
.start { fill: var(--ink); stroke: none; }
.start-line { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.arrow { fill: var(--chart-line); fill: context-stroke; }
.node:hover .shape, .node.selected .shape { stroke: var(--accent); stroke-width: 2.5; }
.edge:hover .line, .edge.selected .line { stroke: var(--accent); stroke-width: 2.5; }
.edge.selected .edge-label { fill: var(--accent); font-weight: 600; }
/* playback: what the item names stands out, the current step most, so a person follows it without reading the chart */
.played .node:not(.path, .now, .related), .played .edge:not(.path, .now) { opacity: .35; }
.node.path .shape, .node.related .shape { stroke: var(--accent); stroke-width: 2.5; }
.edge.path .line { stroke: var(--accent); stroke-width: 2.5; }
.node.now .shape { fill: var(--accent); stroke: var(--accent); stroke-width: 2.5; }
.node.now text { fill: var(--krds-color-text-basic-inverse, #fff); }
.edge.now .line { stroke: var(--accent); stroke-width: 4; }
.edge.now .edge-label, .edge.path .edge-label { fill: var(--accent); font-weight: 600; }
.edge.now .edge-pill, .edge.path .edge-pill, .edge.selected .edge-pill { stroke: var(--accent); }
.step-tag rect { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
.node.now .step-tag text { font-size: var(--text-meta); font-weight: 600; fill: var(--accent); }
.step-tag.broken rect { stroke: var(--krds-color-text-danger); }
.node.now .step-tag.broken text { fill: var(--krds-color-text-danger); }
.opener { cursor: pointer; }
.opener rect { fill: transparent; stroke: none; }
.opener line { stroke: var(--state-line); stroke-opacity: .35; }
.opener text { font-size: var(--text-meta); font-weight: 600; fill: var(--accent); }
.opener:hover text { text-decoration: underline; }
.node.now + .opener text { fill: var(--krds-color-text-basic-inverse, #fff); }

.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 12px 0 0; padding: 0; font-size: var(--text-meta); color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 6px; min-width: 0; }
.legend svg { flex: none; fill: var(--surface); stroke: var(--chart-line); stroke-width: 1.25; }
.inside { list-style: none; margin: 14px 0 0; padding: 0; font-size: var(--text-body); color: var(--muted); }
.inside a { color: var(--ink); font-weight: 600; }
.level.played .inside { display: none; }
.legend .key-state svg { fill: var(--state-bg); stroke: var(--state-line); }

/* the panel sits under the chart, so opening it covers nothing */
.detail { margin-top: 16px; border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; font-size: var(--text-body); overflow-wrap: anywhere; }

.detail-kind { font-size: var(--text-meta); color: var(--muted); }
.detail-close { margin-left: auto; flex: none; }

.detail dt { color: var(--muted); }
.detail dd { margin: 0; }
.detail ul { margin: 0; padding: 0; list-style: none; }
.detail code { font: var(--text-meta) var(--mono); }
.detail .rule-kind { color: var(--muted); }

.bar { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; margin: 8px 0 16px; font-size: var(--text-body); overflow-wrap: anywhere; }
.bar-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.bar h2 { margin: 0; }

.bar-source { margin-left: auto; font-size: var(--text-meta); }
.bar p { margin: 4px 0 0; }
.bar dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 14px; margin: 6px 0 0; }
.bar dt { color: var(--muted); }
.bar dd { margin: 0; }
.bar-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.bar-count { font-weight: 600; color: var(--ink); }
.bar-steps { order: 1; flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px; list-style: none; margin: 0; padding: 0; }
.bar-chip { width: 28px; height: 28px; border-radius: var(--krds-radius-max); border: 1.5px solid var(--accent); background: none; color: var(--accent); padding: 0; font: 600 var(--text-meta) var(--font-sans); overflow-wrap: normal; cursor: pointer; }
.bar-chip[aria-current="step"] { background: var(--accent); color: var(--krds-color-text-basic-inverse, #fff); }
.bar-run { margin: 8px 0 0; padding-left: 1.4em; color: var(--muted); }
.bar-run li { margin-top: 4px; }
.bar-run [aria-current] { color: var(--ink); font-weight: 600; }
/* the same mark as the navigation's, so a reader ties the two */
.verdict[data-verdict="pass"]::before { content: "✓ "; }
.verdict[data-verdict="counterexample"]::before { content: "✗ "; }
.verdict[data-verdict="unproved"]::before { content: "? "; }
.level.played .lede { display: none; }

.items a { font-weight: 600; }
.items p { margin: 4px 0 0; color: var(--body); }

/* beside the chart, so the chart stays the one main thing and the controls stay put between levels */
@media (min-width: 1100px) {
  .frame-body:has(.item:not(.away)) { display: grid; grid-template-columns: minmax(0, 1fr) 290px; column-gap: 28px; align-items: start; max-width: 1180px; }
  .frame-body:has(.item:not(.away))::after { grid-column: 1 / -1; }
  .view.level { grid-column: 1; grid-row: 1; }

  .bar-source { margin-left: 0; }

@media print {
  .view.away { position: static; visibility: visible; }
  .view { break-after: page; }
  .item { display: none; }
  .detail-close { display: none; }
}

    const points = curve(port(boxes[edge.from], out, shifts[i].from), out, port(boxes[edge.to], into, shifts[i].to), into, bulge);
    const [p0, p1, p2, p3] = points;
    return {path: `M${p0[0]} ${p0[1]}C${p1[0]} ${p1[1]} ${p2[0]} ${p2[1]} ${p3[0]} ${p3[1]}`, points: samples(points), blocked: Boolean(stuck)};
  });
}

// A label is a pill always crossed by its own line, so a reader can tell whose it is. It takes the spot nearest the line's middle that covers no other line, and may slide sideways on the line to clear one.
function placeLabel(edge, line, boxes, bands, placed, every, aim) {
  const width = textWidth(edge.label, 12.5, 500) + 16, height = 20, slide = width / 2 - 8;
  const nodes = [...Object.values(boxes).map(box => inflated(box, 4)), ...bands.map(band => band.name)];
  const pill = ([x, y]) => ({x: x - width / 2, y: y - height / 2, w: width, h: height});
  const clear = box => !nodes.some(node => meets(node, box)) && !placed.some(other => meets(inflated(other, 3), box));
  const covered = box => every.filter(other => other !== line && other.points.some(point => holds(box, point))).length;
  const options = line.points.slice(4, -4).flatMap(([x, y], i, all) => [[0, 0, 0], [-slide, 0, 8], [slide, 0, 8], [0, -7, 4], [0, 7, 4]].map(([dx, dy, cost]) => {
    const box = pill([x + dx, y + dy]);
    return {box, cost: cost + Math.abs(i - aim * (all.length - 1)) / all.length * 10};
  }));
  const free = options.filter(({box}) => clear(box));
  if (!free.length) return options[Math.floor(options.length / 2)].box;
  return free.reduce((best, option) => {
    const score = option.cost + 100 * covered(option.box);
    return score < best.score ? {...option, score} : best;
  }, {score: Infinity}).box;
}

function plan(level, sizes, shape) {
  const {boxes, bands} = arrange(level, sizes, shape);
  const placed = [], routed = routes(level, boxes);
  // A band's name takes the top corner no line runs through; a self loop does not count, since its band grows above it.
  for (const band of bands) {
    const width = textWidth(band.label, 13, 500) + 8, corner = x => ({x, y: band.top + 2, w: width, h: 20});
    const [near, far] = [corner(band.left + 6), corner(band.right - 6 - width)];
    band.name = routed.some((line, i) => level.edges[i].from !== level.edges[i].to && line.points.some(point => holds(near, point))) ? far : near;
  }
  const lines = level.edges.map((edge, i) => {
    const start = routed[i].points[0], end = routed[i].points.at(-1);
    // Two lines running opposite ways up a short gap have no room for two labels side by side, so each label moves toward its own line's start.
    const twin = level.edges.some(other => other.from === edge.to && other.to === edge.from) && Math.abs(end[1] - start[1]) > Math.abs(end[0] - start[0]);
    const label = placeLabel(edge, routed[i], boxes, bands, placed, routed, twin ? .3 : .5);
    placed.push(label);
    return {edge, line: routed[i], label};
  });
  for (const band of bands) for (const {edge, line, label} of lines) {
    if (edge.from !== edge.to || !band.ids.includes(edge.from)) continue;
    const xs = [label.x, label.x + label.w, ...line.points.map(point => point[0])], ys = [label.y, label.y + label.h, ...line.points.map(point => point[1])];
    band.left = Math.min(band.left, Math.min(...xs) - 8);
    band.right = Math.max(band.right, Math.max(...xs) + 8);
    band.top = Math.min(band.top, Math.min(...ys) - 22);
    band.name.y = band.top + 2;
    band.bottom = Math.max(band.bottom, Math.max(...ys) + 8);
  }
  const xs = [...level.initial.map(id => boxes[id].x - 22), ...Object.values(boxes).flatMap(box => [box.x, box.x + box.w]), ...bands.flatMap(band => [band.left, band.right]), ...placed.flatMap(box => [box.x, box.x + box.w]), ...lines.flatMap(({line}) => line.points.map(point => point[0]))];
  const ys = [...Object.values(boxes).flatMap(box => [box.y, box.y + box.h]), ...bands.flatMap(band => [band.top, band.bottom]), ...placed.flatMap(box => [box.y, box.y + box.h]), ...lines.flatMap(({line}) => line.points.map(point => point[1]))];
  const left = Math.min(...xs, 0) - 4, top = Math.min(...ys, 0) - 4;
  const reach = routed.reduce((sum, {points}) => sum + points.slice(1).reduce((total, point, i) => total + Math.hypot(point[0] - points[i][0], point[1] - points[i][1]), 0), 0);
  const crowded = placed.filter((one, i) => placed.some((two, j) => j > i && meets(inflated(one, 3), two))).length;
  return {boxes, bands, lines, left, top, reach, crowded, blocked: routed.some(line => line.blocked), width: Math.ceil(Math.max(...xs) - left + 4), height: Math.ceil(Math.max(...ys) - top + 4)};
}

function element(name, attributes = {}, ...children) {
  const made = document.createElementNS(SVG, name);
  for (const [key, value] of Object.entries(attributes)) made.setAttribute(key, value);
  made.append(...children);
  return made;
}

function drawNode(node, box, size) {
  const kind = node.state ? "state" : "part";
  const radius = node.state ? CORNER : 3;
  const group = element("g", {class: "node", "data-id": node.id, "data-shape": kind, tabindex: 0, role: "button", "aria-label": `${node.label}, a ${kind}. Show details.`},
    element("rect", {class: "shape", x: box.x, y: box.y, width: box.w, height: box.h, rx: radius}));
  size.lines.forEach((line, i) => {
    const label = element("text", {x: box.x + box.w / 2, y: box.y + (box.h - (node.opens ? OPENER_HEIGHT : 0) - LINE_HEIGHT * size.lines.length) / 2 + LINE_HEIGHT * i + 15, "text-anchor": "middle"});
    label.textContent = line;
    group.append(label);
  });
  return group;
}
function drawOpener(node, box) {
  const y = box.y + box.h - OPENER_HEIGHT, x = box.x, w = box.w;
  const word = element("text", {x: x + w / 2, y: y + 19, "text-anchor": "middle"});
  word.textContent = "See inside ›";
  return element("a", {class: "opener", href: `#level-${node.opens}`, "aria-label": `See inside: ${levels[node.opens].title}`},
    element("rect", {x, y, width: w, height: OPENER_HEIGHT, rx: CORNER}), element("line", {x1: x + 12, y1: y, x2: x + w - 12, y2: y}), word);
}
function drawEdge({edge, line, label}, level) {
  const name = id => level.nodes.find(node => node.id === id).label;
  return element("g", {class: "edge", "data-key": edge.key, "data-kind": edge.kind, tabindex: 0, role: "button", "aria-label": `${edge.label}, a ${edge.kind} from ${name(edge.from)} to ${name(edge.to)}. Show details.`},
    element("path", {class: "hit", d: line.path}), element("path", {class: "line", d: line.path, "marker-end": `url(#arrow-${level.id})`}));
}
// A label is a layer of its own, over every line's wide click area, so a crowded chart leaves each one clickable.
function drawTag({edge, label}) {
  const text = element("text", {class: "edge-label", x: label.x + label.w / 2, y: label.y + 14, "text-anchor": "middle"});
  text.textContent = edge.label;
  return element("g", {class: "edge edge-tag", "data-key": edge.key, "aria-hidden": "true"}, element("rect", {class: "edge-pill", x: label.x, y: label.y, width: label.w, height: label.h, rx: label.h / 2}), text);
}

function draw(id) {
  const holder = document.querySelector(`.chart[data-level="${CSS.escape(id)}"]`);
  const room = holder.clientWidth || document.querySelector(".frame-body").clientWidth - 48;
  if (drawnAt[id] === room) return;
  drawnAt[id] = room;
  const level = levels[id];
  const sizes = Object.fromEntries(level.nodes.map(node => [node.id, sized(node, level)]));
  const plans = ["wide", ...(level.lanes.length ? ["rows"] : []), "tall", "stack"].map(shape => plan(level, sizes, shape));
  const fitting = plans.filter(option => option.width <= room);
  // Among the shapes that fit, labels clear of each other come first, then the shortest lines, since a long line is a detour for the eye.
  const shortest = options => options.reduce((best, option) => option.crowded < best.crowded || option.crowded === best.crowded && option.reach < best.reach ? option : best);
  const open = fitting.filter(option => !option.blocked);
  const best = open.length ? shortest(open) : fitting[0] || plans.at(-1);
  const svg = element("svg", {viewBox: `${best.left} ${best.top} ${best.width} ${best.height}`, width: best.width, height: best.height, role: "group", "aria-label": `Chart of ${level.title}`},
    element("defs", {}, element("marker", {id: `arrow-${id}`, viewBox: "0 0 10 10", refX: 9, refY: 5, markerUnits: "userSpaceOnUse", markerWidth: 9, markerHeight: 9, orient: "auto-start-reverse"}, element("path", {class: "arrow", d: "M0 0L10 5L0 10z"}))));
  for (const band of best.bands) {
    const label = element("text", {x: band.name.x + 4, y: band.top + 17});
    label.textContent = band.label;
    svg.append(element("g", {class: "band"}, element("rect", {x: band.left, y: band.top, width: band.right - band.left, height: band.bottom - band.top, rx: 8}), label));
  }
  for (const start of level.initial) {
    const box = best.boxes[start], y = box.y + box.h / 2;
    svg.append(element("circle", {class: "start", cx: box.x - 18, cy: y, r: 4}), element("path", {class: "start-line", d: `M${box.x - 14} ${y}L${box.x} ${y}`}));
  }
  best.lines.forEach(line => svg.append(drawEdge(line, level)));
  for (const node of level.nodes) {
    svg.append(drawNode(node, best.boxes[node.id], sizes[node.id]));
    if (node.opens) svg.append(drawOpener(node, best.boxes[node.id]));
  }
  best.lines.forEach(line => svg.append(drawTag(line)));
  holder.replaceChildren(svg);
}

function tag(name, className, text) {
  const made = document.createElement(name);
  if (className) made.className = className;
  if (text !== undefined) made.textContent = text;
  return made;
}
function row(list, term, ...values) {
  const value = tag("dd");
  value.append(...values);
  list.append(tag("dt", "", term), value);
}
function sourceOf(meta) {
  if (!meta.source.includes("://")) return tag("code", "", meta.source);
  const link = tag("a", "", meta.source);
  link.href = meta.source;
  return link;
}
function bullets(texts) {
  const list = tag("ul");
  list.append(...texts.map(text => tag("li", "", text)));
  return list;
}

function closeDetail(section) {
  const panel = section.querySelector(".detail");
  panel.hidden = true;
  panel.replaceChildren();
  section.querySelectorAll(".selected").forEach(chosen => chosen.classList.remove("selected"));
}
function openDetail(section, chosen, title, kind, meta, facts) {
  closeDetail(section);
  chosen.classList.add("selected");
  section.querySelectorAll(`.edge-tag[data-key="${CSS.escape(chosen.dataset.key || "")}"]`).forEach(tag => tag.classList.add("selected"));
  const panel = section.querySelector(".detail");
  const close = tag("button", "krds-btn text xsmall detail-close", "Close");
  close.type = "button";
  close.addEventListener("click", () => { closeDetail(section); chosen.focus(); });
  const head = tag("div", "detail-head");
  head.append(tag("h2", "", title), tag("span", "detail-kind", kind), close);
  const list = tag("dl");
  for (const [term, value] of facts) row(list, term, value);
  row(list, "Source", sourceOf(meta));
  panel.append(head, tag("p", "", meta.description), list);
  panel.hidden = false;
  panel.scrollIntoView({block: "nearest"});
}
function ruleList(slugs) {
  return bullets(slugs.map(slug => `${slug} (${data.rules[slug].kind}): ${data.rules[slug].description}`));
}
function choose(chosen) {
  const section = chosen.closest(".level"), level = levels[section.id.slice("level-".length)];
  if (chosen.matches(".node")) {
    const node = level.nodes.find(known => known.id === chosen.dataset.id);
    const facts = [...(node.attrs.length ? [["Attributes", bullets(node.attrs)]] : []), ...(node.rules.length ? [["Rules", ruleList(node.rules)]] : [])];
    openDetail(section, chosen, node.label, node.state ? "State" : "Part", node.meta, facts);
  } else {
    const edge = level.edges.find(known => known.key === chosen.dataset.key);
    const line = section.querySelector(`.edge:not(.edge-tag)[data-key="${CSS.escape(edge.key)}"]`);
    const name = id => level.nodes.find(node => node.id === id).label;
    const facts = [["From, to", document.createTextNode(`${name(edge.from)} → ${name(edge.to)}`)],
      ...(edge.changes.length ? [["Changes", bullets(edge.changes)]] : []), ...(edge.rules.length ? [["Rules", ruleList(edge.rules)]] : [])];
    openDetail(section, line, edge.label, edge.kind === "call" ? "Call" : "Transition", edge.meta, facts);
  }
}

function mark() {
  document.querySelectorAll(".played").forEach(section => section.classList.remove("played"));
  document.querySelectorAll(".path, .now, .related").forEach(on => on.classList.remove("path", "now", "related"));
  document.querySelectorAll(".step-tag").forEach(old => old.remove());
  if (!playing) return;
  const section = document.getElementById(`level-${current}`);
  section.classList.add("played");
  const add = (name, nodes, edges) => {
    nodes.forEach(id => section.querySelectorAll(`.node[data-id="${CSS.escape(id)}"]`).forEach(node => node.classList.add(name)));
    edges.forEach(key => section.querySelectorAll(`.edge[data-key="${CSS.escape(key)}"]`).forEach(edge => edge.classList.add(name)));
  };
  add("related", playing.nodes, []);
  if (!playing.verdict) playing.steps.forEach(step => add("path", step.nodes, step.edges));
  if (playing.steps[stepAt]) add("now", playing.steps[stepAt].nodes, playing.steps[stepAt].edges);
  // one tag, since a step is one moment however many nodes it moves
  const first = section.querySelector(".node.now");
  if (first) stepTag(first);
}
function stepTag(node) {
  // A counterexample's last step is where the rule breaks, so the chart says so, not only the bar.
  const broken = playing.verdict === "counterexample" && stepAt === playing.steps.length - 1;
  const box = node.querySelector(".shape").getBBox(), words = `Step ${stepAt + 1}${broken ? ": broken" : ""}`, width = broken ? 104 : 56, height = 20;
  const shown = element("g", {class: broken ? "step-tag broken" : "step-tag"}, element("rect", {x: box.x + box.width - width, y: box.y - height / 2, width, height, rx: height / 2}),
    element("text", {x: box.x + box.width - width / 2, y: box.y + 4, "text-anchor": "middle"}, words));
  node.append(shown);
}
function reveal(...ids) {
  document.querySelectorAll(".view").forEach(section => section.classList.toggle("away", !ids.includes(section.id)));
  // The frame marks the current link on scroll, and this change moves no scrollbar.
  dispatchEvent(new Event("scroll"));
}
function show(id) {
  current = id;
  reveal(`level-${id}`, ...(playing ? [playing.key] : []));
  draw(id);
  mark();
}
const VERDICT_WORDS = {pass: "No run within the scope breaks it.", counterexample: "A run breaks it.", unproved: "Alloy gave no answer."};
function shortSource(source) {
  if (!source.includes("://")) return tag("code", "", source);
  const link = tag("a", "", `Source: ${new URL(source).hostname}`);
  link.href = source;
  return link;
}
function stepChip(index) {
  const chip = tag("button", "bar-chip", String(index + 1));
  chip.type = "button";
  chip.setAttribute("aria-label", `Step ${index + 1}`);
  if (index === stepAt) chip.setAttribute("aria-current", "step");
  chip.addEventListener("click", () => playStep(index));
  const place = tag("li");
  place.append(chip);
  return place;
}
function runList(item) {
  const run = tag("ol", "bar-step bar-run");
  item.steps.forEach((step, index) => {
    const told = tag("li", "", `${step.does} ${step.expects}`.trim());
    if (index === stepAt) told.setAttribute("aria-current", "step");
    run.append(told);
  });
  return run;
}
function stepControl(role, label, disabled) {
  const button = tag("button", `krds-btn secondary xsmall ${role}`, label);
  button.type = "button";
  button.disabled = disabled;
  button.addEventListener("click", () => {
    playStep(stepAt + (role === "bar-next" ? 1 : -1));
    const again = document.querySelector(`#${playing.key} .${role}:not(:disabled)`);
    if (again) again.focus();
  });
  return button;
}
function drawBar(item) {
  const head = tag("div", "bar-head");
  head.append(tag("span", "bar-kind", item.kind), tag("h2", "", item.title));
  if (item.strength) head.append(tag("span", "bar-strength", item.strength));
  if (item.verdict) {
    const badge = tag("span", `frame-tag verdict ${TONES[item.verdict]}`, item.verdict[0].toUpperCase() + item.verdict.slice(1));
    badge.dataset.verdict = item.verdict;
    head.append(badge, tag("span", "bar-meaning", item.why || VERDICT_WORDS[item.verdict]));
  }
  if (item.source) {
    const source = tag("span", "bar-source");
    source.append(shortSource(item.source));
    head.append(source);
  }
  const parts = [head, tag("p", "", item.text)];
  if (item.names?.length) {
    const facts = tag("dl");
    row(facts, "Concerns", document.createTextNode(item.names.join(", ")));
    parts.push(facts);
  }
  const step = item.steps[stepAt];
  if (step) {
    const controls = tag("div", "bar-controls");
    const chips = tag("ol", "bar-steps");
    chips.append(...item.steps.map((_, index) => stepChip(index)));
    controls.append(stepControl("bar-previous", "Previous", stepAt === 0), chips, stepControl("bar-next", "Next", stepAt === item.steps.length - 1), tag("span", "bar-count", `Step ${stepAt + 1} of ${item.steps.length}`));
    // a run has only ids behind it, so it reads best whole; a scenario's steps carry their own sentences
    const said = item.verdict ? runList(item) : tag("dl", "bar-step");
    said.setAttribute("aria-live", "polite");
    if (!item.verdict) {
      row(said, "Does", document.createTextNode(step.does));
      if (step.expects) row(said, "Expects", document.createTextNode(step.expects));
    }
    parts.push(controls, said);
  }
  document.querySelector(`#${item.key} .bar`).replaceChildren(...parts);
}
function playStep(index) {
  stepAt = index;
  drawBar(playing);
  show(playing.steps[stepAt]?.level || playing.level);
}
function follow(target) {
  if (Object.hasOwn(items, target)) {
    if (playing?.key === target) return;
    playing = items[target];
    document.querySelectorAll(".level").forEach(closeDetail);
    playStep(0);
    return;
  }
  playing = null;
  if (target === "scenarios" || target === "rules") {
    reveal(target);
    mark();
    return;
  }
  const id = target.slice("level-".length);
  show(target.startsWith("level-") && Object.hasOwn(levels, id) ? id : "root");
}
function followHash() {
  follow(location.hash.slice(1));
}
function itemCopy(item) {
  return [item.title, item.text, ...item.steps.map((step, i) => `${i + 1}. ${step.does} ${step.expects}`.trim())].join("\n");
}

document.addEventListener("click", event => {
  const link = event.target.closest('a[href^="#"]');
  if (link) follow(link.getAttribute("href").slice(1));
  const chosen = event.target.closest(".node, .edge");
  if (chosen) choose(chosen);
});
document.addEventListener("keydown", event => {
  const chosen = event.target.closest?.(".node, .edge");
  if (chosen && (event.key === "Enter" || event.key === " ")) {
    event.preventDefault();
    choose(chosen);
  }
});
addEventListener("hashchange", followHash);
addEventListener("resize", () => { draw(current); mark(); });
addEventListener("beforeprint", () => data.levels.forEach(level => draw(level.id)));
followHash();
start({
  copy: () => playing ? itemCopy(playing) : levels[current].copy,
  reset: () => {
    document.querySelectorAll(".level").forEach(closeDetail);
    history.replaceState(null, "", location.pathname + location.search);
    playing = null;
    show("root");
    scrollTo(0, 0);
  },
});
</script>
