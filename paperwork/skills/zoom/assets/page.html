<style>
/* Each name reads a KRDS colour, so the page follows the frame's theme. */

}
a { color: inherit; text-underline-offset: 3px; }

/* A level not shown keeps its place in the frame's list of sections, so only the one shown counts as the current one. */
.level.away { position: fixed; top: 200vh; left: 0; width: 100%; visibility: hidden; }
.crumbs { margin: 8px 0 0; font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
h1 { font-size: 1.7rem; line-height: 1.25; font-weight: 600; color: var(--ink); margin: 2px 0 6px; overflow-wrap: anywhere; }
.lede { margin: 0 0 14px; max-width: 46em; color: var(--body); }

/* one drawing per level; its text is the page's own font, measured before the shapes are sized */
.chart { min-height: 120px; }
.chart svg { display: block; max-width: 100%; }
.chart text { font: 500 15px/1 var(--font-sans); fill: var(--ink); }
.band rect { fill: var(--panel); stroke: none; }
.band text { font-size: 13px; fill: var(--muted); }
.line { fill: none; stroke: var(--line); stroke-width: 1.5; }
.edge[data-kind="call"] .line { stroke-dasharray: 6 5; }
.hit { fill: none; stroke: transparent; stroke-width: 16; }
.edge { cursor: pointer; }
.edge .edge-label { font-size: 13px; font-weight: 400; fill: var(--body); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.band ~ .edge .edge-label { stroke: var(--bg); }
.node { cursor: pointer; }
.node .shape { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
.node[data-shape="state"] .shape { fill: var(--state-bg); stroke: var(--state-line); }
.start { fill: var(--ink); stroke: none; }
.start-line { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.arrow { fill: var(--line); }
.node:hover .shape, .node.selected .shape { stroke: var(--accent); stroke-width: 2.5; }
.edge:hover .line, .edge.selected .line { stroke: var(--accent); stroke-width: 2.5; }
.edge.selected .edge-label { fill: var(--accent); font-weight: 600; }
.opener { cursor: pointer; }
.opener rect { fill: var(--accent); stroke: none; }
.opener text { font-size: 13px; font-weight: 600; fill: var(--krds-color-text-basic-inverse, #fff); }
.opener:hover rect { opacity: .85; }

.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 12px 0 0; padding: 0; font-size: .82rem; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 6px; min-width: 0; }
.legend svg { flex: none; fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
.legend .key-state svg { fill: var(--state-bg); stroke: var(--state-line); }

/* the panel sits under the chart, so opening it covers nothing */
.detail { margin-top: 16px; background: var(--surface); border: 1px solid var(--card-line); border-radius: 12px; padding: 14px 18px; overflow-wrap: anywhere; }
.detail-head { display: flex; align-items: baseline; gap: 10px; }
.detail h2 { font-size: 1.1rem; font-weight: 600; color: var(--ink); margin: 0; }
.detail-kind { font-size: .82rem; color: var(--muted); }
.detail-close { margin-left: auto; flex: none; }
.detail p { margin: 8px 0 0; }
.detail dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 12px 0 0; font-size: .9rem; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; }
.detail ul { margin: 0; padding: 0; list-style: none; }
.detail code { font: .85rem var(--mono); }
.detail .rule-kind { color: var(--muted); }

@media (max-width: 820px) {
  /* The frame hides the navigation by visibility, which an open submenu turns back on. */
  .frame-nav:not(.open) .lnb-list .lnb-item.active .lnb-submenu { visibility: hidden; }
}
@media (max-width: 560px) {
  .detail dl { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .detail dd { margin-bottom: 8px; }
}
@media print {
  .level.away { position: static; visibility: visible; }
  .level { break-after: page; }
  .detail-close { display: none; }
}

  closeDetail(section);
  chosen.classList.add("selected");
  const panel = section.querySelector(".detail");
  const close = tag("button", "krds-btn text small detail-close", "Close");
  close.type = "button";
  close.addEventListener("click", () => { closeDetail(section); chosen.focus(); });
  const head = tag("div", "detail-head");
  head.append(tag("h2", "", title), tag("span", "detail-kind", kind), close);
  const list = tag("dl");
  for (const [term, value] of facts) row(list, term, value);
  row(list, "Source", sourceOf(meta));
  panel.append(head, tag("p", "", meta.description), list);
  panel.hidden = false;
  panel.scrollIntoView({block: "nearest"});
}
function ruleList(slugs) {
  return bullets(slugs.map(slug => `${slug} (${data.rules[slug].kind}): ${data.rules[slug].description}`));
}
function choose(chosen) {
  const section = chosen.closest(".level"), level = levels[section.id.slice("level-".length)];
  if (chosen.matches(".node")) {
    const node = level.nodes.find(known => known.id === chosen.dataset.id);
    const facts = [...(node.attrs.length ? [["Attributes", bullets(node.attrs)]] : []), ...(node.rules.length ? [["Rules", ruleList(node.rules)]] : [])];
    openDetail(section, chosen, node.label, node.state ? "State" : "Part", node.meta, facts);
  } else {
    const edge = level.edges.find(known => known.key === chosen.dataset.key);
    const name = id => level.nodes.find(node => node.id === id).label;
    const facts = [["From, to", document.createTextNode(`${name(edge.from)} → ${name(edge.to)}`)],
      ...(edge.changes.length ? [["Changes", bullets(edge.changes)]] : []), ...(edge.rules.length ? [["Rules", ruleList(edge.rules)]] : [])];
    openDetail(section, chosen, edge.label, edge.kind === "call" ? "Call" : "Transition", edge.meta, facts);
  }
}

function show(id) {
  current = id;
  document.querySelectorAll(".level").forEach(section => section.classList.toggle("away", section.id !== `level-${id}`));
  draw(id);
  // The frame marks the current link on scroll, and this change moves no scrollbar.
  dispatchEvent(new Event("scroll"));
}
function followHash() {
  const id = location.hash.slice("#level-".length);
  show(location.hash.startsWith("#level-") && levels[id] ? id : "root");
}

document.addEventListener("click", event => {
  const link = event.target.closest('a[href^="#level-"]');
  if (link) show(link.getAttribute("href").slice("#level-".length));
  const chosen = event.target.closest(".node, .edge");
  if (chosen) choose(chosen);
});
document.addEventListener("keydown", event => {
  const chosen = event.target.closest?.(".node, .edge");
  if (chosen && (event.key === "Enter" || event.key === " ")) {
    event.preventDefault();
    choose(chosen);
  }
});
addEventListener("hashchange", followHash);
addEventListener("resize", () => draw(current));
addEventListener("beforeprint", () => data.levels.forEach(level => draw(level.id)));
followHash();
start({
  copy: () => levels[current].copy,
  reset: () => {
    document.querySelectorAll(".level").forEach(closeDetail);
    history.replaceState(null, "", location.pathname + location.search);
    show("root");
    scrollTo(0, 0);
  },
});
</script>
