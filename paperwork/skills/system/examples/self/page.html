<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The system skill</title>
<style>
:root {
  --radius: .625rem; --background: oklch(1 0 0); --foreground: oklch(.145 0 0); --popover: oklch(1 0 0); --card: oklch(1 0 0);
  --primary: oklch(.205 0 0); --primary-foreground: oklch(.985 0 0); --muted: oklch(.97 0 0); --muted-foreground: oklch(.556 0 0); --destructive: oklch(.577 .245 27.325);
  --accent: oklch(.97 0 0); --border: oklch(.922 0 0); --ring: oklch(.708 0 0); --canvas: oklch(.985 0 0); --mark: oklch(.55 .2 259);
  --ease: cubic-bezier(.45, 0, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / .1), 0 2px 4px -2px rgb(0 0 0 / .1); --focus: 0 0 0 3px color-mix(in oklab, var(--ring) 50%, transparent);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: oklch(.145 0 0); --foreground: oklch(.985 0 0); --popover: oklch(.205 0 0); --card: oklch(.205 0 0);
    --primary: oklch(.922 0 0); --primary-foreground: oklch(.205 0 0); --muted: oklch(.269 0 0); --muted-foreground: oklch(.708 0 0); --destructive: oklch(.704 .191 22.216);
    --accent: oklch(.269 0 0); --border: oklch(1 0 0 / 14%); --ring: oklch(.556 0 0); --canvas: oklch(.17 0 0); --mark: oklch(.7 .16 259);
  }
}
* { box-sizing: border-box; border-color: var(--border); }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--canvas); color: var(--foreground); font: 14px/20px ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
kbd { display: inline-flex; align-items: center; justify-content: center; height: 20px; min-width: 20px; padding: 0 4px; border-radius: 6px; background: var(--muted); color: var(--muted-foreground); font: 500 12px/1 ui-sans-serif, system-ui, sans-serif; }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

#diagram { position: fixed; inset: 0; overflow: hidden; background-image: radial-gradient(circle, color-mix(in oklab, var(--foreground) 9%, transparent) 1px, transparent 1px); background-size: 24px 24px; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.stage.old { pointer-events: none; }
.stage svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

.area { position: absolute; border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklab, var(--background) 55%, transparent); transition: opacity .25s var(--ease), border-color .2s var(--ease); }
.area[data-tag="region"] { border-style: dashed; }
.area > header { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; font-size: calc(12px * var(--grow, 1)); line-height: 16px; font-weight: 500; white-space: nowrap; }
.area > header::first-letter { text-transform: uppercase; }
.area > header small { font-size: inherit; font-weight: 400; color: var(--muted-foreground); }

.node { position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 8px 12px; border: 1px solid var(--border); border-radius: calc(var(--radius) * .8); background: var(--card); box-shadow: var(--shadow-sm); cursor: default; outline: none;
  transition: opacity .25s var(--ease), transform .25s var(--spring), box-shadow .2s var(--ease), border-color .2s var(--ease); }
.node b { font-size: calc(14px * var(--grow, 1)); font-weight: 500; overflow-wrap: anywhere; text-wrap: balance; }
.node small { font-size: calc(12px * var(--grow, 1)); line-height: 16px; color: var(--muted-foreground); white-space: nowrap; }
.stage.dense .node { padding: 4px 10px; gap: 0; }
.stage.dense .node b { font-size: calc(12px * var(--grow, 1)); line-height: 16px; }
.stage.dense .node small { font-size: calc(11px * var(--grow, 1)); line-height: 14px; }
.stage.dense .node .open { right: 4px; top: 4px; width: 20px; height: 20px; }
.stage.dense .area > header { height: 24px; padding: 0 10px; }
.node:hover, .node.on { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--ring); }
.node:focus-visible { border-color: var(--ring); box-shadow: var(--focus); }
.node.pinned { border-color: var(--foreground); }
.node .open { position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted-foreground); cursor: pointer; transition: background-color .15s var(--ease), color .15s var(--ease), transform .25s var(--spring); }
.node .open:hover { background: var(--accent); color: var(--foreground); transform: scale(1.12); }
.node.first::before { content: ""; position: absolute; left: -11px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--foreground); }

.edge path.line { fill: none; stroke: var(--ring); stroke-width: 1.25; opacity: .7; transition: stroke .2s var(--ease), stroke-width .2s var(--ease), opacity .25s var(--ease); }
.edge path.head { fill: var(--ring); opacity: .7; transition: fill .2s var(--ease), opacity .25s var(--ease); }
.edge path.hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; }
.edge.on path.line { stroke: var(--foreground); stroke-width: 1.75; opacity: 1; }
.edge.on path.head { fill: var(--foreground); opacity: 1; }
.edge[data-tag="dependsOn"] path.line, .edge[data-tag="governs"] path.line { stroke-dasharray: 4 4; }
.label { position: absolute; transform: translate(-50%, -50%); padding: 1px 6px; border-radius: 6px; background: var(--canvas); color: var(--muted-foreground); font-size: calc(12px * var(--grow, 1)); line-height: 16px; white-space: nowrap; cursor: default; transition: opacity .25s var(--ease), color .2s var(--ease), background-color .2s var(--ease); }
.label.on { color: var(--foreground); background: var(--accent); z-index: 3; }
.label.tucked:not(.shown) { opacity: 0 !important; pointer-events: none; }

.stage .dim { opacity: .38; }
.stage.playing .dim { opacity: .62; }
.edge.dim path.line, .edge.dim path.head { opacity: .5; }

.bar { position: fixed; z-index: 20; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 6px; border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklab, var(--background) 86%, transparent); backdrop-filter: blur(10px); box-shadow: var(--shadow-sm); }
#crumbs { left: 16px; top: 16px; padding: 0 12px; color: var(--muted-foreground); max-width: 60vw; white-space: nowrap; }
#crumbs button { border: 0; background: none; padding: 0; cursor: pointer; color: inherit; transition: color .15s var(--ease); }
#crumbs button:hover { color: var(--foreground); }
#crumbs [aria-current] { color: var(--foreground); font-weight: 500; }
#crumbs .sep { opacity: .6; }
#tools { right: 16px; top: 16px; }
.tool { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-weight: 500; white-space: nowrap; transition: background-color .15s var(--ease), transform .25s var(--spring); }
.tool:hover { background: var(--accent); }
.tool:active { transform: scale(.96); }
.tool:focus-visible, #crumbs button:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 6px; }
.tool.quiet { color: var(--muted-foreground); font-weight: 400; }

#card { position: fixed; z-index: 30; width: 400px; overflow: hidden; overflow-wrap: anywhere; padding: 14px 16px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--popover); box-shadow: var(--shadow-md); opacity: 0; transform: translateY(6px) scale(.97); pointer-events: none; transition: opacity .16s var(--ease), transform .24s var(--spring); }
#card.kept { box-shadow: var(--shadow-lg); }
#card.long { overflow-y: auto; }
#card.long footer { position: sticky; bottom: -12px; background: var(--popover); }
#card.show { opacity: 1; transform: none; pointer-events: auto; }
#card h2 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; }
#card .tag { display: inline-flex; margin: 6px 6px 0 0; padding: 2px 8px; border: 1px solid var(--border); border-radius: 9999px; font-size: 12px; line-height: 16px; font-weight: 500; }
#card .tag.fill { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
#card dl { margin: 10px 0 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
#card dt { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--muted-foreground); }
#card dd { margin: 2px 0 0; word-break: keep-all; }
#card ul { margin: 0; padding-left: 18px; } #card li + li { margin-top: 2px; }
#card table { width: 100%; border-collapse: collapse; font-size: 12px; line-height: 16px; }
#card th { text-align: left; font-weight: 500; color: var(--muted-foreground); } #card th, #card td { padding: 5px 8px 5px 0; border: 0; vertical-align: top; }
#card tbody tr { transition: background-color .15s var(--ease); } #card tbody tr:hover { background: color-mix(in oklab, var(--muted) 60%, transparent); }
#card pre, #card code { background: var(--muted); border-radius: 6px; font-size: 12px; } #card pre { margin: 0; padding: 6px 8px; white-space: pre-wrap; } #card code { padding: 1px 4px; }
#card pre code { padding: 0; background: none; }
#card footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); color: var(--muted-foreground); font-size: 12px; line-height: 16px; white-space: nowrap; }
#card footer .hints { display: inline-flex; gap: 12px; margin-left: auto; } #card footer .hints span { display: inline-flex; align-items: center; gap: 4px; }
#card .turn { height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; font-size: 12px; font-weight: 500; cursor: pointer; transition: background-color .15s var(--ease); }
#card .turn:hover { background: var(--accent); }
#card .ref { padding: 0 4px; border-radius: 4px; background: color-mix(in oklab, var(--mark) 12%, transparent); cursor: default; transition: background-color .15s var(--ease); }
#card .ref:hover { background: color-mix(in oklab, var(--mark) 24%, transparent); }
#card .term { font-style: normal; text-decoration: underline dotted color-mix(in oklab, var(--foreground) 45%, transparent); text-underline-offset: 3px; cursor: help; outline: none; }
#card .badge { display: inline-flex; padding: 0 6px; border: 1px solid transparent; border-radius: 9999px; font-size: 11px; line-height: 16px; font-weight: 500; vertical-align: 1px; }
#card .badge.guess, #card .badge.unknown { background: oklch(.95 .06 85); color: oklch(.42 .09 70); }
#card .badge.broken { background: oklch(.94 .05 25); color: oklch(.45 .17 25); }
#card .tag.badge { margin: 6px 6px 0 0; padding: 2px 8px; font-size: 12px; vertical-align: baseline; }
#card .cite { background: transparent; color: var(--foreground); cursor: pointer; font-family: inherit; }
#card .cite:hover { background: var(--accent); }
#card pre.fence { margin: 4px 0; overflow-x: auto; white-space: pre; }
#card math { font-size: 1.05em; }
#card math[display="block"] { margin: 6px 0; text-align: center; }
#gloss { position: fixed; z-index: 31; max-width: 360px; padding: 8px 10px; border: 1px solid var(--border); border-radius: calc(var(--radius) * .8); background: var(--popover); box-shadow: var(--shadow-lg); font-size: 12px; line-height: 16px; opacity: 0; pointer-events: none; transition: opacity .12s var(--ease); }
#gloss.show { opacity: 1; pointer-events: auto; }
#gloss p { margin: 2px 0 0; } #gloss .source + .source { margin-top: 8px; }
#gloss code { padding: 1px 4px; border-radius: 6px; background: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
#gloss blockquote { margin: 4px 0 0; padding-left: 8px; border-left: 2px solid var(--border); color: var(--muted-foreground); }
.stage .named, .stage.playing .named { opacity: 1; }
.node.named { border-color: var(--mark); box-shadow: 0 0 0 3px color-mix(in oklab, var(--mark) 28%, transparent), var(--shadow-md); }
.area.named { border-color: var(--mark); }
.edge.named path.line { stroke: var(--mark); stroke-width: 2.25; opacity: 1; } .edge.named path.head { fill: var(--mark); opacity: 1; }
.label.named { color: var(--mark); background: var(--accent); z-index: 3; }

#play { left: 50%; bottom: 20px; gap: 2px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; padding: 0 4px; transition: opacity .2s var(--ease), transform .32s var(--spring); max-width: min(960px, calc(100vw - 32px)); }
#play.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.tool.icon { width: 28px; padding: 0; justify-content: center; }
.tool:disabled { opacity: .35; pointer-events: none; }
#run .pause, #run[data-on="1"] .start { display: none; } #run[data-on="1"] .pause { display: block; }
#play .count { padding: 0 4px 0 8px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; white-space: nowrap; }
#play .title { padding: 0 6px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#play .dots { display: flex; padding: 0 4px; }
#origin { position: fixed; z-index: 5; outline: 2px solid var(--mark); outline-offset: 3px; border-radius: var(--radius); pointer-events: none; }
#origin span { position: absolute; left: 4px; bottom: calc(100% + 6px); padding: 0 6px; border-radius: 6px; background: var(--canvas); color: var(--mark); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; }
#onto { flex-shrink: 0; padding: 0 8px; color: var(--muted-foreground); font-size: 12px; white-space: nowrap; }
#play .dots button { width: 14px; height: 28px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
#play .dots button::before { content: ""; width: 6px; height: 6px; border-radius: 3px; background: var(--border); transition: background-color .2s var(--ease), width .3s var(--spring); }
#play .dots button:hover::before { background: var(--ring); }
#play .dots button.done::before { background: color-mix(in oklab, var(--mark) 55%, var(--border)); }
#play .dots button.now::before { width: 14px; background: var(--mark); }
#play .dots button.now { width: 22px; }
#play .dots button:focus-visible { outline: none; } #play .dots button:focus-visible::before { box-shadow: var(--focus); }
#chip { position: fixed; z-index: 25; max-width: 360px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--popover); box-shadow: var(--shadow-md); font-size: 12px; line-height: 16px; pointer-events: none; opacity: 0; transform: translateY(4px) scale(.96); transition: opacity .2s var(--ease), transform .3s var(--spring); }
#chip.show { opacity: 1; transform: none; }
#chip code { font-size: 12px; }
.node.past { border-color: color-mix(in oklab, var(--mark) 45%, var(--border)); }
.node.next { border-color: var(--mark); border-style: dashed; }
.node.step { border-color: var(--mark); box-shadow: 0 0 0 3px color-mix(in oklab, var(--mark) 30%, transparent), var(--shadow-lg); transform: translateY(-2px); }
.label.past, .label.next { color: var(--foreground); }
.label.step { color: var(--foreground); background: color-mix(in oklab, var(--mark) 14%, var(--canvas)); z-index: 3; }
.edge.ahead path.line { opacity: .9; }
.edge.past path.line { stroke: color-mix(in oklab, var(--mark) 60%, var(--ring)); stroke-width: 2; opacity: 1; }
.edge.past path.head { fill: color-mix(in oklab, var(--mark) 60%, var(--ring)); opacity: 1; }
.edge.next path.line { stroke: var(--mark); stroke-width: 1.5; stroke-dasharray: 3 5; opacity: 1; }
.edge.next path.head { fill: var(--mark); opacity: 1; }
.edge.step path.line { stroke: var(--mark); stroke-width: 2.25; opacity: 1; }
.edge.step path.head { fill: var(--mark); opacity: 1; }
#token { position: absolute; left: 0; top: 0; width: 12px; height: 12px; margin: -6px; border-radius: 50%; background: var(--mark); box-shadow: 0 0 0 4px color-mix(in oklab, var(--mark) 30%, transparent); offset-rotate: 0deg; opacity: 0; pointer-events: none; z-index: 4; }
#token.run { animation: travel .9s cubic-bezier(.6, 0, .2, 1) both; }
#token.run.carry { animation-name: carry; }
@keyframes carry { 0% { offset-distance: 0%; opacity: 1; } 100% { offset-distance: 100%; opacity: 1; } }
@keyframes travel { 0% { offset-distance: 0%; opacity: 0; } 14% { opacity: 1; } 100% { offset-distance: 100%; opacity: 1; } }
@keyframes appear { 0% { opacity: 0; } 100% { opacity: 1; } }

#veil { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .5); opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); }
#veil.show { opacity: 1; pointer-events: auto; }
#palette { position: fixed; z-index: 41; left: 50%; top: 18vh; width: min(512px, calc(100vw - 32px)); border: 1px solid var(--border); border-radius: var(--radius); background: var(--popover); box-shadow: var(--shadow-lg); overflow: hidden; opacity: 0; transform: translate(-50%, -8px) scale(.96); pointer-events: none; transition: opacity .18s var(--ease), transform .28s var(--spring); }
#palette.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#field { display: flex; align-items: center; gap: 8px; padding-right: 8px; border-bottom: 1px solid var(--border); }
#palette input { flex: 1; min-width: 0; height: 48px; padding: 0 16px; border: 0; background: transparent; color: inherit; font: inherit; outline: none; }
#regex { font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -.02em; }
#regex[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); }
#palette input::placeholder { color: var(--muted-foreground); }
#hits { max-height: 320px; overflow-y: auto; padding: 4px; }
#hits h3 { margin: 0; padding: 6px 8px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--muted-foreground); }
#hits .hit { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 6px; cursor: pointer; transition: background-color .12s var(--ease); }
#hits .hit[aria-selected="true"] { background: var(--accent); }
#hits .hit .text { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
#hits .hit .text > b { font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
#hits .hit .where { font-size: 12px; line-height: 16px; color: var(--muted-foreground); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
#hits .hit .where i { font-style: normal; font-weight: 500; color: var(--foreground); }
#hits mark { background: color-mix(in oklab, var(--mark) 18%, transparent); color: var(--foreground); font-weight: 600; border-radius: 2px; box-shadow: 0 1px 0 color-mix(in oklab, var(--mark) 70%, transparent); }
#keys { display: flex; justify-content: flex-end; gap: 16px; height: 40px; align-items: center; padding: 0 12px; border-top: 1px solid var(--border); color: var(--muted-foreground); font-size: 12px; }
#keys span { display: inline-flex; align-items: center; gap: 4px; }
#hits .hit small { margin-left: auto; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }
#hits .hit .clock { display: inline-flex; color: var(--muted-foreground); }
#hits .hit .recent { color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } #hits .hit .recent b { font-weight: 600; color: var(--foreground); }
#hits .hit .forget { width: 24px; height: 24px; color: var(--muted-foreground); }
#hits .none { display: flex; flex-direction: column; gap: 4px; padding: 24px; text-align: center; color: var(--muted-foreground); }
#hits .none b { font-weight: 500; color: var(--foreground); overflow-wrap: anywhere; }
#hits .none.error b { color: var(--destructive); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-property: opacity, color, background-color, border-color, box-shadow, stroke, fill !important; transition-duration: .2s !important; transition-delay: 0s !important; }
  #token.run, #token.run.carry { animation: appear .24s var(--ease) both; offset-distance: 100%; }
  #card, #chip, .node, .node .open, .tool { transform: none !important; }
  #play, #palette { transform: translate(-50%, 0) !important; }
}
</style>
</head>
<body>
<main id="diagram"><div id="stage" class="stage"></div></main>
<nav id="crumbs" class="bar" aria-label="Levels"></nav>
<div id="tools" class="bar">
<button id="scenarios" class="tool" type="button">Scenarios</button>
<button id="properties" class="tool" type="button">Properties</button>
<button id="search" class="tool quiet" type="button">Search <kbd>/</kbd></button>
</div>
<aside id="card" role="tooltip"></aside>
<div id="chip"></div>
<div id="gloss" role="tooltip"></div>
<div id="play" class="bar" role="toolbar" aria-label="Scenario">
<button id="prev" class="tool icon" type="button" aria-label="Previous step" title="Previous step (&larr;)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
<button id="run" class="tool icon" type="button" aria-label="Play" title="Play or pause (space)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path class="start" d="M7 4.5v15l12-7.5z" fill="currentColor"/><path class="pause" d="M8 5v14M16 5v14"/></svg></button>
<button id="next" class="tool icon" type="button" aria-label="Next step" title="Next step (&rarr;)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
<span class="count"></span><span class="title"></span><span class="dots"></span><span id="onto" hidden></span>

  function shut() {
    $("veil").classList.remove("show"); $("palette").classList.remove("show");
    document.body.dataset.palette = "";
    $("query").blur();
  }
  function pick(entry) {
    const query = $("query").value.trim();
    if (entry.recent) return recall(entry.recent);
    if (query && document.body.dataset.palette) remember([query, ...recalled().filter(one => one.toLowerCase() !== query.toLowerCase())].slice(0, 8));
    shut();
    if (entry.kind === "question") { // a question leads to the first record that answers it, or to the gap it is left to
      const question = contract.questions.find(one => one.id === entry.id);
      return pick(entries.find(one => one.id === (question.answers || [question.gap])[0]));
    }
    if (entry.kind === "scenario") return start(entry.id);
    if (entry.kind === "level") return go({ level: entry.id, at: null, scenario: null });
    go({ level: home(entry.id), at: entry.id, scenario: null });
  }

  // ---- wiring ----
  function wire() {
    const stage = $("stage");
    addEventListener("pointermove", approach);
    stage.addEventListener("pointerover", event => { const id = hit(event.target); approach(event); if (id) hover(id); });
    stage.addEventListener("pointerout", event => { approach(event); if (hit(event.target)) unhover(); });
    stage.addEventListener("click", event => { const id = hit(event.target); if (id && event.detail < 2) go({ at: view.at === id ? null : id }); }); // a double click's second click would undo its first
    stage.addEventListener("dblclick", event => { const id = hit(event.target); if (id && records[id].record.opens) go({ level: records[id].record.opens, at: null }, true); }); // in place of the view its first click added
    stage.addEventListener("keydown", event => {
      const id = hit(event.target);
      if (id && event.key === "Enter") go(records[id].record.opens && view.at === id ? { level: records[id].record.opens, at: null } : { at: id });
    });
    $("diagram").addEventListener("click", event => { if (event.target === $("diagram") || event.target === stage) go({ at: null }); });
    $("card").addEventListener("pointerenter", halt);
    $("card").addEventListener("pointerover", event => {
      const chip = event.target.closest(".ref"), term = event.target.closest(".term");
      if (chip) light(chip.dataset.ref);
      if (term) gloss(term, make("strong", {}, term.dataset.term), make("p", {}, ...prose(term.dataset.meaning, true)));
    });
    $("card").addEventListener("pointerout", event => {
      if (event.target.closest(".ref") && !(event.relatedTarget && event.relatedTarget.closest && event.relatedTarget.closest(".ref"))) light(null);
      if (event.target.closest(".term")) unGloss();
    });
    $("card").addEventListener("click", event => {
      const cite = event.target.closest(".cite"), shown = $("gloss").classList.contains("show") && $("gloss").dataset.for === $("card").dataset.for;
      if (!cite || shown) return unGloss();
      gloss(cite, ...sources(records[$("card").dataset.for].record));
      $("gloss").dataset.for = $("card").dataset.for;
    });
    $("card").addEventListener("pointerleave", () => { if (hovered) unhover(); });
    $("search").addEventListener("click", () => ask());
    $("scenarios").addEventListener("click", () => ask("Scenarios"));
    $("properties").addEventListener("click", () => ask("Properties"));
    $("veil").addEventListener("click", shut);
    $("query").addEventListener("input", () => { chosen = -1; list(); });
    $("regex").addEventListener("click", () => regex(!regular));
    $("prev").addEventListener("click", () => stride(-1));
    $("next").addEventListener("click", () => stride(1));
    $("stop").addEventListener("click", () => go({ scenario: null }));
    $("run").addEventListener("click", run);
    $("again").addEventListener("click", () => start(view.scenario));
    $("onward").addEventListener("click", () => start(contract.scenarios[(contract.scenarios.indexOf(records[view.scenario].record) + 1) % contract.scenarios.length].id));
    addEventListener("keydown", event => {
      if (document.body.dataset.palette) {
        if (event.key === "Escape") shut();
        else if (event.altKey && event.code === "KeyR") regex(!regular); // by the key's place, since Option on a Mac turns R into another letter
        else if (event.key === "ArrowDown" || event.key === "ArrowUp") { chosen = (chosen + (event.key === "ArrowDown" ? 1 : listed.length - 1)) % Math.max(1, listed.length); list(); }
        else if (event.key === "Enter" && listed[chosen] && !event.target.closest("button")) pick(listed[chosen]); // a focused button takes its own Enter
        else return;
        return event.preventDefault();
      }
      if ((event.key === "k" && (event.metaKey || event.ctrlKey)) || (event.key === "/" && !event.metaKey && !event.ctrlKey)) { event.preventDefault(); return ask(); }
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      if (event.key === "Escape") { if (view.at) go({ at: null }); else if (view.scenario) go({ scenario: null }); else { hovered = null; mark(); } }
      else if (event.key === " " && view.scenario && !event.target.closest("button, input")) { event.preventDefault(); run(); }
      else if (event.key === "ArrowRight") stride(1);
      else if (event.key === "ArrowLeft") stride(-1);
      else if (event.key === "[") history.back();
      else if (event.key === "]") history.forward();
    });
    addEventListener("popstate", () => show(parse()));
    addEventListener("resize", () => { paint(records[view.level].record); mark(); play(); });
  }

  window.pageRender = data => {
    load(data);
    shownLevel = null;
    const state = parse();
    history.replaceState(state, "", address(state));
    document.title = contract.title;
    $("scenarios").hidden = !(contract.scenarios || []).length;
    $("properties").hidden = !(contract.properties || []).length;
    show(state);
  };
  wire();
  window.pageRender(read("page-data"));
})();
</script>
</body>
</html>
