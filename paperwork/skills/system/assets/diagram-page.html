<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diagram</title>
<!-- page frame -->
<style>
/* Every colour a paperwork page draws, light and dark, each with its source. A page's other style names these and mixes them only with
   one another or with transparent.
   Sources:
   [neutral]  shadcn/ui's neutral theme, https://ui.shadcn.com/docs/theming
   [text]     WCAG 2.2 1.4.3, text at 4.5:1 or more against what is behind it, https://www.w3.org/TR/WCAG22/#contrast-minimum
   [non-text] WCAG 2.2 1.4.11, a badge, line or frame at 3:1 or more, https://www.w3.org/TR/WCAG22/#non-text-contrast
   [colour]   WCAG 2.2 1.4.1, colour never the only sign; a badge also says its status by glyph and its kind by shape, https://www.w3.org/TR/WCAG22/#use-of-color
   [status]   IEC 60073's indicator colours: green normal, amber abnormal, red fault; an unsettled one blue-grey
   [cvd]      at least 0.1 apart in OKLab (https://bottosson.github.io/posts/oklab/) within its set, as seen and under protanopia, deuteranopia
              and tritanopia simulated by Machado, Oliveira and Fernandes 2009 at severity 1, https://doi.org/10.1109/TVCG.2009.113 */
:root {
  color-scheme: light dark;
  --radius: .625rem; --ease: cubic-bezier(.45, 0, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
  /* [neutral] [text] */
  --background: oklch(1 0 0); --foreground: oklch(.145 0 0); --popover: oklch(1 0 0); --card: oklch(1 0 0); --canvas: oklch(.985 0 0);
  --primary: oklch(.205 0 0); --primary-foreground: oklch(.985 0 0); --muted: oklch(.97 0 0); --muted-foreground: oklch(.52 0 0); --accent: oklch(.97 0 0);
  --destructive: oklch(.53 .19 27);
  /* [neutral] a hairline of the page's chrome, which no reader needs to see the drawing */
  --border: oklch(.922 0 0); --ring: oklch(.708 0 0); --veil: oklch(0 0 0 / 50%);
  --shadow-sm: 0 1px 3px 0 oklch(0 0 0 / 10%), 0 1px 2px -1px oklch(0 0 0 / 10%);
  --shadow-md: 0 4px 6px -1px oklch(0 0 0 / 10%), 0 2px 4px -2px oklch(0 0 0 / 10%);
  --shadow-lg: 0 10px 15px -3px oklch(0 0 0 / 10%), 0 4px 6px -4px oklch(0 0 0 / 10%);
  --focus: 0 0 0 3px color-mix(in oklab, var(--ring) 50%, transparent);
  /* [non-text] a frame or line of the drawing; the mark, what a search or a step points at */
  --frame: oklch(.6 0 0); --line: oklch(.45 0 0); --mark: oklch(.55 .2 259);
  /* [status] [non-text] [colour] [cvd] a badge's fill by its claim's status, and its glyph */
  --status-holds: oklch(.55 .12 135); --status-unknown: oklch(.45 .06 290); --status-conflicting: oklch(.43 .1 50); --status-fails: oklch(.3 .12 20);
  --status-glyph: oklch(1 0 0);
  /* [non-text] [cvd] an area's colour, taken in turn so neighbours differ; its fill mixes it into the canvas */
  --group-0: oklch(.49 .1 50); --group-1: oklch(.6 .12 100); --group-2: oklch(.3 .16 270); --group-3: oklch(.47 .16 270); --group-4: oklch(.31 .1 350); --group-5: oklch(.61 .18 350);
  /* [text] a lane's or phase's tint, three in turn 70 degrees apart and 45 or more from the mark, faint enough for text at 4.5:1 */
  --band-0: oklch(.955 .024 30); --band-1: oklch(.955 .024 100); --band-2: oklch(.955 .024 170);
}
@media (prefers-color-scheme: dark) {
  :root {
    /* [neutral] [text] */
    --background: oklch(.145 0 0); --foreground: oklch(.985 0 0); --popover: oklch(.205 0 0); --card: oklch(.205 0 0); --canvas: oklch(.17 0 0);
    --primary: oklch(.922 0 0); --primary-foreground: oklch(.205 0 0); --muted: oklch(.269 0 0); --muted-foreground: oklch(.708 0 0); --accent: oklch(.269 0 0);
    --destructive: oklch(.72 .15 22);
    --border: oklch(1 0 0 / 14%); --ring: oklch(.556 0 0);
    /* [non-text] */
    --frame: oklch(.58 0 0); --line: oklch(.75 0 0); --mark: oklch(.7 .16 259);
    /* [status] [non-text] [colour] [cvd] */
    --status-holds: oklch(.91 .1 150); --status-unknown: oklch(.71 .14 240); --status-conflicting: oklch(.77 .16 75); --status-fails: oklch(.6 .14 25);
    --status-glyph: oklch(.145 0 0);
    /* [non-text] [cvd] */
    --group-0: oklch(.87 .06 90); --group-1: oklch(.56 .1 110); --group-2: oklch(.74 .16 120); --group-3: oklch(.84 .08 250); --group-4: oklch(.63 .18 260); --group-5: oklch(.61 .2 350);
    /* [text] */
    --band-0: oklch(.235 .022 30); --band-1: oklch(.235 .022 100); --band-2: oklch(.235 .022 170);
  }
}
/* The frame every paperwork page shares: the base type, the crumbs at the top left and the tools at the top right; it reads page-tokens.css. */
* { box-sizing: border-box; border-color: var(--border); }
body { background: var(--canvas); color: var(--foreground); font: 14px/20px ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; -webkit-font-smoothing: antialiased; word-break: keep-all; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
kbd { display: inline-flex; align-items: center; justify-content: center; height: 20px; min-width: 20px; padding: 0 4px; border-radius: 6px; background: var(--muted); color: var(--muted-foreground); font: 500 12px/1 ui-sans-serif, system-ui, sans-serif; }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
.bar { position: fixed; z-index: 20; display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 4px; border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklab, var(--background) 86%, transparent); backdrop-filter: blur(10px); box-shadow: var(--shadow-sm); }
#crumbs { left: 16px; top: 16px; gap: 8px; padding: 0 12px; color: var(--muted-foreground); max-width: 60vw; white-space: nowrap; }
#crumbs > button { border: 0; background: none; padding: 0; cursor: pointer; color: inherit; transition: color .15s var(--ease); }
#crumbs > button:hover { color: var(--foreground); }
#crumbs [aria-current] { color: var(--foreground); font-weight: 500; }
#crumbs .sep { color: var(--muted-foreground); }
#tools { right: 16px; top: 16px; }
.tool { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-weight: 500; white-space: nowrap; transition: background-color .15s var(--ease), transform .25s var(--spring); }
.tool:hover { background: var(--accent); }
.tool:active { transform: scale(.96); }
.tool:focus-visible, #crumbs > button:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 6px; }
.tool.quiet { color: var(--muted-foreground); font-weight: 400; }
.tool.icon { width: 28px; padding: 0; justify-content: center; }
.tool:disabled { opacity: .35; pointer-events: none; }
#crumbs .claims { margin-left: -4px; }
/* The record card, the claims' badges and the note over it; it reads page-tokens.css. */
.claims { display: inline-flex; gap: 2px; margin-left: 4px; vertical-align: middle; }
.claims > .claim { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 16px; padding: 0 4px; border: 0; background: var(--status-holds); color: var(--status-glyph); box-shadow: 0 0 0 2px var(--canvas); font: 600 11px/16px ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em; cursor: pointer; transition: transform .15s var(--ease); }
.claims > .claim:hover { transform: scale(1.12); }
.claims > .claim:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--canvas), var(--focus); }
.claims > [data-kind="guarantee"] { border-radius: 2px; }
.claims > [data-kind="assumption"] { border-radius: 9999px; }
.claims > [data-status="unknown"] { background: var(--status-unknown); }
.claims > [data-status="conflicting"] { background: var(--status-conflicting); }
.claims > [data-status="fails"] { background: var(--status-fails); }
#card { position: fixed; z-index: 30; width: 400px; overflow: hidden; overflow-wrap: anywhere; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--popover); box-shadow: var(--shadow-md); opacity: 0; transform: translateY(6px) scale(.97); pointer-events: none; transition: opacity .16s var(--ease), transform .24s var(--spring); }
#card.kept { box-shadow: var(--shadow-lg); }
#card.long { overflow-y: auto; }
#card.long footer { position: sticky; bottom: -12px; background: var(--popover); }
#card.show { opacity: 1; transform: none; pointer-events: auto; }
#card h2 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; }
#card .tag { display: inline-flex; margin: 0 4px 4px 0; padding: 2px 8px; border: 1px solid var(--border); border-radius: 9999px; font-size: 12px; line-height: 16px; font-weight: 500; }
#card .tag.fill { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
#card dl { margin: 16px 0 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
#card dt { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--muted-foreground); }
#card dd { margin: 2px 0 0; word-break: keep-all; }
#card ul { margin: 0; padding-left: 16px; }
#card table { width: 100%; border-collapse: collapse; font-size: 12px; line-height: 16px; }
#card th { text-align: left; font-weight: 500; min-width: 48px; color: var(--muted-foreground); } #card th, #card td { padding: 4px 8px 4px 0; border: 0; vertical-align: top; }
#card tbody tr { transition: background-color .15s var(--ease); } #card tbody tr:hover { background: color-mix(in oklab, var(--muted) 60%, transparent); }
#card pre, #card code { background: var(--muted); border-radius: 6px; font-size: 12px; } #card pre { margin: 0; padding: 4px 8px; white-space: pre-wrap; } #card code { padding: 0 4px; }
#card pre code { padding: 0; background: none; }
#card footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--border); color: var(--muted-foreground); font-size: 12px; line-height: 16px; white-space: nowrap; }
#card footer .hints { display: inline-flex; gap: 12px; margin-left: auto; } #card footer .hints span { display: inline-flex; align-items: center; gap: 4px; }
#card .turn { height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; font-size: 12px; font-weight: 500; cursor: pointer; transition: background-color .15s var(--ease); }
#card .turn:hover { background: var(--accent); }
#card .ref { padding: 0 4px; border-radius: 4px; background: color-mix(in oklab, var(--mark) 12%, transparent); cursor: default; transition: background-color .15s var(--ease); }
#card .ref:hover { background: color-mix(in oklab, var(--mark) 24%, transparent); }
#card .term { font-style: normal; text-decoration: underline dotted color-mix(in oklab, var(--foreground) 45%, transparent); text-underline-offset: 3px; cursor: help; outline: none; }
#card .badge { display: inline-flex; padding: 0 6px; border: 1px solid transparent; border-radius: 9999px; font-size: 11px; line-height: 16px; font-weight: 500; vertical-align: 1px; }
#card .badge.guess { background: var(--muted); color: var(--foreground); border-color: var(--frame); }
#card .badge.unknown { background: var(--status-unknown); color: var(--status-glyph); } #card .badge.conflicting { background: var(--status-conflicting); color: var(--status-glyph); }
#card .badge.fails { background: var(--status-fails); color: var(--status-glyph); }
#card .tag.badge { margin: 6px 6px 0 0; padding: 2px 8px; font-size: 12px; vertical-align: baseline; }
#card .cite { background: transparent; color: var(--foreground); cursor: pointer; font-family: inherit; }
#card .cite:hover { background: var(--accent); }
#card pre.fence { margin: 4px 0; overflow-x: auto; white-space: pre; }
#card math { font-size: 1.05em; }
#card math[display="block"] { margin: 6px 0; text-align: center; }
#gloss { position: fixed; z-index: 31; max-width: 360px; padding: 8px 10px; border: 1px solid var(--border); border-radius: calc(var(--radius) * .8); background: var(--popover); box-shadow: var(--shadow-lg); font-size: 12px; line-height: 16px; opacity: 0; pointer-events: none; transition: opacity .12s var(--ease); }
#gloss.show { opacity: 1; pointer-events: auto; }
#gloss p { margin: 2px 0 0; } #gloss .source + .source { margin-top: 8px; }
#gloss code { padding: 1px 4px; border-radius: 6px; background: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
#gloss blockquote { margin: 4px 0 0; padding-left: 8px; border-left: 2px solid var(--border); color: var(--muted-foreground); }
@media (prefers-reduced-motion: reduce) {
  #card { transform: none !important; }
}
/* The search palette over a veil; it reads the page's theme variables. */
#veil { position: fixed; inset: 0; z-index: 40; background: var(--veil); opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); }
#veil.show { opacity: 1; pointer-events: auto; }
#palette { position: fixed; z-index: 41; left: 50%; top: 18vh; width: min(512px, calc(100vw - 32px)); border: 1px solid var(--border); border-radius: var(--radius); background: var(--popover); box-shadow: var(--shadow-lg); overflow: hidden; opacity: 0; transform: translate(-50%, -8px) scale(.96); pointer-events: none; transition: opacity .18s var(--ease), transform .28s var(--spring); }
#palette.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#field { display: flex; align-items: center; gap: 8px; padding-right: 8px; border-bottom: 1px solid var(--border); }
#palette input { flex: 1; min-width: 0; height: 48px; padding: 0 16px; border: 0; background: transparent; color: inherit; font: inherit; outline: none; }
#regex { width: 32px; font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -.02em; }
#regex[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); }
#palette input::placeholder { color: var(--muted-foreground); }
#hits { max-height: 360px; overflow-y: auto; padding: 4px; }
#hits h3 { margin: 0; padding: 8px 12px 4px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--muted-foreground); }
#hits .hit { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: background-color .12s var(--ease); }
#hits .hit[aria-selected="true"] { background: var(--accent); }
#hits .hit .text { flex: 1; min-width: 0; }
#hits .hit .text > b { font-weight: 500; overflow-wrap: anywhere; }
#hits .hit .where { margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--muted-foreground); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
#hits .hit .where i { font-style: normal; font-weight: 500; color: var(--foreground); }
#hits mark { background: color-mix(in oklab, var(--mark) 18%, transparent); color: var(--foreground); font-weight: 600; border-radius: 2px; box-shadow: 0 1px 0 color-mix(in oklab, var(--mark) 70%, transparent); }
#keys { display: flex; justify-content: flex-end; gap: 12px; height: 40px; align-items: center; padding: 0 16px; border-top: 1px solid var(--border); color: var(--muted-foreground); font-size: 12px; }
#keys span { display: inline-flex; align-items: center; gap: 4px; }
#hits .hit small { margin-left: 8px; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }
#hits .hit .clock { display: inline-flex; color: var(--muted-foreground); }
#hits .hit .recent { color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } #hits .hit .recent b { font-weight: 600; color: var(--foreground); }
#hits .hit .forget { width: 24px; height: 24px; color: var(--muted-foreground); }
#hits .hit + h3 { margin-top: 24px; }
#hits .none { display: flex; flex-direction: column; gap: 4px; padding: 24px; text-align: center; color: var(--muted-foreground); }
#hits .none b { font-weight: 500; color: var(--foreground); overflow-wrap: anywhere; }
#hits .none.error b { color: var(--destructive); }
@media (prefers-reduced-motion: reduce) {
  #palette { transform: translate(-50%, 0) !important; }
}
</style>
<script>
// The record card of a paperwork page with its badges: a record's rows drawn as prose with its quotes, formulas, named records, terms and
// guesses, paged to the room beside the record, and the note over the card that a term or the sources raise. A page calls
// `paperworkCard(options)` once its `#card` and `#gloss` exist; each option is a function it answers from its own records:
//   make(name, attributes, ...children)  the element maker
//   record(id)       { kind, record } of a record, or nothing
//   terms()          the contract's terms; sources() its sources; claimsOn(id) the claims on a record, each drawn as a badge
//   formulas         the MathML of each formula, by `$tex` or `$$tex`
//   rows(id)         the card's rows, each [name, form, data]
//   place(id, w, h)  { left, top, cost, tied } where a card that big rests, `tied` what it still covers
//   kept(id)         whether the card is kept open
//   light(id)        mark in the drawing the record a chip names, or nothing for null
//   follow(id, event) a click on a chip or a badge: true when the page moved for it, so the card does nothing more
window.paperworkCard = options => {
  "use strict";
  const { make, formulas } = options;
  const $ = id => document.getElementById(id);
  let termsFrom = null, patterns = [];
  const terms = () => { // each term's pattern, made again only when the contract's terms change
    const list = options.terms() || [];
    if (list === termsFrom) return patterns;
    termsFrom = list;
    patterns = list.map(entry => ({ entry, pattern: new RegExp(String.raw`(?<![\p{L}\p{N}./-])` + entry.term.trim().split(/\s+/).map(word => word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join(String.raw`\s+`)
      + (/[가-힣]$/.test(entry.term) ? "" : String.raw`(?:e?s)?(?![\p{L}\p{N}-]|[./][\p{L}\p{N}])`), "iu") })); // a Korean term takes a particle after it; a file name is no term
    return patterns;
  };
  const label = id => options.record(id) ? (options.record(id).record.label || options.record(id).record.title || id) : id;
  // a quote, a formula or a named record in a text; the formula's pattern is tex_mathml.py's, which make-page.py drew each one by
  const MARKS = /(```[\s\S]*?```|`[^`]+`)|\$\$([^$`]+?)\$\$|\$(?!\{[A-Z_]+\})([^\s$`](?:[^$`]*?[^\s$`])?)\$(?!\d)|\{([a-z0-9-]+)\}/g;
  const words = text => String(text).replace(MARKS, (whole, quote, block, inline, id) => (id && options.record(id) ? label(id) : whole));
  const bare = text => words(text).replace(/`([^`]+)`/g, "$1"); // text drawn where no code face can show, such as a tooltip, keeps a code span's words without its marks
  const tagName = tag => String(tag).replace(/[A-Z]/g, letter => " " + letter.toLowerCase()); // a tag's id as the words it joins
  const status = claim => claim.status || "holds"; // a claim that names no status holds
  const GLYPHS = { holds: "✓", unknown: "?", conflicting: "!", fails: "✗" }, INITIALS = { guarantee: "G", assumption: "A" }; // a badge's status and kind as text, so it reads without its colour, and its kind as its shape too
  const badges = id => { // a badge per claim on a record, each opening its claim's card
    const claims = options.claimsOn(id);
    if (!claims.length) return null;
    return make("span", { class: "claims", "data-for": id }, ...claims.map(claim => {
      const faulted = status(claim) === "holds" && !!claim.fault, said = `${claim.kind} ${claim.title || claim.id}: ${status(claim)}${faulted ? ", with a fault" : ""}`;
      return make("button", { class: "claim", type: "button", "data-claim": claim.id, "data-kind": claim.kind, "data-status": status(claim), "data-fault": faulted ? "" : null, "aria-label": said, title: said },
        INITIALS[claim.kind] + GLYPHS[status(claim)] + (faulted ? "*" : ""));
    }));
  };
  const claimRows = id => options.claimsOn(id).length ? [["claims", "list", options.claimsOn(id).map(claim => `{${claim.id}}`)]] : []; // a card's row of the claims its record's badges open
  const quoted = text => words(text).split(/(`[^`]+`)/).filter(Boolean).map(part => part[0] === "`" ? make("em", {}, part.slice(1, -1)) : part); // a code span inside code has no code face to take, so it reads as a literal term
  let glossed = new Set(); // the terms the card has marked, each at its first match only
  const spoken = piece => { // a run of prose: a `(guess)` as a badge, and the first match of each term the card has not marked as a term
    const guess = piece.search(/\(guess\)/i);
    let first = null;
    for (const one of terms()) if (!glossed.has(one.entry.term)) { const found = one.pattern.exec(piece); if (found && (!first || found.index < first.found.index)) first = { one, found }; }
    if (guess >= 0 && (!first || guess < first.found.index)) return [...spoken(piece.slice(0, guess)), make("span", { class: "badge guess" }, "guess"), ...spoken(piece.slice(guess + 7))];
    if (!first) return piece ? [piece] : [];
    glossed.add(first.one.entry.term);
    const { index } = first.found, text = first.found[0];
    return [...spoken(piece.slice(0, index)), make("dfn", { class: "term", tabindex: "0", "data-term": first.one.entry.term, "data-meaning": first.one.entry.meaning }, text), ...spoken(piece.slice(index + text.length))];
  };
  const literal = quote => { // a fence as a block that keeps its lines, its first line's language word left out; a span as inline code, broken after each slash
    if (quote.startsWith("```")) return make("pre", { class: "fence" }, make("code", {}, quote.slice(3, -3).replace(/^[\w+-]*\n/, "").replace(/\n$/, "")));
    return make("code", {}, ...quote.slice(1, -1).split(/(?<=\/)/).flatMap((piece, i) => i ? [make("wbr"), piece] : [piece]));
  };
  const formula = (tex, display) => { // the MathML make-page.py drew, or the TeX as code where it drew none
    const markup = formulas[(display ? "$$" : "$") + tex];
    if (!markup) return make("code", {}, tex);
    const holder = document.createElement("template");
    holder.innerHTML = markup;
    return holder.content.firstChild;
  };
  const prose = (text, plain = false) => { // a text with its quotes, formulas, named records, terms and guesses drawn; PLAIN, for a text outside a card's rows, draws names as words and marks no term or guess
    const all = String(text), out = [];
    let last = 0;
    for (const found of all.matchAll(MARKS)) {
      const [whole, quote, block, inline, id] = found;
      if (id && !options.record(id)) continue;
      out.push(...(plain ? [all.slice(last, found.index)].filter(Boolean) : spoken(all.slice(last, found.index))));
      last = found.index + whole.length;
      if (quote) out.push(literal(quote));
      else if (id && plain) out.push(label(id));
      else if (id) out.push(make("span", { class: "ref", "data-ref": id }, label(id)));
      else out.push(formula(block || inline, !!block));
    }
    return out.concat(plain ? [all.slice(last)].filter(Boolean) : spoken(all.slice(last)));

  }

  function drawStatus() {
    bar.querySelector(".state").textContent = `${connection} · ${pending.length} pending` + (unsent.length ? `, ${unsent.length} not sent` : "");
    bar.querySelector(".export").hidden = served && !unsent.length;
  }

  function draw() {
    if (!ui) return;
    placeBadges();
    drawPanel();
    drawStatus();
  }

  function exportChanges() {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([JSON.stringify(served ? unsent : window.relayChanges, null, 2)], { type: "application/json" }));
    link.download = "changes.json";
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }

  function start() {
    const style = document.createElement("style");
    style.textContent = `
      #relay-ui { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 2147483000; font: 13px sans-serif; }
      #relay-ui .layer button { position: absolute; font: 12px sans-serif; border: 1px solid #345; border-radius: 10px; background: #fff; cursor: pointer; padding: 1px 6px; }
      #relay-ui aside { position: fixed; right: 0; top: 0; bottom: 0; width: 340px; background: #fff; border-left: 1px solid #bbb; padding: 12px; overflow: auto; box-shadow: -2px 0 8px #0002; }
      #relay-ui aside[hidden] { display: none; }
      #relay-ui header { display: flex; justify-content: space-between; align-items: center; }
      #relay-ui ol { list-style: none; padding-left: 0; }
      #relay-ui ol ol { padding-left: 14px; border-left: 2px solid #ddd; }
      #relay-ui li { margin: 6px 0; }
      #relay-ui li[data-by=session] > b { color: #276; }
      #relay-ui li.waiting { background: #fff3c4; }
      #relay-ui .meta { color: #777; font-size: 12px; }
      #relay-ui textarea { width: 100%; box-sizing: border-box; }
      #relay-ui .bar { position: fixed; left: 8px; bottom: 8px; background: #fff; border: 1px solid #345; border-radius: 8px; padding: 4px 8px; display: flex; gap: 8px; align-items: center; }
    `;
    document.head.appendChild(style);
    ui = document.createElement("div");
    ui.id = "relay-ui";
    ui.innerHTML = "<div class=layer></div><aside hidden></aside><div class=bar><span class=state></span></div>";
    layer = ui.querySelector(".layer");
    panel = ui.querySelector("aside");
    bar = ui.querySelector(".bar");
    document.body.appendChild(ui);
    const button = document.createElement("button");
    button.type = "button";
    button.className = "export";
    button.textContent = "Export changes";
    button.addEventListener("click", exportChanges);
    bar.appendChild(button);
    if (typeof window.pageRender === "function") {
      try { window.pageRender(window.pageData); } catch (error) { console.error("relay: pageRender failed", error); }
    }
    let scheduled = false;
    const later = () => {
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(() => { scheduled = false; placeBadges(); });
    };
    new MutationObserver((records) => { if (records.some((record) => !ui.contains(record.target))) later(); })
      .observe(document.body, { childList: true, subtree: true, attributes: true, characterData: true });
    addEventListener("resize", later);
    draw();
    if (!served) return;
    if (!window.EventSource) return flush();
    const events = new EventSource(api("api/events"));
    // each connect reads the queue again, since an ack while the stream was down sends no `changes` event
    events.addEventListener("open", () => { connection = "server connected"; flush(); });
    events.addEventListener("error", () => { connection = "server not reachable"; drawStatus(); });
    events.addEventListener("reload", () => location.reload());
    events.addEventListener("changes", loadPending);
  }

  const safeStart = () => { try { start(); } catch (error) { console.error("relay: runtime failed", error); } };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", safeStart);
  else safeStart();
})();
</script>
<!-- /relay runtime -->
</body>
</html>
