<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release plan</title>
<!-- page frame -->
<style>
/* Every colour a paperwork page draws, light and dark, and every space and type size it sets, each with its source. A page's other
   style names these, mixes a colour only with another or with transparent, and scales a size only by the page's own zoom.
   Sources:
   [neutral]  shadcn/ui's neutral theme, https://ui.shadcn.com/docs/theming
   [text]     WCAG 2.2 1.4.3, text at 4.5:1 or more against what is behind it, https://www.w3.org/TR/WCAG22/#contrast-minimum
   [non-text] WCAG 2.2 1.4.11, a badge, line or frame at 3:1 or more, https://www.w3.org/TR/WCAG22/#non-text-contrast
   [colour]   WCAG 2.2 1.4.1, colour never the only sign; a badge also says its status by glyph and its kind by shape, https://www.w3.org/TR/WCAG22/#use-of-color
   [status]   IEC 60073's indicator colours: green normal, amber abnormal, red fault; an unsettled one blue-grey
   [cvd]      at least 0.1 apart in OKLab (https://bottosson.github.io/posts/oklab/) within its set, as seen and under protanopia, deuteranopia
              and tritanopia simulated by Machado, Oliveira and Fernandes 2009 at severity 1, https://doi.org/10.1109/TVCG.2009.113
   [space]    IBM Carbon's spacing scale, https://carbondesignsystem.com/elements/spacing/overview/
   [type]     IBM Carbon's type scale and the line heights of its type sets, https://carbondesignsystem.com/elements/typography/type-sets/ */
:root {
  color-scheme: light dark;
  --radius: .625rem; --ease: cubic-bezier(.45, 0, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
  /* [space] a margin, padding or gap */
  --spacing-01: 2px; --spacing-02: 4px; --spacing-03: 8px; --spacing-04: 12px; --spacing-05: 16px; --spacing-06: 24px; --spacing-10: 64px;
  /* [type] a font size, and a line height set in px */
  --type-01: 12px; --type-02: 14px; --type-05: 20px;
  --leading-01: 16px; --leading-02: 18px; --leading-03: 20px; --leading-04: 22px; --leading-05: 24px; --leading-06: 28px;
  /* [neutral] [text] */
  --background: oklch(1 0 0); --foreground: oklch(.145 0 0); --popover: oklch(1 0 0); --card: oklch(1 0 0); --canvas: oklch(.985 0 0);
  --primary: oklch(.205 0 0); --primary-foreground: oklch(.985 0 0); --muted: oklch(.97 0 0); --muted-foreground: oklch(.52 0 0); --accent: oklch(.97 0 0);
  --destructive: oklch(.53 .19 27);
  /* [neutral] a hairline of the page's chrome, which no reader needs to see the drawing */
  --border: oklch(.922 0 0); --ring: oklch(.708 0 0); --veil: oklch(0 0 0 / 50%);
  --shadow-sm: 0 1px 3px 0 oklch(0 0 0 / 10%), 0 1px 2px -1px oklch(0 0 0 / 10%);
  --shadow-md: 0 4px 6px -1px oklch(0 0 0 / 10%), 0 2px 4px -2px oklch(0 0 0 / 10%);
  --shadow-lg: 0 10px 15px -3px oklch(0 0 0 / 10%), 0 4px 6px -4px oklch(0 0 0 / 10%);
  --focus: 0 0 0 3px color-mix(in oklab, var(--ring) 50%, transparent);
  /* [non-text] a frame or line of the drawing; the mark, what a search or a step points at */
  --frame: oklch(.6 0 0); --line: oklch(.45 0 0); --mark: oklch(.55 .2 259);
  /* [status] [non-text] [colour] [cvd] a badge's fill by its claim's status, and its glyph */
  --status-holds: oklch(.55 .12 135); --status-unknown: oklch(.45 .06 290); --status-conflicting: oklch(.43 .1 50); --status-fails: oklch(.3 .12 20);
  --status-glyph: oklch(1 0 0);
  /* [non-text] [cvd] an area's colour, taken in turn so neighbours differ; its fill mixes it into the canvas */
  --group-0: oklch(.49 .1 50); --group-1: oklch(.6 .12 100); --group-2: oklch(.3 .16 270); --group-3: oklch(.47 .16 270); --group-4: oklch(.31 .1 350); --group-5: oklch(.61 .18 350);
  /* [text] a lane's or phase's tint, three in turn 70 degrees apart and 45 or more from the mark, faint enough for text at 4.5:1 */
  --band-0: oklch(.955 .024 30); --band-1: oklch(.955 .024 100); --band-2: oklch(.955 .024 170);
}
@media (prefers-color-scheme: dark) {
  :root {
    /* [neutral] [text] */
    --background: oklch(.145 0 0); --foreground: oklch(.985 0 0); --popover: oklch(.205 0 0); --card: oklch(.205 0 0); --canvas: oklch(.17 0 0);
    --primary: oklch(.922 0 0); --primary-foreground: oklch(.205 0 0); --muted: oklch(.269 0 0); --muted-foreground: oklch(.708 0 0); --accent: oklch(.269 0 0);
    --destructive: oklch(.72 .15 22);
    --border: oklch(1 0 0 / 14%); --ring: oklch(.556 0 0);
    /* [non-text] */
    --frame: oklch(.58 0 0); --line: oklch(.75 0 0); --mark: oklch(.7 .16 259);
    /* [status] [non-text] [colour] [cvd] */
    --status-holds: oklch(.91 .1 150); --status-unknown: oklch(.71 .14 240); --status-conflicting: oklch(.77 .16 75); --status-fails: oklch(.6 .14 25);
    --status-glyph: oklch(.145 0 0);
    /* [non-text] [cvd] */
    --group-0: oklch(.87 .06 90); --group-1: oklch(.56 .1 110); --group-2: oklch(.74 .16 120); --group-3: oklch(.84 .08 250); --group-4: oklch(.63 .18 260); --group-5: oklch(.61 .2 350);
    /* [text] */
    --band-0: oklch(.235 .022 30); --band-1: oklch(.235 .022 100); --band-2: oklch(.235 .022 170);
  }
}
/* The frame every paperwork page shares: the base type, the crumbs at the top left and the tools at the top right; it reads page-tokens.css. */
* { box-sizing: border-box; border-color: var(--border); }
body { background: var(--canvas); color: var(--foreground); font: var(--type-02)/var(--leading-03) ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; -webkit-font-smoothing: antialiased; word-break: keep-all; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
kbd { display: inline-flex; align-items: center; justify-content: center; height: 20px; min-width: 20px; padding: 0 var(--spacing-02); border-radius: 6px; background: var(--muted); color: var(--muted-foreground); font: 500 var(--type-01)/1 ui-sans-serif, system-ui, sans-serif; }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
.bar { position: fixed; z-index: 20; display: flex; align-items: center; gap: var(--spacing-02); height: 36px; padding: 0 var(--spacing-02); border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in oklab, var(--background) 86%, transparent); backdrop-filter: blur(10px); box-shadow: var(--shadow-sm); }
#crumbs { left: 16px; top: 16px; gap: var(--spacing-03); padding: 0 var(--spacing-04); color: var(--muted-foreground); max-width: 60vw; white-space: nowrap; }
#crumbs > button { border: 0; background: none; padding: 0; cursor: pointer; color: inherit; transition: color .15s var(--ease); }
#crumbs > button:hover { color: var(--foreground); }
#crumbs [aria-current] { color: var(--foreground); font-weight: 500; }
#crumbs .sep { color: var(--muted-foreground); }
#tools { right: 16px; top: 16px; }
.tool { display: inline-flex; align-items: center; gap: var(--spacing-03); height: 28px; padding: 0 var(--spacing-03); border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-weight: 500; white-space: nowrap; transition: background-color .15s var(--ease), transform .25s var(--spring); }
.tool:hover { background: var(--accent); }
.tool:active { transform: scale(.96); }
.tool:focus-visible, #crumbs > button:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 6px; }
.tool.quiet { color: var(--muted-foreground); font-weight: 400; }
.tool.icon { width: 28px; padding: 0; justify-content: center; }
.tool:disabled { opacity: .35; pointer-events: none; }
#crumbs .claims { margin-left: calc(-1 * var(--spacing-02)); }
/* The record card, the claims' badges and the note over it; it reads page-tokens.css. */
.claims { display: inline-flex; gap: var(--spacing-01); margin-left: var(--spacing-02); vertical-align: middle; }
.claims > .claim { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 16px; padding: 0 var(--spacing-02); border: 0; background: var(--status-holds); color: var(--status-glyph); box-shadow: 0 0 0 2px var(--canvas); font: 600 var(--type-01)/var(--leading-01) ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em; cursor: pointer; transition: transform .15s var(--ease); }
.claims > .claim:hover { transform: scale(1.12); }
.claims > .claim:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--canvas), var(--focus); }
.claims > [data-kind="guarantee"] { border-radius: 2px; }
.claims > [data-kind="assumption"] { border-radius: 9999px; }
.claims > [data-status="unknown"] { background: var(--status-unknown); }
.claims > [data-status="conflicting"] { background: var(--status-conflicting); }
.claims > [data-status="fails"] { background: var(--status-fails); }
#card { position: fixed; z-index: 30; width: 400px; overflow: hidden; overflow-wrap: anywhere; padding: var(--spacing-04) var(--spacing-05); border: 1px solid var(--border); border-radius: var(--radius); background: var(--popover); box-shadow: var(--shadow-md); opacity: 0; transform: translateY(6px) scale(.97); pointer-events: none; transition: opacity .16s var(--ease), transform .24s var(--spring); }
#card.kept { box-shadow: var(--shadow-lg); }
#card.long { overflow-y: auto; }
#card.long footer { position: sticky; bottom: -12px; background: var(--popover); }
#card.show { opacity: 1; transform: none; pointer-events: auto; }
#card h2 { margin: 0; font-size: var(--type-02); line-height: var(--leading-03); font-weight: 600; }
#card .tag { display: inline-flex; margin: 0 var(--spacing-02) var(--spacing-02) 0; padding: var(--spacing-01) var(--spacing-03); border: 1px solid var(--border); border-radius: 9999px; font-size: var(--type-01); line-height: var(--leading-01); font-weight: 500; }
#card .tag.fill { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
#card dl { margin: var(--spacing-05) 0 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--spacing-03); }
#card dt { font-size: var(--type-01); line-height: var(--leading-01); font-weight: 500; color: var(--muted-foreground); }
#card dd { margin: var(--spacing-01) 0 0; word-break: keep-all; }
#card ul { margin: 0; padding-left: var(--spacing-05); }
#card table { width: 100%; border-collapse: collapse; font-size: var(--type-01); line-height: var(--leading-01); }
#card th { text-align: left; font-weight: 500; min-width: 48px; color: var(--muted-foreground); } #card th, #card td { padding: var(--spacing-02) var(--spacing-03) var(--spacing-02) 0; border: 0; vertical-align: top; }
#card tbody tr { transition: background-color .15s var(--ease); } #card tbody tr:hover { background: color-mix(in oklab, var(--muted) 60%, transparent); }
#card pre, #card code { background: var(--muted); border-radius: 6px; font-size: var(--type-01); } #card pre { margin: 0; padding: var(--spacing-02) var(--spacing-03); white-space: pre-wrap; } #card code { padding: 0 var(--spacing-02); }
#card pre code { padding: 0; background: none; }
#card footer { display: flex; justify-content: space-between; align-items: center; gap: var(--spacing-04); margin-top: var(--spacing-04); padding-top: var(--spacing-03); border-top: 1px solid var(--border); color: var(--muted-foreground); font-size: var(--type-01); line-height: var(--leading-01); white-space: nowrap; }
#card footer .hints { display: inline-flex; gap: var(--spacing-04); margin-left: auto; } #card footer .hints span { display: inline-flex; align-items: center; gap: var(--spacing-02); }
#card .turn { height: 24px; padding: 0 var(--spacing-03); border: 1px solid var(--border); border-radius: 6px; background: transparent; font-size: var(--type-01); font-weight: 500; cursor: pointer; transition: background-color .15s var(--ease); }
#card .turn:hover { background: var(--accent); }
#card .ref { padding: 0 var(--spacing-02); border-radius: 4px; background: color-mix(in oklab, var(--mark) 12%, transparent); cursor: default; transition: background-color .15s var(--ease); }
#card .ref:hover { background: color-mix(in oklab, var(--mark) 24%, transparent); }
#card .term { font-style: normal; text-decoration: underline dotted color-mix(in oklab, var(--foreground) 45%, transparent); text-underline-offset: 3px; cursor: help; outline: none; }
#card .badge { display: inline-flex; padding: 0 var(--spacing-03); border: 1px solid transparent; border-radius: 9999px; font-size: var(--type-01); line-height: var(--leading-01); font-weight: 500; vertical-align: 1px; }
#card .badge.guess { background: var(--muted); color: var(--foreground); border-color: var(--frame); }
#card .badge.unknown { background: var(--status-unknown); color: var(--status-glyph); } #card .badge.conflicting { background: var(--status-conflicting); color: var(--status-glyph); }
#card .badge.fails { background: var(--status-fails); color: var(--status-glyph); }
#card .tag.badge { margin: var(--spacing-03) var(--spacing-03) 0 0; padding: var(--spacing-01) var(--spacing-03); font-size: var(--type-01); vertical-align: baseline; }
#card .cite { background: transparent; color: var(--foreground); cursor: pointer; font-family: inherit; }
#card .cite:hover { background: var(--accent); }
#card pre.fence { margin: var(--spacing-02) 0; overflow-x: auto; white-space: pre; }
#card math[display="block"] { margin: var(--spacing-03) 0; text-align: center; }
#gloss { position: fixed; z-index: 31; max-width: 360px; padding: var(--spacing-03) var(--spacing-04); border: 1px solid var(--border); border-radius: calc(var(--radius) * .8); background: var(--popover); box-shadow: var(--shadow-lg); font-size: var(--type-01); line-height: var(--leading-01); opacity: 0; pointer-events: none; transition: opacity .12s var(--ease); }
#gloss.show { opacity: 1; pointer-events: auto; }
#gloss p { margin: var(--spacing-01) 0 0; } #gloss .source + .source { margin-top: var(--spacing-03); }
#gloss code { padding: var(--spacing-01) var(--spacing-02); border-radius: 6px; background: var(--muted); font-size: var(--type-01); overflow-wrap: anywhere; }
#gloss blockquote { margin: var(--spacing-02) 0 0; padding-left: var(--spacing-03); border-left: 2px solid var(--border); color: var(--muted-foreground); }
@media (prefers-reduced-motion: reduce) {
  #card { transform: none !important; }
}
/* The search palette over a veil; it reads the page's theme variables. */
#veil { position: fixed; inset: 0; z-index: 40; background: var(--veil); opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); }
#veil.show { opacity: 1; pointer-events: auto; }
#palette { position: fixed; z-index: 41; left: 50%; top: 18vh; width: min(512px, calc(100vw - 32px)); border: 1px solid var(--border); border-radius: var(--radius); background: var(--popover); box-shadow: var(--shadow-lg); overflow: hidden; opacity: 0; transform: translate(-50%, -8px) scale(.96); pointer-events: none; transition: opacity .18s var(--ease), transform .28s var(--spring); }
#palette.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#field { display: flex; align-items: center; gap: var(--spacing-03); padding-right: var(--spacing-03); border-bottom: 1px solid var(--border); }
#palette input { flex: 1; min-width: 0; height: 48px; padding: 0 var(--spacing-05); border: 0; background: transparent; color: inherit; font: inherit; outline: none; }
#regex { width: 32px; font: 600 var(--type-02)/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -.02em; }
#regex[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); }
#palette input::placeholder { color: var(--muted-foreground); }
#hits { max-height: 360px; overflow-y: auto; padding: var(--spacing-02); }
#hits h3 { margin: 0; padding: var(--spacing-03) var(--spacing-04) var(--spacing-02); font-size: var(--type-01); line-height: var(--leading-01); font-weight: 500; color: var(--muted-foreground); }
#hits .hit { display: flex; align-items: center; gap: var(--spacing-03); padding: var(--spacing-03) var(--spacing-04); border-radius: 6px; cursor: pointer; transition: background-color .12s var(--ease); }
#hits .hit[aria-selected="true"] { background: var(--accent); }
#hits .hit .text { flex: 1; min-width: 0; }
#hits .hit .text > b { font-weight: 500; overflow-wrap: anywhere; }
#hits .hit .where { margin-top: var(--spacing-01); font-size: var(--type-01); line-height: var(--leading-01); color: var(--muted-foreground); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
#hits .hit .where i { font-style: normal; font-weight: 500; color: var(--foreground); }
#hits mark { background: color-mix(in oklab, var(--mark) 18%, transparent); color: var(--foreground); font-weight: 600; border-radius: 2px; box-shadow: 0 1px 0 color-mix(in oklab, var(--mark) 70%, transparent); }
#keys { display: flex; justify-content: flex-end; gap: var(--spacing-04); height: 40px; align-items: center; padding: 0 var(--spacing-05); border-top: 1px solid var(--border); color: var(--muted-foreground); font-size: var(--type-01); }
#keys span { display: inline-flex; align-items: center; gap: var(--spacing-02); }
#hits .hit small { margin-left: var(--spacing-03); font-size: var(--type-01); color: var(--muted-foreground); white-space: nowrap; }
#hits .hit .clock { display: inline-flex; color: var(--muted-foreground); }
#hits .hit .recent { color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } #hits .hit .recent b { font-weight: 600; color: var(--foreground); }
#hits .hit .forget { width: 24px; height: 24px; color: var(--muted-foreground); }
#hits .hit + h3 { margin-top: var(--spacing-06); }
#hits .none { display: flex; flex-direction: column; gap: var(--spacing-02); padding: var(--spacing-06); text-align: center; color: var(--muted-foreground); }
#hits .none b { font-weight: 500; color: var(--foreground); overflow-wrap: anywhere; }
#hits .none.error b { color: var(--destructive); }
@media (prefers-reduced-motion: reduce) {
  #palette { transform: translate(-50%, 0) !important; }
}
</style>
<script>
// The record card of a paperwork page with its badges: a record's rows drawn as prose with its quotes, formulas, named records, terms and
// guesses, paged to the room beside the record, and the note over the card that a term or the sources raise. A page calls
// `paperworkCard(options)` once its `#card` and `#gloss` exist; each option is a function it answers from its own records:
//   make(name, attributes, ...children)  the element maker
//   record(id)       { kind, record } of a record, or nothing
//   terms()          the contract's terms; sources() its sources; claimsOn(id) the claims on a record, each drawn as a badge
//   formulas         the MathML of each formula, by `$tex` or `$$tex`
//   rows(id)         the card's rows, each [name, form, data]
//   place(id, w, h)  { left, top, cost, tied } where a card that big rests, `tied` what it still covers
//   kept(id)         whether the card is kept open
//   light(id)        mark in the drawing the record a chip names, or nothing for null
//   follow(id, event) a click on a chip or a badge: true when the page moved for it, so the card does nothing more
window.paperworkCard = options => {
  "use strict";
  const { make, formulas } = options;
  const $ = id => document.getElementById(id);
  let termsFrom = null, patterns = [];
  const terms = () => { // each term's pattern, made again only when the contract's terms change
    const list = options.terms() || [];
    if (list === termsFrom) return patterns;
    termsFrom = list;
    patterns = list.map(entry => ({ entry, pattern: new RegExp(String.raw`(?<![\p{L}\p{N}./-])` + entry.term.trim().split(/\s+/).map(word => word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join(String.raw`\s+`)
      + (/[가-힣]$/.test(entry.term) ? "" : String.raw`(?:e?s)?(?![\p{L}\p{N}-]|[./][\p{L}\p{N}])`), "iu") })); // a Korean term takes a particle after it; a file name is no term
    return patterns;
  };
  const label = id => options.record(id) ? (options.record(id).record.label || options.record(id).record.title || id) : id;
  // a quote, a formula or a named record in a text; the formula's pattern is tex_mathml.py's, which make-page.py drew each one by
  const MARKS = /(```[\s\S]*?```|`[^`]+`)|\$\$([^$`]+?)\$\$|\$(?!\{[A-Z_]+\})([^\s$`](?:[^$`]*?[^\s$`])?)\$(?!\d)|\{([a-z0-9-]+)\}/g;
  const words = text => String(text).replace(MARKS, (whole, quote, block, inline, id) => (id && options.record(id) ? label(id) : whole));
  const bare = text => words(text).replace(/`([^`]+)`/g, "$1"); // text drawn where no code face can show, such as a tooltip, keeps a code span's words without its marks
  const tagName = tag => String(tag).replace(/[A-Z]/g, letter => " " + letter.toLowerCase()); // a tag's id as the words it joins
  const status = claim => claim.status || "holds"; // a claim that names no status holds
  const GLYPHS = { holds: "✓", unknown: "?", conflicting: "!", fails: "✗" }, INITIALS = { guarantee: "G", assumption: "A" }; // a badge's status and kind as text, so it reads without its colour, and its kind as its shape too
  const badges = id => { // a badge per claim on a record, each opening its claim's card
    const claims = options.claimsOn(id);
    if (!claims.length) return null;
    return make("span", { class: "claims", "data-for": id }, ...claims.map(claim => {
      const faulted = status(claim) === "holds" && !!claim.fault, said = `${claim.kind} ${claim.title || claim.id}: ${status(claim)}${faulted ? ", with a fault" : ""}`;
      return make("button", { class: "claim", type: "button", "data-claim": claim.id, "data-kind": claim.kind, "data-status": status(claim), "data-fault": faulted ? "" : null, "aria-label": said, title: said },
        INITIALS[claim.kind] + GLYPHS[status(claim)] + (faulted ? "*" : ""));
    }));
  };
  const claimRows = id => options.claimsOn(id).length ? [["claims", "list", options.claimsOn(id).map(claim => `{${claim.id}}`)]] : []; // a card's row of the claims its record's badges open
  const quoted = text => words(text).split(/(`[^`]+`)/).filter(Boolean).map(part => part[0] === "`" ? make("em", {}, part.slice(1, -1)) : part); // a code span inside code has no code face to take, so it reads as a literal term
  let glossed = new Set(); // the terms the card has marked, each at its first match only
  const spoken = piece => { // a run of prose: a `(guess)` as a badge, and the first match of each term the card has not marked as a term
    const guess = piece.search(/\(guess\)/i);
    let first = null;
    for (const one of terms()) if (!glossed.has(one.entry.term)) { const found = one.pattern.exec(piece); if (found && (!first || found.index < first.found.index)) first = { one, found }; }

      return [Math.max(at, before), Math.max(depth, under + 1)];
    }, [-1, 0]);
    const milestones = of("milestones", level.id).map(milestone => { const [after, depth] = seat(milestone); return { milestone, after, depth }; });
    let y = TOP + headHeight + 32;
    const lineEnds = [xs[0] - PAD, xs[xs.length - 1] + PAD];
    const reach = edges.map((edge, k) => edge.from === edge.to ? xs[index[edge.from]] + 48 + labels[k] : Math.max(xs[index[edge.from]], xs[index[edge.to]])); // a self-call's name runs right of its loop
    const mark = k => {
      for (const one of milestones.filter(one => one.after === k).sort((a, b) => a.depth - b.depth)) {
        const lineY = y + 12;
        svg.append(draw("line", { class: "milestone", "data-for": one.milestone.id, x1: lineEnds[0], x2: lineEnds[1], y1: lineY, y2: lineY }));
        const label = make("div", { class: "milestone-label", "data-id": one.milestone.id }, one.milestone.label, badges(one.milestone.id));
        label.style.left = lineEnds[0] + "px"; label.style.top = lineY - 24 + "px";
        put(label);
        y += 40;
      }
    };
    mark(-1);
    for (const [k, edge] of edges.entries()) {
      for (const one of fragments.filter(one => one.first === k).sort((a, b) => a.depth - b.depth)) { one.top = y; one.guards = [[one.fragment.operands[0].guard, y]]; y += HEAD; }
      for (const one of fragments) one.starts.forEach((start, j) => { if (j && start === k) { one.guards.push([one.fragment.operands[j].guard, y]); y += HEAD; } });
      const from = xs[index[edge.from]], to = xs[index[edge.to]], arrowY = y + 24, self = from === to;
      const group = draw("g", { class: "edge" + (edge.opens ? " opens" : ""), "data-for": edge.id, "data-tag": edge.tag });
      const path = self ? `M${from},${arrowY - 8} h40 v16 h-40` : `M${from},${arrowY} H${to}`;
      group.append(draw("path", { class: "arrow", d: path, "data-tag": edge.tag }), head(self ? from : to, self ? arrowY + 8 : arrowY, self ? -1 : Math.sign(to - from)),
        draw("path", { class: "hit", d: path }));
      group.append(draw("circle", { class: "step", cx: from, cy: self ? arrowY - 8 : arrowY, r: 9 }), draw("text", { class: "step-number", x: from, y: (self ? arrowY - 8 : arrowY) + 4 }, String(k + 1)));
      svg.append(group);
      const label = edgeLabel(edge);
      const middle = self ? from + 48 : (from + to) / 2; // a self-call's parts start right of its loop, since its row may be wide
      label.style.left = middle + "px"; label.style.top = (self ? arrowY - 30 : y) + "px";
      const chips = make("div", { class: "edge-chips", "data-for": edge.id }, make("span", { class: "chip" }, tagName(edge.tag)));
      chips.style.left = middle + "px"; chips.style.top = arrowY + (self ? 14 : 6) + "px"; // below a self-call's loop too
      put(label, chips);
      if (self) [label, chips].forEach(part => part.classList.add("self"));
      const written = edgeCodes(edge);
      if (written) { written.style.left = chips.style.left; written.style.top = arrowY + (self ? 34 : 26) + "px"; written.classList.toggle("self", self); put(written); }
      const owed = edgeWork(edge);
      if (owed) { owed.style.left = chips.style.left; owed.style.top = arrowY + (self ? 34 : 26) + (written ? 18 : 0) + "px"; owed.classList.toggle("self", self); put(owed); }
      y += ROW + (written ? 18 : 0) + (owed ? 24 : 0) + (self ? 8 : 0);
      for (const one of fragments.filter(one => one.last === k).sort((a, b) => b.depth - a.depth)) { one.bottom = y; y += 8; }
      mark(k);
    }
    for (const one of fragments.slice().sort((a, b) => b.depth - a.depth)) { // the inner frames first, so each outer one takes their width
      const inner = fragments.filter(other => other.depth > one.depth && one.first <= other.first && other.last <= one.last);
      const ends = one.fragment.operands.flatMap(operand => operand.edges).flatMap(id => [xs[index[records[id].record.from]], xs[index[records[id].record.to]], reach[order.indexOf(id)] - PAD + 16]);
      const tab = measure(make("div", { class: "fragment-kind" }, one.fragment.kind, badges(one.fragment.id))).w;
      const room = Math.max(...one.guards.map(([guard], j) => (j ? 8 : tab + 8) + (guard ? measure(make("div", { class: "guard" }, `[${guard}]`)).w + 8 : 0)));
      const x1 = Math.min(Math.min(...ends) - PAD + 8 * one.depth, ...inner.map(other => other.left - 8));
      const x2 = Math.max(Math.max(...ends) + PAD - 8 * one.depth, x1 + room, ...inner.map(other => other.right + 8));
      one.left = x1; one.right = x2;
      svg.append(draw("rect", { class: "fragment", "data-for": one.fragment.id, x: x1, y: one.top, width: x2 - x1, height: one.bottom - one.top, rx: 4 }));
      const kind = make("div", { class: "fragment-kind", "data-id": one.fragment.id }, one.fragment.kind, badges(one.fragment.id));
      kind.style.left = x1 + "px"; kind.style.top = one.top + "px";
      put(kind);
      one.guards.forEach(([guard, at], j) => {
        if (j) svg.append(draw("line", { class: "operand-line", "data-for": one.fragment.id, x1, x2, y1: at, y2: at }));
        if (!guard) return;
        const text = make("div", { class: "guard", "data-for": one.fragment.id }, `[${guard}]`);
        text.style.left = x1 + (j ? 8 : tab + 8) + "px"; text.style.top = at + 2 + "px";
        put(text);
      });
    }
    const bottom = y + 16;
    nodes.forEach((node, k) => {
      const line = { x1: xs[k], x2: xs[k], y1: TOP + headHeight, y2: bottom };
      svg.prepend(draw("g", { class: "lifeline-hit", "data-for": node.id }, draw("line", { class: "lifeline", style: colour(node), ...line }), draw("line", { class: "hit", ...line })));
    });
    const right = Math.max(lineEnds[1], ...fragments.map(one => one.right), ...reach.map(x => x + 16));
    const owing = (contract.areas || []).map(area => [area, edges.flatMap(edge => work(edge).filter(one => one.area === area.id).map(one => [edge, one]))]).filter(([, rows]) => rows.length);
    if (!owing.length) return { width: right + PAD, height: bottom + 48 };
    const list = make("div", { class: "work-list" }, owing.map(([area, rows]) => make("section", { "data-area": area.id, style: colour({ area: area.id }) },
      make("h2", {}, area.label),
      make("ol", {}, rows.map(([edge, one]) => make("li", { class: "work-row", "data-for": edge.id },
        make("span", { class: "work-step" }, String(step(edge))), make("span", { class: "work-change" }, one.change), make("span", { class: "work-says" }, words(one.says))))))));
    list.style.left = PAD + "px"; list.style.top = bottom + 32 + "px"; list.style.width = Math.max(right - PAD, 720) + "px";
    put(list);
    return { width: Math.max(right + PAD, PAD + measure(list).w + PAD), height: bottom + 32 + measure(list).h + 48 };
  }

  const taskBar = (task, chain) => { const node = records[task.node].record;
    return make("div", { class: "task" + (chain.has(task.id) ? " critical" : ""), "data-id": task.id, style: colour(node) }, task.label, badges(task.id)); };
  function plan(level, svg, put) { // actors and resources down the left, each task in the column of its place in time
    const { ranks, critical } = ORDER[level.id], chain = new Set(critical), BAR = 28, LANE_ROW = 64, BEND = 8;
    const nodes = level.nodes.map(id => records[id].record), tasks = of("tasks", level.id), edges = of("edges", level.id), milestones = of("milestones", level.id);
    const lane = Object.fromEntries(nodes.map((node, k) => [node.id, k])), lead = Math.max(...nodes.map(node => measure(nodeBox(node, level)).w));
    const columns = Math.max(0, ...Object.values(ranks)) + 1, widths = Array(columns).fill(40), slot = {}, rowsOf = nodes.map(() => 1);
    for (const task of tasks) {
      widths[ranks[task.id]] = Math.max(widths[ranks[task.id]], measure(taskBar(task, chain)).w);
      slot[task.id] = tasks.filter(other => other.node === task.node && ranks[other.id] === ranks[task.id] && tasks.indexOf(other) < tasks.indexOf(task)).length;
      rowsOf[lane[task.node]] = Math.max(rowsOf[lane[task.node]], slot[task.id] + 1);
    }
    for (const milestone of milestones) widths[ranks[milestone.id]] = Math.max(widths[ranks[milestone.id]], 40);
    // an arrow leaves its task into the gap after it, runs along the channel between lanes beside its target's lane, and enters the
    // gap before its target, so no run crosses a bar; each arrow in one gap or channel keeps a track of its own
    const leaving = Array(columns).fill(0), entering = Array(columns).fill(0), channels = Array(nodes.length + 1).fill(0);
    const routes = edges.map(edge => {
      const from = records[edge.from].record, to = records[edge.to].record, source = lane[from.node], target = lane[to.node];
      const channel = source < target ? target : target + 1;
      return { edge, from, to, channel, out: leaving[ranks[from.id]]++, into: entering[ranks[to.id]]++, track: channels[channel]++ };
    });
    const gaps = widths.map((width, c) => Math.max(GAP, 2 * 16 + BEND * (leaving[c] + (entering[c + 1] || 0))));
    const starts = [PAD + 24 + lead + GAP];
    widths.forEach((width, c) => { if (c) starts.push(starts[c - 1] + widths[c - 1] + gaps[c - 1]); });
    const channelHeight = channels.map(count => 16 + BEND * count), laneTops = [];
    let y = TOP + 32 + channelHeight[0];
    nodes.forEach((node, k) => { laneTops.push(y); y += rowsOf[k] * LANE_ROW + channelHeight[k + 1]; });
    const bottom = y, barY = task => laneTops[lane[task.node]] + slot[task.id] * LANE_ROW + 8, right = starts[columns - 1] + widths[columns - 1] + PAD;
    nodes.forEach((node, k) => {
      const box = nodeBox(node, level), height = rowsOf[k] * LANE_ROW - 8;
      box.style.left = PAD + 24 + "px"; box.style.top = laneTops[k] + "px"; box.style.width = lead + "px"; box.style.height = height + "px";
      put(box);
      const lines = Array.from({ length: rowsOf[k] }, (_, row) => { const at = laneTops[k] + row * LANE_ROW + 8 + BAR / 2; return { x1: PAD + 24 + lead, x2: right - PAD + 24, y1: at, y2: at }; });
      svg.prepend(draw("g", { class: "lifeline-hit", "data-for": node.id }, ...lines.flatMap(line => [draw("line", { class: "lifeline", style: colour(node), ...line }), draw("line", { class: "hit", ...line })])));
    });
    for (const task of tasks) {
      const bar = taskBar(task, chain), x = starts[ranks[task.id]];
      bar.style.left = x + "px"; bar.style.top = barY(task) + "px"; bar.style.width = widths[ranks[task.id]] + "px";
      const chips = make("div", { class: "task-chips", "data-for": task.id }, make("span", { class: "chip" }, tagName(task.tag)));
      chips.style.left = x + "px"; chips.style.top = barY(task) + BAR + 4 + "px";
      put(bar, chips);
    }
    const taken = tasks.map(task => ({ x: starts[ranks[task.id]], y: barY(task), w: widths[ranks[task.id]], h: BAR + 24 })); // each bar with its chips, then each label placed
    const seat = (label, spans) => { // the first spot along the arrow's runs, nearest their middles and then a row or two off them, where the label overlaps no bar and no label
      const w = measure(label).w, h = 20, clear = (x, y) => !taken.some(r => x - w / 2 < r.x + r.w && x + w / 2 > r.x && y < r.y + r.h && y + h > r.y);
      const spots = [0, -22, 22, -44, 44].flatMap(shift => spans.map(([lo, hi, y]) => [lo, hi, y + shift])).flatMap(([lo, hi, y]) => { const mid = (lo + hi) / 2, xs = [mid]; for (let d = 8; mid - d >= lo || mid + d <= hi; d += 8) xs.push(mid - d, mid + d); return xs.filter(x => x >= lo && x <= hi).map(x => [x, y - h / 2]); });
      const [x, y] = spots.find(([x, y]) => clear(x, y)) || spots[0];
      taken.push({ x: x - w / 2, y, w, h });
      label.style.left = x + "px"; label.style.top = y + "px";
    };
    for (const { edge, from, to, channel, out, into, track } of routes) {
      const x1 = starts[ranks[from.id]] + widths[ranks[from.id]], y1 = barY(from) + BAR / 2, x2 = starts[ranks[to.id]], y2 = barY(to) + BAR / 2;
      const leave = x1 + 16 + BEND * out, enter = x2 - 16 - BEND * into;
      const runY = (channel < nodes.length ? laneTops[channel] : bottom) - channelHeight[channel] + 8 + BEND * track;
      const path = from.node === to.node && slot[from.id] === slot[to.id] && ranks[to.id] === ranks[from.id] + 1 ? `M${x1},${y1} H${x2}`
        : `M${x1},${y1} H${leave} V${runY} H${enter} V${y2} H${x2}`;
      const bold = chain.has(from.id) && chain.has(to.id) && critical.indexOf(to.id) === critical.indexOf(from.id) + 1;
      svg.append(draw("g", { class: "edge" + (bold ? " critical" : ""), "data-for": edge.id, "data-tag": edge.tag },
        draw("path", { class: "arrow", d: path, "data-tag": edge.tag }), head(x2, y2, 1), draw("path", { class: "hit", d: path })));
      const held = badges(edge.id);
      if (held) { // a plan's arrow draws no label, but one its claims sit beside
        const label = make("div", { class: "edge-label plan", "data-id": edge.id }, edge.label, held), straight = path.indexOf("V") < 0;
        seat(label, straight ? [[x1, x2, y1], [x1, x2, barY(from) - 12]] : [[Math.min(leave, enter), Math.max(leave, enter), runY], [x1, leave, y1], [enter, x2, y2]]);
        put(label);
      }
    }
    for (const milestone of milestones) {
      const x = starts[ranks[milestone.id]] + widths[ranks[milestone.id]] / 2;
      svg.append(draw("line", { class: "milestone", "data-for": milestone.id, x1: x, x2: x, y1: TOP + 28, y2: bottom }));
      const label = make("div", { class: "milestone-label at-top", "data-id": milestone.id }, milestone.label, badges(milestone.id));
      label.style.left = x + "px"; label.style.top = TOP + "px";
      put(label);
    }
    return { width: right, height: bottom + 48 };
  }

  function render() {
    fromAddress();
    recordCard.hide();
    kept = null;
    const level = records[view.level].record, svg = draw("svg", { "aria-hidden": "true" }), parts = [];
    stage.replaceChildren();
    const size = (level.kind === "plan" ? plan : interaction)(level, svg, (...elements) => parts.push(...elements));
    svg.setAttribute("width", size.width); svg.setAttribute("height", size.height);
    stage.style.width = size.width + "px"; stage.style.height = size.height + "px";
    stage.replaceChildren(svg, ...parts);
    crumbs();
    document.title = `${contract.title} · ${level.title}`;
    if (view.at && spot(view.at)) { kept = view.at; light(view.at); recordCard.show(view.at); }
  }

  // ---- the reader's moves ----
  const target = event => { const element = event.target.closest && event.target.closest("#stage [data-id], #stage [data-for]"); return element && (element.dataset.id || element.dataset.for); };
  stage.addEventListener("pointerover", event => {
    const id = target(event);
    if (!id || kept) return;
    light(id); recordCard.show(id);
  });
  stage.addEventListener("pointerout", event => {
    if (kept || target(event) === (event.relatedTarget && event.relatedTarget.closest && target({ target: event.relatedTarget }))) return;
    light(null); recordCard.hide();
  });
  stage.addEventListener("click", event => {
    const opener = event.target.closest(".opens-mark"), id = target(event);
    if (opener) return go(opener.dataset.opens, null);
    if (!id) { kept = null; light(null); return recordCard.hide(); }
    if (event.target.closest(".work-row")) $("stage").querySelector(`.edge-label[data-id="${id}"]`).scrollIntoView({ block: "center" }); // a task-list row leads to its arrow
    kept = id; light(id); recordCard.show(id);
  });
  stage.addEventListener("dblclick", event => { // an edge that opens a level opens it, as its card's hint says
    const id = target(event);
    if (id && records[id].record.opens) go(records[id].record.opens, null);
  });
  addEventListener("keydown", event => {
    if (event.key === "Escape") { kept = null; light(null); recordCard.hide(); }
  });
  addEventListener("hashchange", render);
  render();
})();
</script>
</body>
