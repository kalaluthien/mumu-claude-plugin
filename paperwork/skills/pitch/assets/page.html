<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg: #fbfaf7; --surface: #ffffff; --ink: #1f2328; --muted: #656d76; --line: #d8d4cb;
  --accent: #2f6fdb; --accent-bg: #e6eefb; --amber: #8a5a00; --amber-bg: #fff1d0; --amber-line: #e3b341;
  --ok: #1a7f37; --bar: #ffffff; --shadow: 0 1px 3px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --surface: #1d2025; --ink: #e6e8eb; --muted: #9aa3ad; --line: #3a3f46;
    --accent: #7aa7ff; --accent-bg: #22314d; --amber: #f2c46d; --amber-bg: #3a2c0c; --amber-line: #8a6a1d;
    --ok: #56d364; --bar: #1d2025; --shadow: 0 1px 3px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
    --bg: #15171a; --surface: #1d2025; --ink: #e6e8eb; --muted: #9aa3ad; --line: #3a3f46;
    --accent: #7aa7ff; --accent-bg: #22314d; --amber: #f2c46d; --amber-bg: #3a2c0c; --amber-line: #8a6a1d;
    --ok: #56d364; --bar: #1d2025; --shadow: 0 1px 3px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html { scroll-padding-bottom: 280px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding-bottom: 260px; }
main { max-width: 820px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.5rem; line-height: 1.25; margin: 8px 0 16px; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
button:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea, input[type=text] { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.part { margin: 6px 0; }
.children { margin-left: 14px; padding-left: 12px; border-left: 2px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.id { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2.2em; }
.kind { font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.chip { font-size: .72rem; background: var(--accent-bg); color: var(--accent); border-radius: 10px; padding: 1px 8px; text-decoration: none; overflow-wrap: anywhere; }
.text { flex: 1 1 14em; overflow-wrap: anywhere; }
.risk > .row .kind, .risk-line .kind { color: var(--amber); border-color: var(--amber-line); background: var(--amber-bg); }
.risk > .row .text, .risk-line .text { color: var(--amber); }
.actions { display: inline-flex; gap: 4px; opacity: 0; transition: opacity .1s; }
.part:hover > .row .actions, .part:focus-within > .row .actions, .actions:focus-within { opacity: 1; }
@media (hover: none) { .actions { opacity: 1; } }
.actions button { font-size: .75rem; padding: 0 7px; }
.struck > .row .text { text-decoration: line-through; color: var(--muted); }
.struck > .children, .struck > .card, .struck > .comments { opacity: .45; }
.later > .row, .later > .card, .later > .comments { opacity: .35; transition: opacity .15s; }
.later > .row:hover, .later > .row:focus-within, .later > .card:hover, .later > .card:focus-within,
.later > .comments:hover, .later > .comments:focus-within { opacity: 1; }
.reason { font-size: .8rem; color: var(--muted); }
.edited-mark { font-size: .7rem; color: var(--accent); }
.inline { margin: 4px 0 4px 2.4em; display: flex; flex-direction: column; gap: 4px; }
.inline .btns { display: flex; gap: 6px; }
.comments { margin: 2px 0 2px 2.4em; font-size: .9rem; }
.comment { display: flex; gap: 6px; border-left: 3px solid var(--accent); padding-left: 8px; margin: 2px 0; }
.card { margin: 6px 0 6px 2.4em; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); }
.card:focus, .card.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
ol.opts, ol.leaves { list-style: none; margin: 0; padding: 0; }
.opt { border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; padding: 6px 8px; }
.opt.chosen { border-color: var(--accent); background: var(--accent-bg); }
.optbtn { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none; padding: 2px 0; }
.num { font-weight: 600; min-width: 1.4em; height: 1.4em; text-align: center; border: 1px solid var(--line); border-radius: 4px; font-size: .8rem; background: var(--surface); }
.badge { font-size: .7rem; color: var(--ok); border: 1px solid var(--ok); border-radius: 10px; padding: 0 7px; white-space: nowrap; }
.optparts { margin: 2px 0 2px 2em; font-size: .9rem; }
.risk-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.note-line { color: var(--muted); }
.fu { margin: 6px 0 2px 2em; padding: 6px 8px; border-left: 3px solid var(--line); opacity: .75; }
.fu.active { opacity: 1; border-left-color: var(--accent); }
.fuq { font-size: .85rem; font-weight: 600; }
.leaf { display: flex; gap: 8px; align-items: baseline; padding: 2px 4px; border-radius: 6px; width: 100%; text-align: left; border: 0; background: none; }
.leaf.chosen { background: var(--accent-bg); }
.hint { margin: 8px 0 0; font-size: .8rem; color: var(--muted); }
.other textarea { margin-top: 6px; }
#bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bar); border-top: 1px solid var(--line); box-shadow: 0 -2px 8px rgba(0,0,0,.12); padding: 8px 16px; z-index: 5; }
#bar .in { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
#bar .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#count { flex: 1; font-size: .9rem; color: var(--muted); }
#answer { height: 110px; font: .8rem/1.4 ui-monospace, Menlo, monospace; resize: vertical; }
#copy { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<div id="tree"></div>
</main>
<div id="bar"><div class="in">
  <div class="top"><span id="count"></span><button id="undo" type="button">Undo</button><button id="copy" type="button">Copy Answer</button></div>
  <textarea id="answer" readonly aria-label="Answer to copy"></textarea>
</div></div>
<script type="application/json" id="plan">__PLAN__</script>
<script>
(function () {
"use strict";
var plan = JSON.parse(document.getElementById("plan").textContent);
var STAMP = "__STAMP__";
// One id rule, the same as the lib: depth-first over parts, 1-based, dot-joined.
var order = [], byId = {}, parentOf = {};
(function walk(parts, prefix, parent) {
  parts.forEach(function (p, i) {
    var id = prefix + (i + 1);
    order.push(id); byId[id] = p; parentOf[id] = parent;
    walk(p.parts || [], id + ".", id);
  });
})(plan.parts, "", "");
var decisions = order.filter(function (id) { return "pick" in byId[id]; });

var S = { pick: {}, strike: {}, edit: {}, comment: {} };
var history = [];
var ui = { cur: decisions[0] || null, awaiting: null, open: null, copied: false, later: {} };

function options(d) { return [d.pick].concat(d.else || []); }
function h(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function btn(label, fn, cls) {
  var b = h("button", cls, label); b.type = "button"; b.addEventListener("click", fn); return b;
}
function snapshot() { history.push(JSON.stringify(S)); ui.copied = false; }
function change(fn) { snapshot(); fn(); render(); }
function isStruckBelow(id) {
  for (var x = id; x; x = parentOf[x]) if (S.strike[x] != null) return true;
  return false;
}

// -- answer ---------------------------------------------------------------
function lines() {
  var out = [];
  order.forEach(function (id) {
    if (isStruckBelow(id) && S.strike[id] == null) return;
    var c = S.pick[id], one = function (t) { out.push("- " + id + " " + t); };
    if (S.strike[id] == null) {
      if (c && c.other != null) one("other: " + oneLine(c.other));
      else if (c && (c.k !== 1 || (c.then != null && c.then !== 1)))
        one("pick " + c.k + (c.then != null ? " then " + c.then : ""));
      if (S.edit[id] != null) one("edited: " + oneLine(S.edit[id]));
      (S.comment[id] || []).forEach(function (t) { one("comment: " + oneLine(t)); });
    } else one("struck: " + oneLine(S.strike[id]));
  });
  return out;
}
function oneLine(t) { return String(t).replace(/\s*\n\s*/g, " ").trim(); }
function answerText() { return ["# Answer: " + plan.title + " · plan " + STAMP].concat(lines()).join("\n") + "\n"; }

// -- render ---------------------------------------------------------------
function meta(p, row) {
  if (p.kind) row.appendChild(h("span", "kind", p.kind));
}
function chip(source) {
  var e;
  if (/^https?:\/\//.test(source)) { e = h("a", "chip", source); e.href = source; e.target = "_blank"; e.rel = "noopener noreferrer"; }
  else e = h("span", "chip", source);
  return e;
}
function readonlyParts(parts, into) {
  parts.forEach(function (p) {
    var line = h("div", p.kind === "risk" ? "risk-line" : "note-line");
    if (p.kind) line.appendChild(h("span", "kind", p.kind));
    line.appendChild(h("span", "text", p.text));
    if (p.source) line.appendChild(chip(p.source));
    into.appendChild(line);
    if (p.parts) { var sub = h("div", "optparts"); readonlyParts(p.parts, sub); into.appendChild(sub); }
  });
}
function shownText(id) { return S.edit[id] != null ? S.edit[id] : byId[id].text; }

function actions(id) {
  var a = h("span", "actions");
  if (S.strike[id] != null) a.appendChild(btn("Unstrike", function () { change(function () { delete S.strike[id]; }); }));
  else a.appendChild(btn("Strike", function () { ui.open = { kind: "strike", pid: id }; render(); }));
  a.appendChild(btn("Comment", function () { ui.open = { kind: "comment", pid: id }; render(); }));
  a.appendChild(btn("Edit", function () { ui.open = { kind: "edit", pid: id }; render(); }));
  if (S.edit[id] != null) a.appendChild(btn("Revert", function () { change(function () { delete S.edit[id]; }); }));
  return a;
}

function editor(id, kind) {
  var box = h("div", "inline");
  var field = kind === "edit" ? h("textarea") : h("input"); 
  if (kind !== "edit") field.type = "text";
  field.rows = 2;
  field.setAttribute("aria-label", kind === "strike" ? "Reason for striking" : kind === "edit" ? "New text" : "Comment");
  field.placeholder = kind === "strike" ? "Why strike this?" : kind === "edit" ? "" : "Your comment";
  if (kind === "edit") field.value = shownText(id);
  field.className = "ed-" + kind;
  var done = function () {
    var v = field.value.trim();
    if (!v) return;
    ui.open = null;
    change(function () {
      if (kind === "strike") S.strike[id] = v;
      else if (kind === "edit") { if (v === byId[id].text) delete S.edit[id]; else S.edit[id] = v; }
      else (S.comment[id] = S.comment[id] || []).push(v);
    });
  };
  field.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { ui.open = null; render(); focusCard(id); e.stopPropagation(); }
    else if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); done(); }
  });
  var b = h("div", "btns");
  b.appendChild(btn(kind === "strike" ? "Strike" : kind === "edit" ? "Save" : "Add", done));
  b.appendChild(btn("Cancel", function () { ui.open = null; render(); }));
  box.appendChild(field); box.appendChild(b);
  box._field = field;
  return box;
}

// The view's one gate: Parts after the first Decision still open are faded, never hidden.
function laterIds() {
  var open = decisions.filter(function (id) { return !(id in S.pick) && S.strike[id] == null; })[0];
  var out = {};
  if (!open) return out;
  order.slice(order.indexOf(open) + 1).forEach(function (id) {
    if (id.indexOf(open + ".") !== 0) out[id] = true;
  });
  return out;
}

function partView(id) {
  var p = byId[id];
  var isDec = "pick" in p;
  var wrap = h("div", "part" + (p.kind === "risk" ? " risk" : "") + (S.strike[id] != null ? " struck" : "") + (isDec ? " decision" : "") + (ui.later[id] ? " later" : ""));
  wrap.setAttribute("data-id", id);
  var row = h("div", "row");
  row.appendChild(h("span", "id", id));
  meta(p, row);
  row.appendChild(h("span", "text", shownText(id)));
  if (S.edit[id] != null) row.appendChild(h("span", "edited-mark", "edited"));
  if (p.source) row.appendChild(chip(p.source));
  if (S.strike[id] != null) row.appendChild(h("span", "reason", "struck: " + S.strike[id]));
  row.appendChild(actions(id));
  wrap.appendChild(row);
  if (ui.open && ui.open.pid === id) {
    var ed = editor(id, ui.open.kind); wrap.appendChild(ed); wrap._ed = ed;
  }
  if (isDec) wrap.appendChild(card(id));
  var cs = S.comment[id] || [];
  if (cs.length) {
    var cbox = h("div", "comments");
    cs.forEach(function (t, i) {
      var c = h("div", "comment"); c.appendChild(h("span", null, t));
      c.appendChild(btn("Remove", function () { change(function () { S.comment[id].splice(i, 1); if (!S.comment[id].length) delete S.comment[id]; }); }));
      cbox.appendChild(c);
    });
    wrap.appendChild(cbox);
  }
  if (p.parts && p.parts.length) {
    var kids = h("div", "children");
    p.parts.forEach(function (_, i) { kids.appendChild(partView(id + (id ? "." : "") + (i + 1))); });
    wrap.appendChild(kids);
  }
  return wrap;
}

function hint(id) {
  var d = byId[id], K = options(d).length, c = S.pick[id];
  if (ui.open && ui.open.pid === id && ui.open.kind === "other") return "Type your answer, Enter to use it, Esc to close.";
  if (ui.awaiting === id) {
    var q = options(d)[c.k - 1].then;
    return "Then 1 – " + options(q).length + ". Esc to pick again.";
  }
  return "Pick 1 – " + K + ", or " + (K + 1) + " for Other. j / k: next Decision.";
}

function card(id) {
  var d = byId[id], opts = options(d), K = opts.length, c = S.pick[id];
  var chosenK = c ? (c.other != null ? 0 : c.k) : 1;
  var box = h("div", "card" + (ui.cur === id ? " cur" : ""));
  box.tabIndex = 0; box.setAttribute("data-card", id);
  box.addEventListener("focus", function () { ui.cur = id; });
  box.addEventListener("click", function () { ui.cur = id; });
  var ol = h("ol", "opts");
  opts.forEach(function (o, i) {
    var k = i + 1;
    var li = h("li", "opt" + (chosenK === k ? " chosen" : ""));
    var b = btn("", function () { pickOption(id, k); }, "optbtn");
    b.appendChild(h("span", "num", String(k)));
    b.appendChild(h("span", "text", o.text));
    if (k === 1) b.appendChild(h("span", "badge", "Agent's pick"));
    li.appendChild(b);
    if (o.parts) { var op = h("div", "optparts"); readonlyParts(o.parts, op); li.appendChild(op); }
    if (o.then) {
      var fu = h("div", "fu" + (chosenK === k && ui.awaiting === id ? " active" : ""));
      fu.appendChild(h("div", "fuq", o.then.text));
      var lo = h("ol", "leaves");
      options(o.then).forEach(function (leaf, j) {
        var m = j + 1;
        var on = chosenK === k && c && c.then === m;
        var lb = btn("", function () { pickLeaf(id, k, m); }, "leaf" + (on ? " chosen" : ""));
        lb.appendChild(h("span", "num", String(m)));
        lb.appendChild(h("span", "text", leaf.text));
        if (m === 1) lb.appendChild(h("span", "badge", "Agent's pick"));
        var li2 = h("li"); li2.appendChild(lb);
        if (leaf.parts) { var lp = h("div", "optparts"); readonlyParts(leaf.parts, lp); li2.appendChild(lp); }
        lo.appendChild(li2);
      });
      fu.appendChild(lo);
      li.appendChild(fu);
    }
    ol.appendChild(li);
  });
  var oli = h("li", "opt other" + (c && c.other != null ? " chosen" : ""));
  var ob = btn("", function () { openOther(id); }, "optbtn");
  ob.appendChild(h("span", "num", String(K + 1)));
  ob.appendChild(h("span", "text", c && c.other != null ? "Other: " + c.other : "Other…"));
  oli.appendChild(ob);
  if (ui.open && ui.open.pid === id && ui.open.kind === "other") {
    var ta = h("textarea"); ta.rows = 2; ta.setAttribute("aria-label", "Other answer"); ta.className = "ed-other";
    ta.value = c && c.other != null ? c.other : "";
    var use = function () {
      var v = ta.value.trim(); if (!v) return;
      ui.open = null; ui.awaiting = null;
      change(function () { S.pick[id] = { k: 0, other: v }; });
    };
    ta.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { ui.open = null; render(); focusCard(id); e.stopPropagation(); }
      else if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); use(); }
    });
    oli.appendChild(ta); oli._ta = ta;
    var ub = h("div", "btns"); ub.appendChild(btn("Use this", use));
    oli.appendChild(ub);
  }
  ol.appendChild(oli);
  box.appendChild(ol);
  box.appendChild(h("p", "hint", hint(id)));
  return box;
}

function pickOption(id, k) {
  ui.cur = id; ui.open = null;
  var o = options(byId[id])[k - 1];
  ui.awaiting = o.then ? id : null;
  change(function () { S.pick[id] = { k: k, then: null }; });
}
function pickLeaf(id, k, m) {
  ui.cur = id; ui.open = null; ui.awaiting = null;
  change(function () { S.pick[id] = { k: k, then: m }; });
}
function openOther(id) { ui.cur = id; ui.awaiting = null; ui.open = { kind: "other", pid: id }; render(); }
function focusCard(id) {
  var c = document.querySelector('[data-card="' + id + '"]');
  if (c) c.focus();
}

function render() {
  var tree = document.getElementById("tree");
  tree.textContent = "";
  ui.later = laterIds();
  var wraps = plan.parts.map(function (_, i) { return partView(String(i + 1)); });
  wraps.forEach(function (w) { tree.appendChild(w); });
  var n = lines().length;
  document.getElementById("count").textContent = n === 0 ? "No changes yet. Everything is kept." : n + (n === 1 ? " change" : " changes");
  document.getElementById("answer").value = answerText();
  document.getElementById("undo").disabled = history.length === 0;
  var copy = document.getElementById("copy");
  copy.textContent = ui.copied ? "Copied – paste it back to the agent" : "Copy Answer";
  var f = tree.querySelector(".ed-other, .ed-strike, .ed-comment, .ed-edit");
  if (f) f.focus();
  else if (ui.cur && ui.focusCard) { focusCard(ui.cur); }
  ui.focusCard = false;
}

// -- keys -----------------------------------------------------------------
document.addEventListener("keydown", function (e) {
  var t = e.target, typing = t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT");
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  var id = ui.cur;
  if (e.key === "j" || e.key === "k") {
    if (!decisions.length) return;
    var i = decisions.indexOf(id);
    i = e.key === "j" ? Math.min(i + 1, decisions.length - 1) : Math.max(i - 1, 0);
    ui.cur = decisions[i]; ui.awaiting = null; ui.focusCard = true; render();
    var c = document.querySelector('[data-card="' + ui.cur + '"]');
    if (c) c.scrollIntoView({ block: "center" });
    e.preventDefault();
  } else if (e.key === "Escape") {
    if (ui.awaiting || ui.open) { ui.awaiting = null; ui.open = null; ui.focusCard = true; render(); }
  } else if (/^[1-9]$/.test(e.key) && id && "pick" in byId[id] && S.strike[id] == null) {
    var n = +e.key, d = byId[id], K = options(d).length, c2 = S.pick[id];
    if (ui.awaiting === id) {
      var q = options(d)[c2.k - 1].then;
      if (n <= options(q).length) { pickLeaf(id, c2.k, n); ui.focusCard = true; render(); }
    } else if (n <= K) { ui.focusCard = true; pickOption(id, n); }
    else if (n === K + 1) { e.preventDefault(); openOther(id); }
  }
});

document.getElementById("undo").addEventListener("click", function () {
  if (!history.length) return;
  S = JSON.parse(history.pop()); ui.awaiting = null; ui.open = null; ui.copied = false; render();
});
document.getElementById("copy").addEventListener("click", function () {
  var ta = document.getElementById("answer"), text = answerText();
  var done = function () { ui.copied = true; render(); };
  var fallback = function () { ta.focus(); ta.select(); try { document.execCommand("copy"); } catch (e) {} done(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
});

document.getElementById("title").textContent = plan.title;
render();
})();
</script>
</body>
</html>
