<style>
/* Each name reads a KRDS colour, so the page follows the frame's theme. */
:root {
  --surface: var(--krds-color-surface-white); --panel: var(--krds-color-surface-gray-subtler);
  --ink: var(--krds-color-text-bolder); --body: var(--krds-color-text-basic); --muted: var(--krds-color-text-subtle);
  --line: var(--krds-color-border-gray); --card-line: var(--krds-color-border-gray-light); --accent: var(--krds-color-text-primary);
  --accent-bg: var(--krds-color-surface-primary-subtler); --accent-line: var(--krds-color-border-primary);
  --pass: var(--krds-color-text-success); --pass-bg: var(--krds-color-surface-success-subtler);
  --fail: var(--krds-color-text-danger); --fail-bg: var(--krds-color-surface-danger-subtler);
  --warn: var(--krds-color-text-warning); --warn-bg: var(--krds-color-surface-warning-subtler);
  --mono: ui-monospace, "SF Mono", Menlo, Monaco, monospace;
}
a { color: inherit; text-underline-offset: 3px; }
a:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* The sticky bar sits under the frame's top bar, so a section must stop below both. */
.frame-body [id] { scroll-margin-top: 106px; }
h1 { font: 600 1.6rem/1.25 var(--font-sans); color: var(--ink); margin: 16px 0 4px; overflow-wrap: anywhere; }

/* one row of numbers and one primary action, kept in view */
.tree-bar { position: sticky; top: 52px; z-index: 1; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 0; background: var(--krds-color-background-white); border-bottom: 1px solid var(--card-line); box-shadow: 0 -20px 0 var(--krds-color-background-white); }
.tree-stats { display: flex; flex: 1 1 auto; flex-wrap: wrap; gap: 0 16px; min-width: 0; margin: 0; font-size: .9rem; color: var(--body); font-variant-numeric: tabular-nums; }
.tree-stats b { font-weight: 700; color: var(--ink); }
.delta { color: var(--accent); font-weight: 600; }
.bar-button { flex: none; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: 500 .85rem var(--font-sans); cursor: pointer; }
.bar-button:hover:not([disabled]) { background: var(--panel); }
.bar-button[disabled] { color: var(--muted); border-style: dashed; cursor: default; }
.bar-button.primary { background: var(--accent); border-color: var(--accent); color: var(--krds-color-text-basic-inverse); }
.bar-button.primary:hover:not([disabled]) { background: var(--accent); opacity: .9; }

/* the overview: open Decisions first, the settled folded into a count */
#overview { padding-bottom: 8px; }
.how { margin: 10px 0 12px; color: var(--body); font-size: .95rem; }
.queue { list-style: none; margin: 0; padding: 0; border: 1px solid var(--card-line); border-radius: 10px; background: var(--surface); }
.queue li + li { border-top: 1px solid var(--card-line); }
.queue a { display: grid; grid-template-columns: 22px minmax(0, 1.15fr) minmax(0, 1fr); gap: 2px 8px; padding: 7px 12px; text-decoration: none; }
.queue a:hover { background: var(--panel); color: inherit; }
.row-mark { color: var(--muted); font-size: .9rem; }
.row-question { font-weight: 600; color: var(--ink); font-size: .93rem; }
.row-pick { color: var(--body); font-size: .9rem; }
.row-pick small { color: var(--muted); font-size: .78rem; }
.queue .answered .row-mark { color: var(--pass); }
.queue .waiting .row-pick { color: var(--body); }
.folded { margin: 8px 0 0; color: var(--body); font-size: .88rem; }
.folded a { font-weight: 500; }
.keys { margin: 6px 0 0; color: var(--muted); font-size: .78rem; }
.keys kbd { font: .74rem var(--mono); padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; }

/* the closed tree */
/* With the frame's own room, this lets a short last section reach the top of the body. */
#tree-parts { margin-top: 18px; padding-bottom: 24vh; }
.tree-part { position: relative; }
.part-children { margin: 2px 0 6px 11px; padding-left: 14px; border-left: 1px solid var(--card-line); }
.part-line { display: flex; align-items: flex-start; gap: 8px; padding: 3px 0; }
.part-main { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.part-id { flex: none; min-width: 2.2em; font: .74rem/1.9 var(--mono); color: var(--muted); }
.part-text { margin: 0; color: var(--body); font-size: .95rem; }
#tree-parts > .tree-part { margin-top: 10px; }
#tree-parts > .tree-part > .part-body .part-text { color: var(--ink); font-weight: 600; }
#tree-goal .part-text { font-size: 1.02rem; color: var(--body); }
.part-kind { margin-right: 6px; color: var(--muted); font-size: .76rem; }
.risk-pill { display: inline-flex; align-items: center; gap: 3px; margin-right: 6px; padding: 0 6px; border-radius: 4px; background: var(--fail-bg); color: var(--fail); font-size: .76rem; font-weight: 600; }
.source { margin-left: 6px; color: var(--muted); font-size: .8rem; white-space: normal; }
.fold { margin-left: 6px; padding: 0 4px; border: 0; background: none; color: var(--accent); font: .8rem var(--font-sans); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.part-tools { display: flex; flex: none; gap: 2px; }
.tool { padding: 0 5px; border: 0; background: none; color: var(--muted); font: .76rem var(--font-sans); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.tool:hover { color: var(--accent); }
.tool[aria-disabled="true"] { cursor: not-allowed; text-decoration: none; }
/* A tool never covers the text: it keeps its width and only shows on demand where a pointer can hover. */
@media (hover: hover) {
  .part-line:not(:hover):not(:focus-within) .part-tools { opacity: 0; }
}
.struck > .part-body .part-text, .struck > .part-body .mock, .struck > .part-body .diff { text-decoration: line-through; color: var(--muted); }
.struck > .part-children, .struck > .part-options { display: none; }
.note-line { margin: 2px 0 0; color: var(--body); font-size: .85rem; }
.note-line .remove { margin-left: 6px; }
.note-line b { font-weight: 600; }
.editor { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.editor-field { flex: 1 1 14em; min-width: 0; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: .9rem var(--font-sans); }

/* a Decision: the question, what it rests on, then its options, all in view */
.tree-decision { margin: 10px 0; padding: 10px 14px 12px; border: 1px solid var(--card-line); border-left: 4px solid var(--line); border-radius: 10px; background: var(--surface); }
.tree-decision[data-state="waiting"] { border-left-color: var(--accent-line); }
.tree-decision[data-state="answered"] { border-left-color: var(--krds-color-border-success); }
.tree-decision[data-state="not-needed"], .tree-decision[data-state="settled"] { background: var(--panel); border-left-style: dashed; }
.tree-decision.current { box-shadow: 0 0 0 2px var(--accent-line); }
.tree-decision[data-effect] { box-shadow: 0 0 0 2px var(--krds-color-border-warning); }
.tree-decision.flash { animation: flash 1s ease-out; }
@keyframes flash { from { background: var(--accent-bg); } }
@media (prefers-reduced-motion: reduce) { .tree-decision.flash { animation: none; } }
.decision-head { display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; font-size: .78rem; color: var(--muted); }
.decision-word { font-weight: 600; color: var(--accent); }
[data-state="answered"] > .part-body .decision-word { color: var(--pass); }
[data-state="settled"] > .part-body .decision-word, [data-state="not-needed"] > .part-body .decision-word { color: var(--body); }
.tree-decision > .part-body .part-text { color: var(--ink); font-size: 1.02rem; font-weight: 600; }
.reason { margin: 2px 0 0; color: var(--body); font-size: .85rem; }
.reason a { font-weight: 500; }
[data-state="not-needed"] > .part-children:not(.holds-decision), [data-state="settled"] > .part-children:not(.holds-decision) { display: none; }
.part-options[hidden] { display: none; }
.part-options:not([hidden]) { display: grid; gap: 6px; margin-top: 8px; }
.option { border: 1px solid var(--card-line); border-radius: 8px; background: var(--surface); }
.option-press { display: flex; align-items: flex-start; gap: 8px; width: 100%; padding: 6px 10px; border: 0; border-radius: 8px; background: none; color: var(--ink); font: 500 .95rem/1.4 var(--font-sans); text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.option-press:hover { background: var(--panel); }
.option-number { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 50%; font-size: .78rem; font-variant-numeric: tabular-nums; }
.option-label { flex: 1 1 auto; min-width: 0; }
.option-tag { flex: none; padding: 0 6px; border-radius: 4px; background: var(--panel); color: var(--body); font-size: .76rem; font-weight: 500; }
.option.default { border-style: dashed; border-color: var(--accent-line); }
.option.picked { border: 2px solid var(--krds-color-border-success); }
.option.picked .option-number { background: var(--krds-color-border-success); border-color: var(--krds-color-border-success); color: var(--krds-color-text-basic-inverse); }
.option.picked .option-tag:first-of-type { background: var(--pass-bg); color: var(--pass); }
.option.blocked { border-style: dashed; background: var(--panel); }
.option.blocked .option-press { color: var(--body); font-weight: 400; cursor: not-allowed; }
.option.blocked .option-press:hover { background: none; }
.option.blocked .option-tag { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.blocked-reason { margin: 0; padding: 0 10px 6px 40px; color: var(--body); font-size: .85rem; }
.option-facts { padding: 0 10px 6px 40px; }
.option-facts .part-text { font-size: .88rem; }
.fact-below { margin-left: 14px; }

/* exhibits read as the real thing in form only */
.mock { margin: 6px 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.mock-bar { display: flex; gap: 4px; padding: 5px 8px; background: var(--panel); border-bottom: 1px solid var(--card-line); }
.mock-bar i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.mock pre, .diff { margin: 0; font: .8rem/1.5 var(--mono); overflow-x: auto; }
.mock pre { padding: 8px 10px; color: var(--body); }
.mock-button { padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; }
.mock-button.main { background: var(--accent); border-color: var(--accent); color: var(--krds-color-text-basic-inverse); }
.quote { margin: 6px 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--body); font-size: .95rem; }
.quote p { margin: 0; }
.quote cite { display: block; margin-top: 2px; color: var(--muted); font-size: .8rem; font-style: normal; }
.diff { margin: 6px 0; padding: 6px 0; border: 1px solid var(--card-line); border-radius: 8px; background: var(--surface); }
.diff-line { display: block; min-width: max-content; padding: 0 10px; color: var(--body); }
.diff-add { background: var(--pass-bg); color: var(--pass); }
.diff-remove { background: var(--fail-bg); color: var(--fail); }
.diff-hunk, .diff-file { color: var(--muted); }

/* the left tree: one state per Decision, one mark per change */
.krds-side-navigation .lnb-list .lnb-item .lnb-btn[data-state]::before { content: attr(data-mark); position: static; display: inline; width: auto; height: auto; margin-right: 5px; background: none; color: var(--muted); }
.krds-side-navigation .lnb-list .lnb-item .lnb-btn[data-effect]::after { content: attr(data-effect); position: static; display: inline-block; width: auto; height: auto; margin-left: 6px; padding: 0 5px; border-radius: 4px; background: var(--warn-bg); color: var(--warn); font-size: .72rem; font-weight: 600; }
.frame-nav.previewing .lnb-link:not([data-effect]) { color: var(--muted); }

@media (max-width: 820px) {
  /* The frame shows a submenu under a closed navigation and lets a long one run off the screen; its issue is #1105. */
  .frame-nav:not(.open) .lnb-list .lnb-item.active .lnb-submenu { visibility: hidden; }
  .frame-nav.open { top: 52px; bottom: 0; height: calc(100vh - 52px); }
  .long { display: none; }
  .tree-stats { gap: 0 10px; font-size: .84rem; }
  .bar-button { padding: 0 8px; }
  .queue a { grid-template-columns: 22px minmax(0, 1fr); }
  .row-pick { grid-column: 2; }
  .part-line { flex-wrap: wrap; }
  .part-main { flex: 1 1 0; }
  .part-tools { order: 3; width: 100%; padding-left: 2.6em; }
  .blocked-reason, .option-facts { padding-left: 10px; }
}
@media print {
  .tree-bar, .part-tools, .keys { display: none; }
  .part-children[hidden] { display: block; }
}
</style>

<div class="tree-bar">
<p class="tree-stats">
<span id="tree-left"></span>
<span id="tree-risks"></span>
<span id="tree-files"></span>
</p>
<button class="bar-button" id="tree-next" type="button">Next<span class="long"> decision</span> ↓</button>
<button class="bar-button" id="tree-undo" type="button">Undo</button>
<button class="bar-button" id="tree-finish" type="button">Copy<span class="long"> answer</span></button>
</div>

<section id="overview">
<h1 id="tree-title"></h1>
<div id="tree-goal"></div>
<p class="how">Press an option in each open decision, then press Copy answer and paste the text back to the agent. A decision you leave alone stays open.</p>
<ol class="queue" id="tree-queue"></ol>
<p class="folded" id="tree-folded"></p>
<p class="keys"><kbd>1</kbd>-<kbd>9</kbd> pick, <kbd>j</kbd> <kbd>k</kbd> move, <kbd>n</kbd> next open, <kbd>u</kbd> undo</p>
</section>

<div id="tree-parts"></div>

<script type="application/json" id="tree-plan">__PLAN__</script>
<script>
const plan = JSON.parse(document.getElementById("tree-plan").textContent);
const STORE_KEY = "paperwork-tree-__STAMP__";
const OTHER = 0;
const WORD = {waiting: "Open", answered: "Answered", settled: "Settled", "not-needed": "Not needed", struck: "Struck"};
const MARK = {waiting: "○", answered: "✓", settled: "=", "not-needed": "–", struck: "✕"};
const QUIET_KINDS = new Set(["step", "goal", "claim", "question", "mockup", "diff", "quote", "risk"]);

const parts = new Map();
const decisionIds = [];
(function index(list, prefix) {
  list.forEach((part, i) => {
    const id = `${prefix}${i + 1}`;
    parts.set(id, part);
    if ("pick" in part) decisionIds.push(id);
    index(part.parts || [], `${id}.`);
  });
})(plan.parts, "");
const decisionOfName = new Map(decisionIds.filter(id => parts.get(id).name).map(id => [parts.get(id).name, id]));

const options = decision => [decision.pick, ...(decision.else || [])];
const childIds = id => (parts.get(id).parts || []).map((_, i) => `${id}.${i + 1}`);
const within = (id, top) => id === top || id.startsWith(`${top}.`);
const holdsDecision = id => decisionIds.some(other => within(other, id));

// -- the decision graph, the same calculation as tree_plan.py, which the check compares ------------

function evaluate(answers) {
  const chosen = {}, result = {};
  for (const id of decisionIds) {
    const decision = parts.get(id);
    const held = ref => { const [target, option] = ref.split("."); return chosen[target] === option; };
    const cause = (decision.requires || []).find(ref => !held(ref)) ?? null;
    const blockers = options(decision).map(option =>
      (option.requires || []).find(ref => !held(ref)) ?? (option.excludes || []).find(held) ?? null);
    const openings = blockers.flatMap((blocker, i) => blocker === null ? [i + 1] : []);
    const answer = answers[id];
    const answered = cause === null && (answer === OTHER || openings.includes(answer));
    const choice = cause !== null ? null : answered ? answer : openings[0] ?? null;
    result[id] = {cause, blockers, choice, answered};
    chosen[decision.name] = choice ? options(decision)[choice - 1].name : null;
  }
  return result;
}

function isSettled(entry) {
  const open = entry.blockers.filter(blocker => blocker === null).length;
  return entry.cause === null && !entry.answered && open === 1 && entry.blockers.length > 1;
}

function isWaiting(entry) {
  return entry.cause === null && !entry.answered && !isSettled(entry);
}

function inForce(list, entries, struck, prefix, out) {
  const flat = nodes => nodes.forEach(node => { out.push(node); flat(node.parts || []); });
  list.forEach((part, i) => {
    const id = `${prefix}${i + 1}`, entry = entries[id];
    if (id in struck || entry?.cause) return;
    out.push(part);
    if (entry?.choice) {
      const option = options(part)[entry.choice - 1];
      out.push(option);
      flat(option.parts || []);
    }
    inForce(part.parts || [], entries, struck, `${id}.`, out);
  });
  return out;
}

function summary(answers, struck) {
  const entries = evaluate(answers);
  const kept = inForce(plan.parts, entries, struck, "", []);
  const estimates = [...("files" in plan ? [plan.files] : []), ...kept.filter(node => "files" in node).map(node => node.files)];
  const out = Object.keys(struck);
  return {
    files: estimates.length ? estimates.reduce((sum, n) => sum + n, 0) : null,
    left: decisionIds.filter(id => isWaiting(entries[id]) && !out.some(top => within(id, top))).length,
    risks: kept.filter(node => node.kind === "risk").length,
  };
}

// -- the state, saved on each change ------------------------------------------------------------

const blank = () => ({picks: {}, others: {}, struck: {}, comments: {}, edits: {}});
function restored() {
  try { return {...blank(), ...JSON.parse(localStorage.getItem(STORE_KEY))}; } catch { return blank(); }
}
let state = restored();
const history = [];
const opened = new Set();
let editor = null, lastChange = {}, current = null, statusTimer;

function save() {
  // A page opened from a file may be refused storage; the answers then last until it closes.
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch { /* nothing to do */ }
}
function change(apply) {
  history.push(JSON.stringify(state));
  apply();
  save();
  render();
}
function announce(message) {
  const status = document.getElementById("frame-status");
  status.textContent = message;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { status.textContent = ""; }, 4000);
}

const isStruck = id => Object.keys(state.struck).some(top => within(id, top));
const shownText = id => state.edits[id] ?? parts.get(id).text;
const oneLine = text => String(text).replace(/\s*\n\s*/g, " ").trim();

function answerText() {
  const entries = evaluate(state.picks), lines = [`# Answer: ${plan.title} · plan __STAMP__`];
  for (const id of parts.keys()) {
    const line = text => lines.push(`- ${id} ${text}`);
    if (id in state.struck) line(`struck: ${oneLine(state.struck[id])}`);
    if (isStruck(id)) continue;
    if (entries[id]?.answered) line(entries[id].choice === OTHER ? `other: ${oneLine(state.others[id])}` : `pick ${entries[id].choice}`);
    if (id in state.edits) line(`edited: ${oneLine(state.edits[id])}`);
    (state.comments[id] || []).forEach(text => line(`comment: ${oneLine(text)}`));
  }
  return `${lines.join("\n")}\n`;
}

// The reader refuses this strike too: a Decision outside would name one that is gone.
function strikeBlocker(id) {
  const inside = new Set([...decisionOfName].filter(([, other]) => within(other, id)).map(([name]) => name));
  return decisionIds.find(other => {
    const decision = parts.get(other);
    const refs = [...(decision.requires || []), ...options(decision).flatMap(option => [...(option.requires || []), ...(option.excludes || [])])];
    return !within(other, id) && refs.some(ref => inside.has(ref.split(".")[0]));
  });
}

// -- small drawing helpers ------------------------------------------------------------------------

function make(tag, name, ...children) {
  const node = document.createElement(tag);
  if (name) node.className = name;
  node.append(...children);
  return node;
}
function button(name, label, press, key) {
  const node = make("button", name, label);
  node.type = "button";
  node.addEventListener("click", press);
  if (key) node.dataset.key = key;
  return node;
}
function jumpLink(id, label) {
  const link = make("a", "", label);
  link.href = `#part-${id}`;
  link.addEventListener("click", event => { event.preventDefault(); goTo(id); });
  return link;
}
function source(text) {
  if (!/^https?:/.test(text)) return make("span", "source", text);
  const link = make("a", "source", new URL(text).hostname);
  link.href = text;
  link.target = "_blank";
  link.rel = "noopener";
  return link;
}
function mockup(text) {
  const screen = make("pre");
  for (const bit of text.split(/(\[\[[^\]\n]+\]\]|\[[^\]\n]+\])/)) {
    const main = bit.match(/^\[\[(.+)\]\]$/), plain = bit.match(/^\[(.+)\]$/);
    screen.append(main ? make("span", "mock-button main", main[1]) : plain ? make("span", "mock-button", plain[1]) : bit);
  }
  return make("figure", "mock", make("div", "mock-bar", make("i"), make("i"), make("i")), screen);
}
function diff(text) {
  const kind = line => /^(\+\+\+|---)/.test(line) ? "file" : line.startsWith("@@") ? "hunk" : line.startsWith("+") ? "add" : line.startsWith("-") ? "remove" : "context";
  return make("pre", "diff", ...text.replace(/\n$/, "").split("\n").map(line => make("span", `diff-line diff-${kind(line)}`, line || " ")));
}
function content(part, text) {
  if (part.kind === "mockup") return mockup(text);
  if (part.kind === "diff") return diff(text);
  const tail = part.source ? [source(part.source)] : [];
  if (part.kind === "quote") return make("blockquote", "quote", make("p", "", text), make("cite", "", ...tail));
  const head = part.kind === "risk" ? [make("span", "risk-pill", "! Risk")] : part.kind && !QUIET_KINDS.has(part.kind) ? [make("span", "part-kind", part.kind)] : [];
  return make("p", "part-text", ...head, text, ...tail);
}
function facts(list, into, below) {
  for (const part of list || []) {
    const node = make("div", below ? "fact-below" : "", content(part, part.text));
    into.append(node);
    facts(part.parts, into, true);
  }
  return into;
}

// -- a stable element per Part, since the frame's navigation holds on to the ones it links to --------

const elements = new Map();

function skeleton(id) {
  const part = parts.get(id), isDecision = "pick" in part;
  const node = make(id.includes(".") ? "div" : "section", `tree-part${isDecision ? " tree-decision" : ""}`);
  node.id = `part-${id}`;
  node.tabIndex = -1;
  const body = make("div", "part-body");
  const children = make("div", `part-children${holdsDecision(id) ? " holds-decision" : ""}`);
  node.append(body, children);
  if (isDecision) node.append(make("div", "part-options"));
  elements.set(id, node);
  childIds(id).forEach(child => children.append(skeleton(child)));
  return node;
}

// A goal leads the overview, so the first screen says what the plan changes.
const isGoal = id => parts.get(id).kind === "goal" && !holdsDecision(id);

function tools(id) {
  const line = make("div", "part-tools");
  const tool = (label, press, disabled) => {
    const node = button("tool", label, press, `${label}:${id}`);
    if (disabled) node.setAttribute("aria-disabled", "true");
    return node;
  };
  const blocker = strikeBlocker(id);
  if (id in state.struck) line.append(tool("Unstrike", () => change(() => { delete state.struck[id]; })));
  else line.append(tool("Strike", () => blocker ? announce(`Decision ${blocker} depends on this, so it stays`) : openEditor("strike", id), blocker));
  line.append(tool("Comment", () => openEditor("comment", id)));
  if (id in state.edits) line.append(tool("Revert", () => change(() => { delete state.edits[id]; })));
  else line.append(tool("Edit", () => openEditor("edit", id)));
  return line;
}

function openEditor(kind, id) {
  editor = {kind, id, draft: kind === "edit" ? shownText(id) : kind === "other" ? state.others[id] || "" : ""};
  render();
}
function closeEditor() {
  editor = null;
  render();
}
function saveEditor() {
  const {kind, id} = editor, text = editor.draft.trim();
  if (!text) return;
  editor = null;
  change(() => {
    if (kind === "strike") state.struck[id] = text;
    if (kind === "comment") (state.comments[id] ||= []).push(text);
    if (kind === "other") { state.picks[id] = OTHER; state.others[id] = text; }
    if (kind === "edit" && text === parts.get(id).text) delete state.edits[id];
    else if (kind === "edit") state.edits[id] = text;
  });
}
function editorRow() {
  const label = {strike: "Why strike this?", comment: "Your comment", edit: "New text", other: "Your own option"}[editor.kind];
  const field = make("input", "editor-field");
  field.value = editor.draft;
  field.setAttribute("aria-label", label);
  field.placeholder = label;
  field.addEventListener("input", () => { editor.draft = field.value; });
  field.addEventListener("keydown", event => {
    if (event.key === "Enter") saveEditor();
    if (event.key === "Escape") { event.stopPropagation(); closeEditor(); }
  });
  return make("div", "editor", field, button("tool", "Save", saveEditor), button("tool", "Cancel", closeEditor));
}

function notes(id) {
  const list = [];
  if (id in state.struck) list.push(make("p", "note-line", make("b", "", "Struck: "), state.struck[id]));
  (state.comments[id] || []).forEach((text, i) => list.push(make("p", "note-line", make("b", "", "Comment: "), text,
    button("tool remove", "Remove", () => change(() => {
      state.comments[id].splice(i, 1);
      if (!state.comments[id].length) delete state.comments[id];
    }), `Remove:${id}:${i}`))));
  if (editor?.id === id && editor.kind !== "other") list.push(editorRow());
  return list;
}

function foldButton(id) {
  const count = childIds(id).length;
  return button("fold", opened.has(id) ? "Fold" : `${count} ${count === 1 ? "part" : "parts"}`, () => {
    if (opened.has(id)) opened.delete(id); else opened.add(id);
    render();
  }, `fold:${id}`);
}

function refName(ref) {
  const [target, name] = ref.split(".");
  const id = decisionOfName.get(target), decision = parts.get(id);
  return {id, option: options(decision).find(option => option.name === name).text, question: shownText(id)};
}
function reason(ref, needed, lead) {
  const {id, option, question} = refName(ref);
  const word = lead ?? (needed ? "Needs" : "Ruled out by");
  return [`${word} "${option}" in Decision ${id}: `, jumpLink(id, question)];
}

function decisionWord(id, entry) {
  if (isStruck(id)) return "struck";
  return entry.cause ? "not-needed" : entry.answered ? "answered" : isSettled(entry) ? "settled" : "waiting";
}

function renderPart(id, entries) {
  const part = parts.get(id), node = elements.get(id), entry = entries[id];
  const line = make("div", "part-line", make("span", "part-id", id));
  const main = make("div", "part-main", content(part, shownText(id)));
  const foldable = !entry && childIds(id).length && !holdsDecision(id);
  if (foldable) main.querySelector("p")?.append(foldButton(id));
  line.append(main, tools(id));
  const head = [];
  if (entry) {
    const word = decisionWord(id, entry);
    node.dataset.state = word;
    const held = state.picks[id] !== undefined && state.picks[id] !== OTHER && entry.blockers[state.picks[id] - 1];
    head.push(make("div", "decision-head", make("span", "", `Decision ${decisionIds.indexOf(id) + 1} of ${decisionIds.length}`), make("span", "decision-word", WORD[word])));
    if (entry.cause) head.push(make("p", "reason", ...reason(entry.cause, true, "Asked only with")));
    else if (word === "settled") head.push(make("p", "reason", `Only "${options(part)[entry.choice - 1].text}" is left, so the next plan holds it. `, button("fold", opened.has(id) ? "Fold" : "See why", () => { if (opened.has(id)) opened.delete(id); else opened.add(id); render(); }, `fold:${id}`)));
    else if (held) head.push(make("p", "reason", "Your earlier pick no longer holds, so this decision is open again."));
    else if (part.requires) head.push(make("p", "reason", ...reason(part.requires[0], true, "Asked because of")));
  }
  node.classList.toggle("struck", id in state.struck);
  node.querySelector(":scope > .part-body").replaceChildren(...head, line, ...notes(id));
  const children = node.querySelector(":scope > .part-children");
  children.hidden = childIds(id).length === 0 || (foldable && !opened.has(id));
  if (entry) renderOptions(id, entry, node.querySelector(":scope > .part-options"));
}

function renderOptions(id, entry, box) {
  const decision = parts.get(id);
  box.hidden = Boolean(entry.cause) || (isSettled(entry) && !opened.has(id));
  const rows = options(decision).map((option, i) => optionRow(id, i + 1, option, entry));
  const other = entry.choice === OTHER, chosen = other && entry.answered;
  const press = button("option-press", "", () => openEditor("other", id), `option:${id}:${OTHER}`);
  press.append(make("span", "option-number", String(rows.length + 1)), make("span", "option-label", chosen ? state.others[id] : "Other: write your own"));
  if (chosen) press.append(make("span", "option-tag", "Your pick"));
  const row = make("div", `option${chosen ? " picked" : ""}`, press);
  if (editor?.id === id && editor.kind === "other") row.append(make("div", "blocked-reason", editorRow()));
  box.replaceChildren(...rows, row);
}

function optionRow(id, position, option, entry) {
  const blocker = entry.blockers[position - 1], chosen = entry.choice === position, picked = chosen && entry.answered;
  const press = button("option-press", "", () => pick(id, position), `option:${id}:${position}`);
  press.dataset.option = `${id}:${position}`;
  press.append(make("span", "option-number", blocker ? "⊘" : String(position)), make("span", "option-label", option.text));
  if (picked) press.append(make("span", "option-tag", "Your pick"));
  if (position === 1) press.append(make("span", "option-tag", "Agent's pick"));
  if (chosen && !picked && position !== 1) press.append(make("span", "option-tag", "In force"));
  if (blocker) press.append(make("span", "option-tag", "Blocked"));
  press.setAttribute("aria-pressed", String(picked));
  if (blocker) press.setAttribute("aria-disabled", "true");
  const row = make("div", `option${picked ? " picked" : chosen ? " default" : ""}${blocker ? " blocked" : ""}`, press);
  if (blocker) row.append(make("p", "blocked-reason", ...reason(blocker, (option.requires || []).includes(blocker))));
  if (option.parts?.length) row.append(facts(option.parts, make("div", "option-facts")));
  if (!blocker) {
    row.addEventListener("pointerenter", () => preview(id, position));
    row.addEventListener("pointerleave", endPreview);
    row.addEventListener("focusin", () => preview(id, position));
    row.addEventListener("focusout", endPreview);
  }
  return row;
}

function pick(id, position) {
  const entries = evaluate(state.picks), entry = entries[id];
  if (entry.blockers[position - 1]) return announce(`Blocked: pick stays as it was`);
  if (entry.answered && entry.choice === position) return;
  const key = `option:${id}:${position}`;
  const top = document.querySelector(`[data-key="${key}"]`).getBoundingClientRect().top;
  const next = {...state.picks, [id]: position};
  const changed = changes(next);
  change(() => { state.picks[id] = position; lastChange = changed; });
  // A pick may fold a row above this one, so the page moves back to leave the pressed row under the hand.
  scrollBy(0, document.querySelector(`[data-key="${key}"]`).getBoundingClientRect().top - top);
  const others = Object.keys(changed).length;
  announce(`Picked. ${summary(state.picks, state.struck).left} left${others ? `, ${others} other changed` : ""}. Undo takes it back.`);
}

// -- one highlight, fed by a hover, a keyboard focus and a pick ---------------------------------------

function changes(next) {
  const before = evaluate(state.picks), after = evaluate(next), out = {};
  for (const id of decisionIds) {
    const was = before[id], now = after[id];
    if (next[id] === state.picks[id] && JSON.stringify([was.cause, was.blockers, was.choice]) !== JSON.stringify([now.cause, now.blockers, now.choice]))
      out[id] = was.cause && !now.cause ? "opens" : !was.cause && now.cause ? "closes" : isSettled(now) && !isSettled(was) ? "settles" : "changes";
  }
  return out;
}

function showMarks(marks, previewing) {
  document.getElementById("frame-nav").classList.toggle("previewing", previewing);
  for (const id of decisionIds) {
    const link = document.querySelector(`.frame-nav a[href="#part-${id}"]`);
    for (const node of [link, elements.get(id)]) {
      if (marks[id]) node.dataset.effect = marks[id]; else delete node.dataset.effect;
    }
  }
}

function showStat(id, value, next, label, lead = "") {
  const delta = next - value;
  const shown = delta ? [" ", make("span", "delta", `(${delta > 0 ? "+" : ""}${delta})`)] : [];
  document.getElementById(id).replaceChildren(make("b", "", `${lead}${next}`), ...shown, ...label(next));
}

function showNumbers(now, next) {
  showStat("tree-left", now.left, next.left, n => [make("span", "long", n === 1 ? " decision" : " decisions"), " left"]);
  showStat("tree-risks", now.risks, next.risks, n => [n === 1 ? " risk" : " risks"]);
  const files = document.getElementById("tree-files");
  files.hidden = now.files === null;
  if (now.files !== null) showStat("tree-files", now.files, next.files, n => [n === 1 ? " file" : " files", make("span", "long", " (estimate)")], "~");
}

function preview(id, position) {
  if (state.picks[id] === position) return endPreview();
  const next = {...state.picks, [id]: position};
  showNumbers(summary(state.picks, state.struck), summary(next, state.struck));
  showMarks(changes(next), true);
}
function endPreview() {
  const now = summary(state.picks, state.struck);
  showNumbers(now, now);
  showMarks(lastChange, false);
}

// -- moving through the Decisions -------------------------------------------------------------------

function goTo(id) {
  const node = elements.get(id);
  current = id;
  for (const other of decisionIds) elements.get(other).classList.toggle("current", other === id);
  node.scrollIntoView({block: "start"});
  node.focus({preventScroll: true});
  node.classList.remove("flash");
  void node.offsetWidth;
  node.classList.add("flash");
}
const inView = id => {
  const box = elements.get(id).getBoundingClientRect();
  return box.bottom > 100 && box.top < innerHeight;
};
const live = () => { const entries = evaluate(state.picks); return decisionIds.filter(id => !entries[id].cause && !isStruck(id)); };
const currentDecision = () => current && inView(current) ? current : live().find(inView);

function nextOpen() {
  const entries = evaluate(state.picks);
  const open = decisionIds.find(id => isWaiting(entries[id]) && !isStruck(id));
  if (open) goTo(open);
}
function move(step) {
  const list = live(), at = list.indexOf(currentDecision());
  const target = list[Math.min(list.length - 1, Math.max(0, at + step))];
  if (target) goTo(target);
}
function pressNumber(n) {
  const id = currentDecision();
  if (!id) return;
  const count = options(parts.get(id)).length;
  if (n <= count) pick(id, n);
  else if (n === count + 1) openEditor("other", id);
}
function undo() {
  if (!history.length) return;
  state = JSON.parse(history.pop());
  lastChange = {};
  save();
  render();
  announce("Undone");
}
function reset() {
  editor = null;
  lastChange = {};
  history.push(JSON.stringify(state));
  state = blank();
  save();
  render();
}

addEventListener("keydown", event => {
  if (event.metaKey || event.ctrlKey || event.altKey || event.target.closest("input, textarea")) return;
  if (/^[1-9]$/.test(event.key)) pressNumber(Number(event.key));
  else if (event.key === "j") move(1);
  else if (event.key === "k") move(-1);
  else if (event.key === "n") nextOpen();
  else if (event.key === "u") undo();
});

// -- the page -----------------------------------------------------------------------------------------

// Set once, so a row never moves under the hand; what a later visit finds open comes first.
const queueOrder = (() => {
  const entries = evaluate(state.picks);
  return [...decisionIds].sort((a, b) => isWaiting(entries[b]) - isWaiting(entries[a]));
})();

function pickLabel(id, entry) {
  if (entry.choice === OTHER) return ["Your own", state.others[id]];
  if (entry.choice === null) return ["No option left", "Write your own"];
  const text = options(parts.get(id))[entry.choice - 1].text;
  return [entry.answered ? "Your pick" : entry.choice === 1 ? "Agent's pick" : "In force", text];
}

function renderOverview(entries) {
  const rows = queueOrder.filter(id => !isStruck(id) && (entries[id].answered || isWaiting(entries[id]))).map(id => {
    const [label, text] = pickLabel(id, entries[id]), word = decisionWord(id, entries[id]);
    const link = make("a", "", make("span", "row-mark", MARK[word]), make("span", "row-question", shownText(id)),
      make("span", "row-pick", make("small", "", `${label}: `), text));
    link.href = `#part-${id}`;
    link.addEventListener("click", event => { event.preventDefault(); goTo(id); });
    return make("li", word, link);
  });
  document.getElementById("tree-queue").replaceChildren(...rows);
  const counted = word => decisionIds.filter(id => decisionWord(id, entries[id]) === word);
  const settled = counted("settled"), unneeded = counted("not-needed"), folded = [];
  if (settled.length) folded.push(`${settled.length} auto-settled: `, ...settled.flatMap((id, i) => [...(i ? ", " : ""), jumpLink(id, shownText(id))]), ". ");
  if (unneeded.length) folded.push(`${unneeded.length} not needed now: `, ...unneeded.flatMap((id, i) => [...(i ? ", " : ""), jumpLink(id, shownText(id))]), ".");
  document.getElementById("tree-folded").replaceChildren(...folded);
}

function renderNav(entries) {
  for (const id of decisionIds) {
    const link = document.querySelector(`.frame-nav a[href="#part-${id}"]`), word = decisionWord(id, entries[id]);
    link.dataset.state = word;
    link.dataset.mark = MARK[word];
    link.title = WORD[word];
  }
}

function render() {
  const focused = document.activeElement?.dataset.key;
  const entries = evaluate(state.picks);
  for (const id of parts.keys()) renderPart(id, entries);
  renderOverview(entries);
  renderNav(entries);
  endPreview();
  const left = summary(state.picks, state.struck).left;
  const next = document.getElementById("tree-next"), finish = document.getElementById("tree-finish");
  next.disabled = left === 0;
  next.classList.toggle("primary", left > 0);
  finish.classList.toggle("primary", left === 0);
  document.getElementById("tree-undo").disabled = history.length === 0;
  if (editor) document.querySelector(".editor-field").focus();
  else if (focused) document.querySelector(`[data-key="${focused}"]`)?.focus({preventScroll: true});
}

document.getElementById("tree-title").textContent = plan.title;
[...parts.keys()].filter(id => !id.includes(".")).forEach(id => {
  document.getElementById(isGoal(id) ? "tree-goal" : "tree-parts").append(skeleton(id));
});
document.getElementById("tree-next").addEventListener("click", nextOpen);
document.getElementById("tree-undo").addEventListener("click", undo);
document.getElementById("tree-finish").addEventListener("click", () => document.getElementById("frame-copy").click());
render();
start({copy: answerText, reset});
</script>
